          closePopover({ restoreFocus: false });
        } catch (error) {
          errorBox.textContent = errorMessage(error);
          errorBox.hidden = false;
        }
      }
    },
      fields.hasSource ? fields.element : el('p', { class: 'empty', text: 'There is no other pot in this currency to move from.' }),
      errorBox,
      fields.hasSource && el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Move and save' }));

    const choices = el('div', { class: 'form-actions' },
      el('button', {
        type: 'button', class: 'btn-secondary', text: 'Move now',
        onclick: () => { choices.hidden = true; moveForm.hidden = false; moveForm.querySelector('select, input')?.focus(); }
      }),
      el('button', {
        type: 'button', class: 'btn-primary', text: 'OK',
        onclick: () => { answer = { state: next, moved: null }; closePopover({ restoreFocus: false }); }
      }));

    openPopover({
      anchor, label: 'Below zero', role: 'dialog', onClose: () => resolve(answer),
      content: el('div', { class: 'pot-sheet' },
        el('p', { class: 'pot-warning', text: `This takes ${pot.name} to ${potMoney(warning.balance, pot)}.` }),
        el('p', { class: 'hint', text: 'Nothing moves unless you choose it. With OK the expense is saved and the pot stays red until it is covered.' }),
        choices, moveForm)
    });
    choices.querySelector('.btn-primary').focus();
  });
}

// ---------------------------------------------------------------------------
// Distribute salary (the monthly payday flow)
// ---------------------------------------------------------------------------

/**
 * First step: choose a salary that has not been shared out yet.
 * A salary is recorded on Today, as income in the Salary category.
 */
function openDistribute(anchor) {
  const state = ledger.state;
  const waiting = unallocatedSalaries(state);
  const accountName = id => state.accounts.find(a => a.id === id)?.name || 'No account';

  const list = waiting.length > 0 && el('ul', { class: 'plain-list' }, waiting.slice(0, 6).map(entry => el('li', { class: 'list-row' },
    el('span', { class: 'entry-text' },
      el('span', { class: 'entry-title', text: `${formatDay(entry.date)} ${entry.date.slice(0, 4)}` }),
      el('span', { class: 'entry-meta', text: accountName(entry.account) })),
    el('span', { class: 'entry-amount is-income', text: formatMoney(entry.minor, entry.currency, entry.precision) }),
    el('button', {
      type: 'button', class: 'btn-secondary btn-small', text: 'Preview',
      onclick: () => openPaydayPreview(anchor, entry)
    }))));

  openPopover({
    anchor, label: 'Distribute salary', role: 'dialog',
    content: el('div', { class: 'pot-sheet' },
      waiting.length > 0
        ? el('div', { class: 'day-head' }, el('span', { text: 'Not shared out yet' }))
        : el('p', { class: 'empty', text: 'No salary is waiting to be shared out.' }),
      list,
      el('p', { class: 'hint', text: 'To add a salary, record it on Today as income in the Salary category. The preview opens when you save it.' }),
      el('a', { class: 'btn-text', href: '#today', text: 'Go to Today', onclick: () => closePopover({ restoreFocus: false }) }))
  });
}

/**
 * Second step: the four lines, each editable, then Confirm.
 * Also opened from Today straight after a salary is saved.
 */
function openPaydayPreview(anchor, entry) {
  const state = ledger.state;
  let preview;
  try {
    preview = paydayFlowPreview(state, entry, todayIso());
  } catch (error) {
    closePopover({ restoreFocus: false });
    showToast(errorMessage(error));
    return;
  }

  const { currency: code, precision } = preview.entry;
  const money = minor => formatMoney(minor, code, precision);
  const salary = preview.salary;
  const until = formatDay(preview.period.to);
  const inputs = new Map();
  let leftoverEdited = false;

  const remainingText = el('p', { class: 'pf-remaining', role: 'status' });
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });
  const confirm = el('button', { type: 'submit', class: 'btn-primary', text: 'Confirm' });

  /** What each line means, and what it is short by. */
  function lineDetail(line) {
    const notCounted = line.missing > 0 ? ` ${line.missing} in another currency not counted.` : '';
    if (line.step === 'savings') {
      const rule = preview.savings;
      if (rule.fixedMinor === 0 && rule.percent === 0) return 'No savings portion is set yet (Settings → Payday).';
      if (rule.percent === 0) return 'Your set amount.';
      const base = rule.percentBase === 'disposable'
        ? `disposable income (${money(rule.base)} after fixed and regulars)`
        : `the salary (${money(rule.base)})`;
      return `${rule.fixedMinor > 0 ? `${money(rule.fixedMinor)} plus ` : ''}${percentText(rule.percent)}% of ${base}: ${money(rule.percentPart)}.`;
    }
    if (line.step === 'fixed') return `Due until ${until}: ${money(line.target)}. In the pot now: ${money(line.balance)}.${notCounted}`;
    if (line.step === 'regulars') return `Weekly estimates until ${until}: ${money(line.target)}. In the pot now: ${money(line.balance)}.${notCounted}`;
    return 'Whatever the steps above leave.';
  }

  /** The amounts as typed, or null while one of them cannot be read. */
  function readAmounts() {
    const amounts = {};
    try {
      for (const [step, input] of inputs) amounts[step] = potAmountInput(input.value, code);
    } catch {
      return null;
    }
    return amounts;
  }

  /** Keep the last line and the running total in step with the edits. */
  function update(editedStep) {
    if (editedStep === 'leftover') leftoverEdited = true;
    let amounts = readAmounts();
    if (amounts && !leftoverEdited && editedStep) {
      const others = BigInt(amounts.savings) + BigInt(amounts.fixed) + BigInt(amounts.regulars);
      const rest = salary > others ? salary - others : 0n;
      inputs.get('leftover').value = plainAmount(rest, precision);
      amounts = readAmounts();
    }
    if (!amounts) {
      remainingText.textContent = 'Check the amounts: one of them is not a number.';
      remainingText.classList.add('is-negative');
      confirm.disabled = true;
      return;
    }
    const total = Object.values(amounts).reduce((sum, minor) => sum + BigInt(minor), 0n);
    const over = total > salary;
    remainingText.textContent = over
      ? `Over the salary by ${money(total - salary)}.`
      : total === salary ? 'All of the salary is shared out.' : `Not shared out: ${money(salary - total)}. It stays outside the pots.`;
    remainingText.classList.toggle('is-negative', over);
    confirm.disabled = over || total === 0n;
  }

  const rows = preview.lines.map((line, index) => {
    const id = `pf-${line.step}`;
    const input = el('input', {
      id, type: 'text', inputMode: 'decimal', autocomplete: 'off', class: 'pf-amount',
      value: plainAmount(line.funded, precision), oninput: () => update(line.step)
    });
    inputs.set(line.step, input);
    return el('li', { class: 'pf-line' + (line.shortfall > 0n ? ' is-short' : '') },
      el('label', { for: id, class: 'pf-label' },
        el('span', { class: 'pf-step', text: String(index + 1) }),
        el('span', { text: line.step === 'leftover' ? `What is left → ${line.potName}`
          : line.step === 'savings' ? `${savingsRuleLabel(preview.savings, code, precision)} → ${line.potName}`
          : `${line.label} → ${line.potName}` })),
      input,
      el('p', { class: 'hint pf-detail', text: lineDetail(line) }),
      line.shortfall > 0n && el('p', { class: 'pf-short', text: `Short by ${money(line.shortfall)}.` }));
  });

  const form = el('form', {
    class: 'pot-sheet pf', novalidate: true,
    onsubmit: async event => {
      event.preventDefault();
      if (confirm.disabled) return;
      try {
        const amounts = readAmounts();
        if (!amounts) throw Error('Check the amounts: one of them is not a number.');
        // One batch, tied to the salary entry: a second attempt is refused by the ledger.
        const next = confirmPaydayFlow(ledger.state, preview.entry, amounts);
        confirm.disabled = true;
        closePopover({ restoreFocus: false });
        await saveLedger(next);
        showToast('Salary shared out between your pots. No bank account changed.');
      } catch (error) {
        confirm.disabled = false;
        errorBox.textContent = errorMessage(error);
        errorBox.hidden = false;
        if (!form.isConnected) showToast(errorMessage(error));
      }
    }
  },
    el('p', { class: 'note', text: `Salary of ${money(salary)} on ${formatDay(preview.entry.date)}. Change any line before you confirm.` }),
    preview.short.length > 0 && el('p', { class: 'pf-short', text: 'This salary does not cover every step. They are filled in order; nothing is taken from savings.' }),
    el('ol', { class: 'plain-list pf-lines' }, rows),
    remainingText, errorBox,
    el('div', { class: 'form-actions' },
      confirm,
      el('button', { type: 'button', class: 'btn-secondary', text: 'Not now', onclick: () => closePopover() })));

  update('');
  openPopover({ anchor, label: 'Payday preview', role: 'dialog', content: form });
}

// ---------------------------------------------------------------------------
// Three-month rollover, when the app opens
// ---------------------------------------------------------------------------

/**
 * Move unused funding that is past its months into savings, for the pots
 * the user switched this on for. Shows what moved, with Undo. Doing it again
 * moves nothing more.
 */
async function runRolloverOnOpen() {
  try {
    const { state, moved } = applyRollover(ledger.state, todayIso());
    if (!moved.length) return;
    await saveLedger(state);

    const ids = moved.map(move => move.id);
    // One line per pot, never adding currencies together.
    const byPot = new Map();
    for (const move of moved) {
      const line = byPot.get(move.pot) || { ...move, minor: 0n };
      line.minor += move.minor;
      byPot.set(move.pot, line);
    }
    const parts = [...byPot.values()].map(line => `${formatMoney(line.minor, line.currency, line.precision)} from ${line.potName} to ${line.toName}`);
    showToast(`Unused money rolled over: ${parts.join('; ')}.`, {
      label: 'Undo',
      run: async () => {
        try {
          await saveLedger(undoRollover(ledger.state, ids));
          showToast('Put back. Those months stay in their pots.');
        } catch (error) {
          showToast(errorMessage(error));
        }
      }
    }, 20000);
  } catch (error) {
    showToast(errorMessage(error));
  }
}

/** The form for a new estimate (`estimate` null) or an existing one. */
function estimateForm(state, estimate, rerender) {
  const key = estimate ? estimate.id : 'new';
  const code = estimate?.currency || state.settings.reportingCurrency;
  const name = el('input', { id: `est-name-${key}`, type: 'text', maxLength: 150, value: estimate?.name || '' });
  const amount = el('input', {
    id: `est-amount-${key}`, type: 'text', inputMode: 'decimal', autocomplete: 'off',
    value: estimate ? plainAmount(estimate.amountMinor, digits(estimate.currency)) : ''
  });
  const codes = [...new Set([...state.settings.activeCurrencies, code])];
  const currencySelect = el('select', { id: `est-currency-${key}` }, codes.map(value => el('option', { value, text: value })));
  currencySelect.value = code;
  const categories = state.categories.filter(c => c.kind === 'expense' && (!c.archived || c.id === estimate?.category))
    .map(c => ({ id: c.id, path: categoryPath(state, c.id) }))
    .sort((a, b) => a.path.localeCompare(b.path));
  const category = el('select', { id: `est-category-${key}` },
    el('option', { value: '', text: 'No category' }),
    categories.map(c => el('option', { value: c.id, text: c.path })));
  category.value = estimate?.category || '';
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });

  async function submit(event) {
    event.preventDefault();
    try {
      if (!name.value.trim()) throw Error('Give the estimate a name.');

        id: estimate?.id || 'estimate:' + uid(), name: name.value.trim(), category: category.value,

      };
      if (!(record.amountMinor > 0)) throw Error('Enter an amount above zero.');
      estimateView.editingId = '';
      // The first change turns the starting pair into the user's own saved list.
      await saveSettings(settings => {
        const next = estimatesOf(ledger.state).filter(e => e.id !== record.id);
        const at = estimate ? estimatesOf(ledger.state).findIndex(e => e.id === record.id) : next.length;
        next.splice(at < 0 ? next.length : at, 0, record);
        settings.estimates = next;
      });
      showToast(estimate ? 'Estimate saved.' : 'Estimate added.');
    } catch (error) {
      errorBox.textContent = errorMessage(error);
      errorBox.hidden = false;

  // The fields sit in the same columns as an estimate row: name, category, amount, then the currency.
  const field = (control, label, place) => el('div', { class: `field est-${place}` }, el('label', { for: control.id, text: label }), control);
  return el('form', { class: estimate ? 'ed-edit' : 'fold-body', onsubmit: submit, novalidate: true },
    el('div', { class: 'est-form' },

      field(category, 'Category', 'category'),
      field(amount, 'Each week', 'amount'),
      field(currencySelect, 'Currency', 'currency')),
    el('p', { class: 'hint', text: 'The category is used to compare last month\'s estimate with what you recorded, and to find the pot it draws on.' }),
    errorBox,
    el('div', { class: 'ed-edit-actions' },
      el('button', { type: 'submit', class: 'btn-primary btn-small', text: estimate ? 'Save' : 'Add estimate' }),
      estimate && el('button', { type: 'button', class: 'btn-text', text: 'Cancel', onclick: () => { estimateView.editingId = ''; rerender(); } }),
      estimate && el('button', {

          saveQuietly(settings => { settings.estimates = estimatesOf(ledger.state).filter(e => e.id !== estimate.id); }, 'Estimate removed.');
        }

}

// View state kept between re-renders: the pot being edited.
const potsView = { editingId: '' };

const POT_KINDS = [['budget', 'Budget'], ['savings', 'Savings']];

/** A name that is not empty and not already used by another pot. */
function checkedPotName(raw, pots, ownId) {
  const name = raw.trim();
  if (!name) throw Error('Give the pot a name.');
  if (name.length > 150) throw Error('That name is too long.');
  if (pots.some(p => p.id !== ownId && p.name.trim().toLowerCase() === name.toLowerCase())) throw Error('Another pot already has that name.');
  return name;
}

/** Where a pot is still needed, as text for a message; '' when it is free to archive. */
function potInUse(state, pot) {
  const flow = paydayFlowSetting(state);
  const step = PAYDAY_FLOW_STEPS.find(s => flow[s.potKey] === pot.id);
  if (step) return `the payday flow ("${step.label}")`;
  const feeder = state.pots.find(p => !p.archived && rolloverSetting(p).enabled && rolloverSetting(p).to === pot.id);
  if (feeder) return `the rollover of ${feeder.name}`;
  if (state.settings.savingsPot === pot.id) return 'the default savings setting';
  return '';
}

/** Rename, icon, rollover and archive for one pot. */
function potEditForm(state, pot, rerender) {
  const rollover = rolloverSetting(pot);
  const name = el('input', { id: 'pot-name', type: 'text', maxLength: 150, value: pot.name });
  const icon = iconField(pot);
  const targets = state.pots.filter(p => !p.archived && p.id !== pot.id && p.kind === 'savings' && p.currency === pot.currency && p.precision === pot.precision);

  const enabled = el('input', { type: 'checkbox', checked: rollover.enabled && targets.length > 0, disabled: !targets.length });
  const to = el('select', { id: 'pot-rollover-to', 'aria-label': 'Rollover goes to' }, targets.map(p => el('option', { value: p.id, text: p.name })));
  const preferredTarget = [rollover.to, state.settings.savingsPot].find(id => targets.some(p => p.id === id));
  if (preferredTarget) to.value = preferredTarget;
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });

  const fail = error => { errorBox.textContent = errorMessage(error); errorBox.hidden = false; };

  async function save(event) {
    event.preventDefault();
    try {
      const record = { ...pot, name: checkedPotName(name.value, ledger.state.pots, pot.id) };
      const chosenIcon = icon.getValue();
      if (chosenIcon !== undefined) record.icon = chosenIcon;
      if (enabled.checked) record.rollover = { enabled: true, months: rollover.months, to: to.value };
      else if (pot.rollover) record.rollover = { ...rollover, enabled: false };
      potsView.editingId = '';
      await saveLedger(commit(ledger.state, 'pots', record));
      showToast('Pot saved.');
    } catch (error) {
      potsView.editingId = pot.id;
      fail(error);
    }
  }

  async function setArchived(archived) {
    try {
      const use = archived ? potInUse(ledger.state, pot) : '';
      if (use) throw Error(`${pot.name} is used by ${use}. Choose another pot there first.`);
      const record = { ...pot, archived };
      if (archived && pot.rollover) record.rollover = { ...rollover, enabled: false };
      potsView.editingId = '';
      await saveLedger(commit(ledger.state, 'pots', record));
      showToast(archived ? `${pot.name} archived. Its records are kept.` : `${pot.name} is back.`);
    } catch (error) {
      potsView.editingId = pot.id;
      fail(error);
    }
  }

  return el('form', { class: 'ed-edit', onsubmit: save, novalidate: true },
    el('div', { class: 'field' }, el('label', { for: 'pot-name', text: 'Name' }), name),
    icon.element,
    el('div', { class: 'pot-rollover' },
      el('label', { class: 'check-row' }, enabled,
        el('span', { text: `After ${rollover.months} months unused, move what is left to` })),
      to),
    !targets.length && el('p', { class: 'hint', text: 'Rollover needs another savings pot in the same currency.' }),
    el('p', { class: 'hint', text: 'Checked when the app opens. Spending uses the oldest money first; only money older than the months above moves, and you can undo it.' }),
    errorBox,
    el('div', { class: 'ed-edit-actions' },
      el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Save' }),
      el('button', { type: 'button', class: 'btn-text', text: 'Cancel', onclick: () => { potsView.editingId = ''; rerender(); } }),
      pot.archived
        ? el('button', { type: 'button', class: 'btn-text', text: 'Restore', onclick: () => setArchived(false) })
        : el('button', { type: 'button', class: 'btn-text', text: 'Archive', onclick: () => setArchived(true) })));

// ---------------------------------------------------------------------------
// Settings → Payday: the payday flow
// ---------------------------------------------------------------------------

function buildPaydayFlowSettings() {
  const state = ledger.state;
  const flow = paydayFlowSetting(state);
  const pots = state.pots.filter(p => !p.archived);
  const codeOf = potId => state.pots.find(p => p.id === potId)?.currency || state.settings.reportingCurrency;

  const potSelect = (id, value) => {
    const select = el('select', { id }, pots.map(p => el('option', { value: p.id, text: p.name })));
    if (pots.some(p => p.id === value)) select.value = value;
    return select;
  };
  const savingsPot = potSelect('flow-savings-pot', flow.savingsPot);
  const fixedPot = potSelect('flow-fixed-pot', flow.fixedPot);
  const regularsPot = potSelect('flow-regulars-pot', flow.regularsPot);
  const leftoverPot = potSelect('flow-leftover-pot', flow.leftoverPot);

  // The savings portion: a fixed amount and a percentage, added together. Either may be left empty.
  const fixedAmount = el('input', {
    id: 'flow-savings-fixed', type: 'text', inputMode: 'decimal', autocomplete: 'off', placeholder: '0.00',
    value: flow.savings.fixedMinor > 0 ? plainAmount(flow.savings.fixedMinor, digits(codeOf(flow.savingsPot))) : ''
  });
  const fixedLabel = el('label', { for: 'flow-savings-fixed' });
  // A percentage is kept in hundredths of a percent, so 12.5% is exact.
  const percent = el('input', {
    id: 'flow-savings-percent', type: 'text', inputMode: 'decimal', autocomplete: 'off', placeholder: '0',
    value: flow.savings.percent > 0 ? percentText(flow.savings.percent) : ''
  });
  const percentBase = el('select', { id: 'flow-savings-base', 'aria-label': 'Percentage of' },
    el('option', { value: 'total', text: 'of total income' }),
    el('option', { value: 'disposable', text: 'of disposable income (after fixed and regulars)' }));
  percentBase.value = flow.savings.percentBase;
  const example = el('p', { class: 'hint', role: 'status' });
  const order = el('p', { class: 'hint' });
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });

  /** The typed savings rule in its stored shape; an empty field is zero. */
  function readSavings() {
    const empty = text => !text || /^0*(?:[.,]0*)?$/.test(text);
    const amountText = fixedAmount.value.trim();
    const percentTyped = percent.value.trim();
    let hundredths = 0;
    if (!empty(percentTyped)) {
      const match = /^(\d{1,3})(?:[.,](\d{1,2}))?$/.exec(percentTyped);
      hundredths = match ? Number(match[1]) * 100 + Number((match[2] || '').padEnd(2, '0')) : NaN;
      if (!Number.isInteger(hundredths) || hundredths > 10000) throw Error('Enter a percentage from 0 to 100, with at most two decimals.');
    }
    return {
      fixedMinor: empty(amountText) ? 0 : parseAmount(amountText, codeOf(savingsPot.value)),
      percent: hundredths,
      percentBase: percentBase.value === 'disposable' ? 'disposable' : 'total'
    };
  }

  /** The labels, the order of the steps and a worked example, kept in step with the form. */
  function showSavings() {
    const code = codeOf(savingsPot.value);
    fixedLabel.textContent = `Fixed amount (${code})`;
    order.textContent = percentBase.value === 'disposable'
      ? 'Order: fixed expenses, regulars, savings, then what is left.'
      : 'Order: savings, fixed expenses, regulars, then what is left.';
    let text = '';
    try {
      const savings = readSavings();
      const sample = savingsExample(state, savings);
      if (sample && sample.entry.currency === code) {
        const money = minor => formatMoney(minor, sample.entry.currency, sample.entry.precision);
        const sum = [
          savings.fixedMinor > 0 && money(sample.fixedPart),
          savings.percent > 0 && `${percentText(savings.percent)}% of ${money(sample.base)}`
        ].filter(Boolean).join(' + ');
        text = sum
          ? `Example, your last salary of ${money(sample.salary)}: ${sum} = ${money(sample.requested)} to savings.`
          : `Example, your last salary of ${money(sample.salary)}: nothing goes to savings yet.`;
      }
    } catch {
      text = ''; // the fields cannot be read yet; Save explains why
    }
    example.textContent = text;
    example.hidden = !text;
  }
  for (const control of [fixedAmount, percent]) control.addEventListener('input', showSavings);
  for (const control of [percentBase, savingsPot]) control.addEventListener('change', showSavings);
  showSavings();

  async function submit(event) {
    event.preventDefault();
    try {
      const next = {
        savingsPot: savingsPot.value, savings: readSavings(),
        fixedPot: fixedPot.value, regularsPot: regularsPot.value, leftoverPot: leftoverPot.value
      };
      const codes = new Set([next.savingsPot, next.fixedPot, next.regularsPot, next.leftoverPot].map(codeOf));
      if (codes.size > 1) throw Error('Choose pots in one currency; nothing is converted between pots.');
      await saveSettings(settings => { settings.paydayFlow = next; });
      showToast('Payday flow saved.');
    } catch (error) {
      errorBox.textContent = errorMessage(error);
      errorBox.hidden = false;
    }
  }

  const field = (label, control) => el('div', { class: 'field' }, el('label', { for: control.id, text: label }), control);
  return el('form', { class: 'flow-form', onsubmit: submit, novalidate: true },
    el('p', { class: 'note', text: 'When a salary is shared out, the steps are filled in this order. You see a preview and can change every line before anything is saved.' }),
    field('Savings go to', savingsPot),
    el('div', { class: 'field-pair' },
      el('div', { class: 'field' }, fixedLabel, fixedAmount),
      el('div', { class: 'field' }, el('label', { for: 'flow-savings-percent', text: 'Percentage (%)' }), percent)),
    el('div', { class: 'field' }, percentBase),
    el('p', { class: 'hint', text: 'Savings are the fixed amount plus the percentage. Leave either empty if you do not use it.' }),
    example,
    el('div', { class: 'field-pair' }, field('Fixed expenses pot', fixedPot), field('Regulars pot', regularsPot)),
    field('What is left goes to', leftoverPot),
    order,
    el('p', { class: 'hint', text: 'Fixed expenses is filled up to what is due before the next payday; Regulars up to your weekly estimates. If the salary is short, later steps get less. Savings are never drawn on automatically.' }),
    errorBox,
    el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Save payday flow' }));
}

// ---- ui/settings.js ----
// Settings, one section at a time: accounts, currencies,
// categories, pots, payday, estimates, sync, and the way back to the previous version.
// Each section has its own address (#settings/estimates), so Back and a
// reload return to it.













const ACCOUNT_TYPES = [
  ['current', 'Current account'],
  ['savings', 'Savings account'],
  ['credit_card', 'Credit card'],
  ['cash_wallet', 'Cash wallet'],
  ['investment', 'Investment']
];

// View state kept between re-renders: the account whose icon is being changed.
const accountView = { iconFor: '' };

// The sections, in tab order. The first one opens for a bare '#settings'.
const SECTIONS = [
  { id: 'accounts', label: 'Accounts', build: rerender => [buildAccounts(rerender)] },
  { id: 'currencies', label: 'Currencies', build: rerender => [buildCurrencies(rerender)] },
  { id: 'categories', label: 'Categories', build: rerender => [buildCategoryEditor(rerender)] },
  { id: 'pots', label: 'Pots', build: rerender => [buildPotsSettings(rerender)] },
  { id: 'payday', label: 'Payday', build: () => [buildPaydaySettings(), sectionTitle('Payday flow'), buildPaydayFlowSettings()] },
  { id: 'estimates', label: 'Estimates', build: rerender => [buildEstimates(rerender)] },
  { id: 'sync', label: 'Sync', title: 'Google Sheets sync', build: rerender => [buildSync(rerender)] },
  {
    id: 'data', label: 'Data', title: 'Previous version', build: () => [
      el('p', { class: 'note', text: 'Recurring payments, transfers and backups still live in the previous version while this one is rebuilt. Both use the same records.' }),
      el('a', { class: 'btn-secondary', href: LEGACY_URL, text: 'Open previous version' }),
      el('p', { class: 'note data-note', text: 'Your records stay in this browser on this device. They are sent only to your own Google Sheet, and only after you connect one under Sync.' })
    ]
  }
];

/** Draw Settings with the section named in the address (`sectionId`) open. */
function renderSettings(root, sectionId = '') {
  const section = SECTIONS.find(s => s.id === sectionId) || SECTIONS[0];
  const rerender = () => { root.replaceChildren(); renderSettings(root, section.id); };

  const tabs = el('nav', { class: 'set-tabs', 'aria-label': 'Settings sections' },
    SECTIONS.map(s => el('a', {
      class: 'set-tab', href: `#settings/${s.id}`, text: s.label,
      'aria-current': s.id === section.id ? 'page' : null, 'data-focus': `set-tab:${s.id}`
    })));

  root.append(slip({ label: 'Settings', kind: 'This device', wide: true },
    el('div', { class: 'set-layout' },
      tabs,
      el('div', { class: 'set-panel' }, sectionTitle(section.title || section.label), ...section.build(rerender)))));

  // Phone: bring the open tab into view inside the strip without moving the page.
  const current = tabs.querySelector('[aria-current="page"]');
  if (current && tabs.scrollWidth > tabs.clientWidth) tabs.scrollLeft = current.offsetLeft - (tabs.clientWidth - current.offsetWidth) / 2;
}

function buildAccounts(rerender) {
  const state = ledger.state;
  const today = todayIso();
  const accounts = state.accounts.filter(a => !a.archived);
  const typeLabel = Object.fromEntries(ACCOUNT_TYPES);

  const list = accounts.length
    ? el('ul', { class: 'plain-list' }, accounts.map(account => el('li', {},
        el('div', { class: 'list-row' },
          el('span', { class: 'entry-text' },
            el('span', { class: 'entry-title' }, accountIconNode(account), el('span', { text: account.name })),
            el('span', { class: 'entry-meta', text: `${typeLabel[account.type] || account.type} · ${account.currency}` })),
          el('span', { class: 'entry-amount', text: formatMoney(accountBalance(state, account.id, today), account.currency, account.precision) }),
          el('button', {
            type: 'button', class: 'btn-text', text: 'Icon', 'aria-label': `Change the icon of ${account.name}`,
            'aria-expanded': String(accountView.iconFor === account.id), 'data-focus': `acct-icon:${account.id}`,
            onclick: () => { accountView.iconFor = accountView.iconFor === account.id ? '' : account.id; rerender(); }
          })),
        accountView.iconFor === account.id && accountIconForm(account, rerender))))
    : el('p', { class: 'empty', text: 'No accounts yet. Add your main current account to see its balance here.' });

  return el('div', {}, list, buildAccountForm(state, today));
}

/** Inline form: an account's own icon, or back to the drawing for its type. */
function accountIconForm(account, rerender) {
  const icon = iconField(account, 'By type');
  return el('form', {
    class: 'ed-edit',
    onsubmit: async event => {
      event.preventDefault();
      try {
        const chosen = icon.getValue();
        accountView.iconFor = '';
        if (chosen === undefined) return rerender();
        await saveLedger(commit(ledger.state, 'accounts', { ...account, icon: chosen }));
      } catch (error) {
        showToast(errorMessage(error));
      }
    }
  },
    icon.element,
    el('div', { class: 'ed-edit-actions' },
      el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Save' }),
      el('button', { type: 'button', class: 'btn-text', text: 'Cancel', onclick: () => { accountView.iconFor = ''; rerender(); } })));
}

function buildAccountForm(state, today) {
  const name = el('input', { id: 'account-name', type: 'text', maxLength: 150 });
  const type = el('select', { id: 'account-type' }, ACCOUNT_TYPES.map(([value, label]) => el('option', { value, text: label })));
  const currencySelect = el('select', { id: 'account-currency' },
    state.settings.activeCurrencies.map(code => el('option', { value: code, text: code })));
  currencySelect.value = state.settings.activeCurrencies.includes('GBP') ? 'GBP' : state.settings.reportingCurrency;
  const opening = el('input', { id: 'account-opening', type: 'text', inputMode: 'decimal', value: '0', autocomplete: 'off' });
  const openingDate = el('input', { id: 'account-date', type: 'date', value: today });
  const icon = iconField({}, 'By type');
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });

  async function submit(event) {
    event.preventDefault();
    try {
      if (!name.value.trim()) throw Error('Give the account a name.');
      if (!validDate(openingDate.value)) throw Error('Choose the date of the opening balance.');
      const code = currencySelect.value;
      const text = opening.value.trim() || '0';
      const negative = text.startsWith('-') || text.startsWith('−');
      const digitsOnly = text.replace(/^[-−+]/, '');
      const openingMinor = /^0*(?:[.,]0*)?$/.test(digitsOnly) ? 0 : parseAmount(digitsOnly, code) * (negative ? -1 : 1);

      const record = {
        id: uid(), name: name.value.trim(), type: type.value, currency: code, precision: digits(code),
        opening: openingMinor, openingDate: openingDate.value, archived: false
      };
      const chosenIcon = icon.getValue();
      if (chosenIcon) record.icon = chosenIcon;
      await saveLedger(commit(ledger.state, 'accounts', record));
      showToast('Account added.');
    } catch (error) {
      errorBox.textContent = errorMessage(error);
      errorBox.hidden = false;
    }
  }

  const field = (id, label, control) => el('div', { class: 'field' }, el('label', { for: id, text: label }), control);
  return el('details', { class: 'fold' },
    el('summary', { text: 'Add an account' }),
    el('form', { class: 'fold-body', onsubmit: submit, novalidate: true },
      field('account-name', 'Name', name),
      el('div', { class: 'field-pair' }, field('account-type', 'Type', type), field('account-currency', 'Currency', currencySelect)),
      el('div', { class: 'field-pair' }, field('account-opening', 'Opening balance', opening), field('account-date', 'Balance as of', openingDate)),
      icon.element,
      el('p', { class: 'hint', text: 'Entries dated before this day are not accepted for the account. Without an icon of its own, an account shows the drawing for its type.' }),
      errorBox,
      el('button', { type: 'submit', class: 'btn-primary', text: 'Add account' })));
}

// ---- ui/calendar.js ----
// Calendar: a month grid where each day shows only the money spent, with
// planned amounts outlined and payday marked. Under it, the forecast.
// Every figure comes from ../forecast-view.js; this file only draws.












const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const RANGE_KEY = 'expense-book.forecastRange';

/** The forecast range last chosen on this device, custom dates included. Anything unreadable falls back to the default. */
function loadRangeChoice() {
  const choice = { range: DEFAULT_FORECAST_RANGE, custom: null };
  try {
    const saved = JSON.parse(localStorage.getItem(RANGE_KEY) || 'null');
    if (saved && typeof saved === 'object') {
      try { choice.custom = validateCustomRange(saved.from, saved.to); } catch { /* no custom dates kept */ }
      if (FORECAST_RANGES.some(r => r.id === saved.range) && (saved.range !== 'custom' || choice.custom)) choice.range = saved.range;
    }
  } catch { /* storage is blocked or holds something else: use the default */ }
  return choice;
}

function saveRangeChoice() {
  try {
    localStorage.setItem(RANGE_KEY, JSON.stringify({ range: calendarView.range, from: calendarView.custom?.from, to: calendarView.custom?.to }));
  } catch { /* the choice then lasts until the page is closed */ }
}

// View state kept between re-renders. Empty means "not chosen yet".
const calendarView = { month: '', account: '', ...loadRangeChoice() };

function renderCalendar(root) {
  const state = ledger.state;
  const today = todayIso();
  if (!calendarView.month) calendarView.month = today.slice(0, 7);
  const rerender = () => { root.replaceChildren(); renderCalendar(root); };

  root.append(slip({ label: 'Calendar', kind: monthTitle(calendarView.month), wide: true },
    buildMonth(state, today, rerender),
    buildForecast(state, today, rerender)));
}

/** 'November 2026' for '2026-11'. */
function monthTitle(month) {
  const [year, number] = month.split('-').map(Number);
  return new Date(year, number - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

/** 'Thu 12 Nov', with the year when it is not this one. */
function shortDate(iso, today) {
  return formatDay(iso) + (iso.slice(0, 4) === today.slice(0, 4) ? '' : ' ' + iso.slice(0, 4));
}

/** '3 Dec' for '2026-12-03'. */
function dayMonth(iso) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
}

// ---------------------------------------------------------------------------
// Month grid
// ---------------------------------------------------------------------------

function buildMonth(state, today, rerender) {
  const [year, month] = calendarView.month.split('-').map(Number);
  const { from, to } = monthBounds(calendarView.month + '-01');
  const days = calendarDays(state, from, to, today);
  const payday = paydayFor(year, month, state.settings);

  const step = count => {
    calendarView.month = monthBounds(calendarView.month + '-01', count).from.slice(0, 7);
    rerender();
  };
  const nav = el('div', { class: 'cal-nav' },
    el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Previous month', 'data-focus': 'cal-prev', onclick: () => step(-1) },
      pixelIconNode('prev', UI_ICONS)),
    el('h1', { class: 'cal-title', text: monthTitle(calendarView.month) }),
    el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Next month', 'data-focus': 'cal-next', onclick: () => step(1) },
      pixelIconNode('next', UI_ICONS)),
    el('button', {
      type: 'button', class: 'btn-text cal-today', text: 'Today', 'data-focus': 'cal-today',
      disabled: calendarView.month === today.slice(0, 7),
      onclick: () => { calendarView.month = today.slice(0, 7); rerender(); }
    }));

  const grid = el('div', { class: 'cal-grid' },
    WEEKDAYS.map(name => el('div', { class: 'cal-weekday', text: name })),
    monthCells(year, month - 1).map(date => date
      ? dayCell(state, date, days.get(date), { isToday: date === today, isPayday: date === payday })
      : el('div', { class: 'cal-blank' })));

  return el('div', { class: 'cal' }, nav, grid,
    el('p', { class: 'cal-legend' },
      el('span', { class: 'cal-key' }, el('span', { class: 'cal-amount', text: '12' }), ' spent'),
      el('span', { class: 'cal-key' }, el('span', { class: 'cal-amount cal-amount--planned', text: '12' }), ' planned'),
      el('span', { class: 'cal-key' }, el('span', { class: 'cal-payday' }), ' payday'),
      el('span', { class: 'cal-key', text: '+ other currencies too' })));
}

/** An amount for a cell: exact on wide screens, short on a phone. `more` adds the "+" for further currencies. */
function cellAmountNode(amount, reporting, planned) {
  if (!amount) return null;
  const plus = amount.more ? '+' : '';
  const foreign = amount.currency !== reporting;
  return el('span', { class: 'cal-amount' + (planned ? ' cal-amount--planned' : '') },
    el('span', { class: 'cal-full', text: formatMoney(amount.minor, amount.currency, amount.precision) + plus }),
    el('span', { class: 'cal-short', text: compactAmount(amount.minor, amount.precision) + plus }),
    foreign && el('span', { class: 'cal-code', text: amount.currency }));
}

function dayCell(state, date, day, { isToday, isPayday }) {
  const reporting = state.settings.reportingCurrency;
  const spent = day ? cellAmount(day.spent, state.settings) : null;
  const planned = day ? cellAmount(day.planned, state.settings) : null;
  const say = (amount, word) => amount
    && `${word} ${formatMoney(amount.minor, amount.currency, amount.precision)}${amount.more ? ' and other currencies' : ''}`;
  const label = [formatDay(date), isToday && 'today', say(spent, 'spent'), say(planned, 'planned'), isPayday && 'payday']
    .filter(Boolean).join(', ');

  const button = el('button', {
    type: 'button',
    class: 'cal-cell' + (isToday ? ' is-today' : ''),
    'aria-label': label, 'aria-haspopup': 'dialog', 'aria-expanded': 'false', 'data-focus': `cal:${date}`,
    onclick: () => openPopover({ anchor: button, label: formatDay(date), role: 'dialog', content: daySheet(state, date, day, isPayday) })
  },
    el('span', { class: 'cal-daynum' }, el('span', { text: String(Number(date.slice(8))) }), isPayday && el('span', { class: 'cal-payday' })),
    cellAmountNode(spent, reporting, false),
    cellAmountNode(planned, reporting, true));
  return button;
}

// ---------------------------------------------------------------------------
// Day sheet
// ---------------------------------------------------------------------------

/** Totals by currency as text, e.g. '£31.50 · 88.00 CNY'. Never added together. */
function bucketText(buckets) {
  return [...buckets.values()].filter(b => b.minor !== 0n)
    .map(b => formatMoney(b.minor, b.currency, b.precision)).join(' · ');
}

function daySheet(state, date, day, isPayday) {
  const accountName = id => state.accounts.find(a => a.id === id)?.name || '';

  /** One row for a recorded entry or a planned item. */
  const row = (e, planned) => {
    const isTransfer = e.kind === 'transfer';
    const title = planned ? e.label
      : isTransfer ? `${accountName(e.account)} → ${accountName(e.toAccount)}`
      : state.categories.find(c => c.id === e.category)?.name || e.kind;
    const own = isTransfer ? BigInt(e.minor) : personalAmount(e);
    const signed = isTransfer ? own : ['income', 'refund'].includes(e.kind) ? own : -own;
    const meta = [
      isTransfer ? 'Transfer' : categoryPath(state, e.category),
      !isTransfer && accountName(e.account),
      e.kind === 'refund' && 'Refund',
      !isTransfer && own !== BigInt(e.minor) && 'your share',
      !planned && e.note
    ].filter(Boolean).join(' · ');
    return el('li', { class: 'list-row' },
      el('span', { class: 'entry-text' },
        el('span', { class: 'entry-title', text: title }),
        meta && el('span', { class: 'entry-meta', text: meta })),
      planned && el('span', { class: 'tag-estimate', text: e.estimated ? 'estimate' : 'planned' }),
      el('span', {
        class: 'entry-amount' + (signed > 0n && !isTransfer ? ' is-income' : ''),
        text: formatMoney(signed, e.currency, e.precision, { signed: !isTransfer })
      }));
  };

  const posted = day?.posted || [];
  const items = day?.items || [];
  const spentText = day ? bucketText(day.spent) : '';
  const plannedText = day ? bucketText(day.planned) : '';

  return el('div', { class: 'cal-sheet' },
    isPayday && el('p', { class: 'cal-sheet-payday' }, el('span', { class: 'cal-payday' }), ' Payday'),
    spentText && el('div', { class: 'day-head' }, el('span', { text: 'Spent' }), el('span', { class: 'day-total', text: spentText })),
    posted.length > 0 && el('ul', { class: 'plain-list' }, posted.map(e => row(e, false))),
    plannedText && el('div', { class: 'day-head' }, el('span', { text: 'Planned' }), el('span', { class: 'day-total', text: plannedText })),
    items.length > 0 && el('ul', { class: 'plain-list' }, items.map(e => row(e, true))),
    !posted.length && !items.length && el('p', { class: 'empty', text: 'Nothing recorded or planned on this day.' }));
}

// ---------------------------------------------------------------------------
// Forecast
// ---------------------------------------------------------------------------

function buildForecast(state, today, rerender) {
  const wrap = el('div', { class: 'fc' }, sectionTitle('Forecast'));

  const accounts = forecastAccounts(state);
  if (!accounts.length) {
    wrap.append(el('p', { class: 'empty', text: 'Add your main account in Settings to see what is left before payday.' }));
    return wrap;
  }

  // Keep the choices valid when accounts change.
  const reporting = state.settings.reportingCurrency;
  if (calendarView.account !== ALL_ACCOUNTS && !accounts.some(a => a.id === calendarView.account)) {
    calendarView.account = defaultForecastAccount(state);
  }
  if (calendarView.range === 'custom' && !calendarView.custom) calendarView.range = DEFAULT_FORECAST_RANGE;

  const range = forecastRange(calendarView.range, today, state.settings, calendarView.custom);
  const forecast = forecastSummary(state, { range, today, account: calendarView.account, pots: forecastPotsOf(state) });

  const rangeChoice = el('div', { class: 'segmented fc-ranges', role: 'group', 'aria-label': 'Forecast range' },
    FORECAST_RANGES.map(({ id, label }) => {
      const selected = id === calendarView.range;
      const isCustom = id === 'custom';
      const custom = calendarView.custom;
      const button = el('button', {
        type: 'button',
        class: selected ? 'is-selected' : '',
        'aria-pressed': String(selected),
        'aria-haspopup': isCustom ? 'dialog' : null,
        'aria-expanded': isCustom ? 'false' : null,
        'aria-label': isCustom && custom ? `Custom range, ${dayMonth(custom.from)} to ${dayMonth(custom.to)}` : null,
        'data-focus': `fc-range:${id}`,
        text: isCustom && custom ? `${dayMonth(custom.from)}–${dayMonth(custom.to)}` : label,
        onclick: () => {
          if (isCustom) return openCustomRange(button, today, rerender);
          calendarView.range = id;
          saveRangeChoice();
          rerender();
        }
      });
      return button;
    }));

  const accountSelect = el('select', { id: 'fc-account', 'data-focus': 'fc-account', onchange: event => { calendarView.account = event.target.value; rerender(); } },
    accounts.map(a => el('option', { value: a.id, text: `${a.name} (${a.currency})` })),
    el('option', { value: ALL_ACCOUNTS, text: `All ${reporting} accounts` }));
  accountSelect.value = calendarView.account;

  const span = `${shortDate(range.from, today)} to ${shortDate(range.to, today)}`;
  wrap.append(
    rangeChoice,
    el('p', {
      class: 'note',
      text: range.days < 1 ? `${span} · this range has ended.`
        : range.from > today ? `${span} · counted from today, ${range.days} ${range.days === 1 ? 'day' : 'days'} to the end.`
        : `${span} · ${range.days} ${range.days === 1 ? 'day' : 'days'} left, today included.`
    }),
    el('div', { class: 'field' }, el('label', { for: 'fc-account', text: 'Account' }), accountSelect));

  if (!forecast) {
    wrap.append(el('p', { class: 'empty', text: `No account is held in ${reporting}. Choose one account instead.` }));
    return wrap;
  }

  const money = minor => formatMoney(minor, forecast.currency, forecast.precision);
  wrap.append(el('dl', { class: 'fc-figures' },
    el('div', { class: 'fc-figure' },
      el('dt', { text: `Forecast left on ${shortDate(range.to, today)}` }),
      el('dd', { class: forecast.left < 0n ? 'is-negative' : '', text: money(forecast.left) }),
      el('dd', {
        class: 'fc-detail',
        text: `Balance today ${money(forecast.balance)}, fixed ${formatMoney(forecast.fixedTotal, forecast.currency, forecast.precision, { signed: true })}, estimates −${money(forecast.estimateTotal)}`
      }))));

  if (forecast.uncounted) {
    wrap.append(el('p', { class: 'hint', text: `${forecast.uncounted} ${forecast.uncounted === 1 ? 'line is' : 'lines are'} in another currency and not counted. No exchange rate was assumed.` }));
  }

  wrap.append(
    buildPotsLeft(state, forecast.pots, range, today),
    forecastGroup('Fixed', forecast.fixed, 'Nothing planned in this range.', today),
    forecastGroup('Estimate', forecast.estimates, 'No estimates. Add them in Settings.', today),
    buildTrust(state, today));
  return wrap;
}

/** The Custom range popover: From, To and Apply. Nothing changes until the dates are valid. */
function openCustomRange(anchor, today, rerender) {
  const start = calendarView.custom || { from: today, to: monthBounds(today).to };
  const from = el('input', { id: 'fc-custom-from', type: 'date', value: start.from });
  const to = el('input', { id: 'fc-custom-to', type: 'date', value: start.to });
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });
  const form = el('form', {
    class: 'fc-custom', novalidate: true,
    onsubmit: event => {
      event.preventDefault();
      try {
        calendarView.custom = validateCustomRange(from.value, to.value);
      } catch (error) {
        errorBox.textContent = errorMessage(error);
        errorBox.hidden = false;
        return;
      }
      calendarView.range = 'custom';
      saveRangeChoice();
      closePopover({ restoreFocus: false });
      rerender();
      document.querySelector('[data-focus="fc-range:custom"]')?.focus();
    }
  },
    el('div', { class: 'field-pair' },
      el('div', { class: 'field' }, el('label', { for: from.id, text: 'From' }), from),
      el('div', { class: 'field' }, el('label', { for: to.id, text: 'To' }), to)),
    el('p', { class: 'hint', text: 'Up to 366 days. Upcoming items are counted from today to the To date.' }),
    errorBox,
    el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Apply' }));
  openPopover({ anchor, label: 'Custom range', role: 'dialog', content: form });
  from.focus();
}

/** "Left in pots": one line per chosen pot, with what is left in it at the end of the range. */
function buildPotsLeft(state, lines, range, today) {
  const choose = el('button', {
    type: 'button', class: 'btn-text', text: 'Choose pots', 'aria-haspopup': 'dialog', 'aria-expanded': 'false', 'data-focus': 'fc-pots',
    onclick: () => openPotChoice(choose, state)
  });
  return el('div', { class: 'fc-group fc-pots' },
    el('div', { class: 'day-head fc-pots-head' }, el('span', { text: `Left in pots on ${shortDate(range.to, today)}` }), choose),
    lines.length
      ? el('ul', { class: 'plain-list' }, lines.map(pot => el('li', { class: 'list-row' },
          el('span', { class: 'entry-text' },
            el('span', { class: 'entry-title' }, pot.icon && categoryIconNode(pot.icon), el('span', { text: pot.name })),
            el('span', {
              class: 'entry-meta',
              text: `In the pot today ${formatMoney(pot.balance, pot.currency, pot.precision)}` + (pot.missing ? ` · ${pot.missing} in another currency not counted` : '')
            })),
          el('span', { class: 'entry-amount' + (pot.left < 0n ? ' is-negative' : ''), text: formatMoney(pot.left, pot.currency, pot.precision) }))))
      : el('p', { class: 'empty', text: 'No pots chosen.' }));
}

/** The "Choose pots" popover: a checkbox per pot. Save keeps the choice in settings.forecastPots. */
function openPotChoice(anchor, state) {
  const chosen = new Set(forecastPotsOf(state));
  const pots = state.pots.filter(p => !p.archived);
  const boxes = pots.map(pot => el('input', { type: 'checkbox', value: pot.id, checked: chosen.has(pot.id) }));
  const form = el('form', {
    class: 'fc-pot-choice',
    onsubmit: async event => {
      event.preventDefault();
      const ids = boxes.filter(box => box.checked).map(box => box.value);
      closePopover({ restoreFocus: false });
      try {
        await saveSettings(settings => { settings.forecastPots = ids; });
      } catch (error) {
        showToast(errorMessage(error));
      }
      document.querySelector('[data-focus="fc-pots"]')?.focus();
    }
  },
    pots.length
      ? el('ul', { class: 'plain-list' }, pots.map((pot, index) => el('li', {},
          el('label', { class: 'check-row' }, boxes[index], el('span', { text: pot.name })))))
      : el('p', { class: 'empty', text: 'There are no pots yet.' }),
    el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Save' }));
  openPopover({ anchor, label: 'Choose pots', role: 'dialog', content: form });
}

/** One itemised group: each line has its date, amount and a 'fixed' or 'estimate' tag. */
function forecastGroup(title, lines, emptyText, today) {
  const row = line => {
    const out = line.tag === 'estimate' ? -line.minor : line.minor; // estimates are money going out
    const shown = line.counted ? out : (out < 0n ? -out : out);
    const meta = [
      shortDate(line.date, today),
      line.tag === 'estimate' && line.days < 7 && `${line.days} of 7 days`,
      line.tag === 'fixed' && line.estimated && 'amount estimated',
      !line.counted && 'not counted'
    ].filter(Boolean).join(' · ');
    return el('li', { class: 'list-row' + (line.counted ? '' : ' is-uncounted') },
      el('span', { class: 'entry-text' },
        el('span', { class: 'entry-title', text: line.name }),
        el('span', { class: 'entry-meta', text: meta })),
      el('span', { class: line.tag === 'fixed' ? 'tag-fixed' : 'tag-estimate', text: line.tag }),
      el('span', {
        class: 'entry-amount' + (line.counted && out > 0n ? ' is-income' : ''),
        text: formatMoney(shown, line.currency, line.precision, { signed: line.counted })
      }));
  };
  return el('div', { class: 'fc-group' },
    el('div', { class: 'day-head' }, el('span', { text: title }), el('span', { text: `${lines.length} ${lines.length === 1 ? 'line' : 'lines'}` })),
    lines.length ? el('ul', { class: 'plain-list' }, lines.map(row)) : el('p', { class: 'empty', text: emptyText }));
}

/** Last month's estimate beside what was recorded, so the estimates can be trusted or changed. */
function buildTrust(state, today) {
  const rows = estimateTrust(state, today);
  if (!rows.length) return null;
  return el('div', { class: 'fc-group' },
    el('div', { class: 'day-head' }, el('span', { text: 'Last month' }), el('span', { text: 'estimate against actual' })),
    el('ul', { class: 'plain-list' }, rows.map(t => el('li', { class: 'list-row' },
      el('span', { class: 'entry-text' },
        el('span', { class: 'entry-title', text: t.estimate.name }),
        el('span', {
          class: 'entry-meta',
          text: !t.estimate.category ? 'No category to compare with.'
            : `Last month: estimated ${formatMoney(t.estimated, t.currency, t.precision)}, actual ${formatMoney(t.actual, t.currency, t.precision)}`
              + (t.missing ? ` · ${t.missing} in another currency not counted` : '')
        }))))),
    el('p', { class: 'hint' }, 'Change the weekly amounts in ', el('a', { href: '#settings/estimates', text: 'Settings' }), ' under Estimates.'));
}

// ---- ui/report-charts.js ----
// The four report drawings, as inline SVG. No chart library.
// Every mark can be reached with Tab, carries an aria-label, and shows a
// tooltip on hover, focus or tap. Colours come from the --chart-* variables
// in style.css, so both themes work without any change here.





const SVG_NAMESPACE = 'http://www.w3.org/2000/svg';

/** Create an SVG element. Props: `text`, `on<event>` listeners, everything else as an attribute. */
function svgNode(tag, props = {}, ...children) {
  const node = document.createElementNS(SVG_NAMESPACE, tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false || value === '') continue;
    if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...children.flat().filter(child => child != null && child !== false));
  return node;
}

/** The CSS colour for a palette position (0–9); anything else is the quiet "other" tone. */
function chartColour(index) {
  return index >= 0 ? `var(--chart-${index + 1})` : 'var(--chart-other)';
}

/** 'Nov' and 'November 2026' for '2026-11'. */
function reportMonthShort(month) {
  return new Date(month + '-01T12:00:00Z').toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' });
}
function reportMonthLong(month) {
  return new Date(month + '-01T12:00:00Z').toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
}

/**
 * One tooltip for a chart, placed inside `frame` (which must be position: relative).
 * It is centred on a point of the drawing and then pulled back inside the frame,
 * so it cannot run off a phone screen.
 */
function createChartTip(frame) {
  const box = el('div', { class: 'rp-tip', hidden: true, 'aria-hidden': 'true' });
  frame.append(box);
  // A tap on empty chart space puts the tooltip away.
  frame.addEventListener('click', event => { if (!event.target.closest?.('.rp-mark')) box.hidden = true; });
  return {
    /** `fx`, `fy`: the point as fractions of the drawing's width and height. */
    show(svg, fx, fy, title, lines = []) {
      box.replaceChildren(el('strong', { text: title }), ...lines.filter(Boolean).map(text => el('span', { text })));
      box.hidden = false;
      const outer = frame.getBoundingClientRect();
      const chart = svg.getBoundingClientRect();
      const x = chart.left - outer.left + fx * chart.width;
      const y = chart.top - outer.top + fy * chart.height;
      const left = Math.max(0, Math.min(x - box.offsetWidth / 2, frame.clientWidth - box.offsetWidth));
      const above = y - box.offsetHeight - 10;
      box.style.left = `${left}px`;
      box.style.top = `${above < 0 ? y + 14 : above}px`;
    },
    hide() { box.hidden = true; }
  };
}

/**
 * Make a drawn shape behave like a control: focusable, labelled, with a tooltip.
 * With `onPick` it is a button (Enter, Space, click or tap); without, a tap shows the tooltip.
 */
function chartMark(node, { svg, tip, at, title, lines, label, onPick = null, focusKey = null }) {
  node.setAttribute('tabindex', '0');
  node.setAttribute('role', onPick ? 'button' : 'img');
  node.setAttribute('aria-label', label);
  if (focusKey) node.setAttribute('data-focus', focusKey);
  node.classList.add('rp-mark');
  if (onPick) node.classList.add('rp-mark--pick');

  const show = () => tip.show(svg, at[0], at[1], title, lines);
  const act = () => {
    if (!onPick) return show();
    tip.hide();
    onPick(node);
  };
  node.addEventListener('pointerenter', event => { if (event.pointerType === 'mouse') show(); });
  node.addEventListener('pointerleave', event => { if (event.pointerType === 'mouse') tip.hide(); });
  node.addEventListener('focus', show);
  node.addEventListener('blur', () => tip.hide());
  node.addEventListener('click', act);
  node.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); act(); }
  });
  return node;
}

/** A category icon inside a drawing, centred on (x, y). Pixel icons are nested SVG; emoji are text. */
function chartIcon(icon, x, y, size, className = 'rp-chart-icon') {
  if (!icon) return null;
  if (icon.type === 'pixel') {
    const node = pixelIconNode(icon.value, PIXEL_ICONS, className);
    if (!node) return null;
    for (const [name, value] of [['x', x - size / 2], ['y', y - size / 2], ['width', size], ['height', size]]) node.setAttribute(name, value);
    return node;
  }
  if (icon.type !== 'emoji' || !icon.value) return null;
  return svgNode('text', {
    x, y, class: className + ' rp-chart-emoji', 'font-size': size * .9,
    'text-anchor': 'middle', 'dominant-baseline': 'central', 'aria-hidden': 'true', text: icon.value
  });
}

/** `text` cut to fit `width` at about `charWidth` per character; '' when not even three fit. */
function fitText(text, width, charWidth) {
  const room = Math.floor(width / charWidth);
  if (text.length <= room) return text;
  return room >= 4 ? text.slice(0, room - 1).trimEnd() + '…' : '';
}

// ---------------------------------------------------------------------------
// Donut
// ---------------------------------------------------------------------------

/** The outline of a ring segment between two angles (radians, clockwise from 12 o'clock at -π/2). */
function ringSegment(centre, outer, inner, from, to) {
  const end = Math.min(to, from + Math.PI * 2 - 0.0001); // a full ring still needs two distinct ends
  const large = end - from > Math.PI ? 1 : 0;
  const point = (radius, angle) => `${(centre + radius * Math.cos(angle)).toFixed(2)} ${(centre + radius * Math.sin(angle)).toFixed(2)}`;
  return `M${point(outer, from)} A${outer} ${outer} 0 ${large} 1 ${point(outer, end)} `
    + `L${point(inner, end)} A${inner} ${inner} 0 ${large} 0 ${point(inner, from)} Z`;
}

/**
 * slices → [{ id, name, icon, colour, minor (BigInt > 0) }], total → their sum.
 * centre → { title, amount, note }: the three lines in the middle.
 * canPick(slice) says which segments open something; onPick(slice) opens it.
 * more(slice) → extra tooltip lines (the comparison, when one is on).
 */
function donutChart({ slices, total, centre, format, tip, canPick, onPick, animate, label, more = () => [] }) {
  const size = 300, middle = 150, outer = 108, inner = 68, iconRadius = 128;
  const svg = svgNode('svg', { class: 'rp-chart rp-donut', viewBox: `0 0 ${size} ${size}`, role: 'group', 'aria-label': label });
  const ring = svgNode('g', { class: animate ? 'rp-enter' : '' });
  const icons = svgNode('g', { class: animate ? 'rp-enter' : '', 'aria-hidden': 'true' });
  const whole = Number(total);
  let angle = -Math.PI / 2;

  for (const slice of slices) {
    const sweep = Number(slice.minor) / whole * Math.PI * 2;
    const from = angle;
    const mid = from + sweep / 2;
    angle += sweep;
    const percent = sharePercent(slice.minor, total);
    const pick = canPick(slice);
    const band = (outer + inner) / 2;
    ring.append(chartMark(svgNode('path', { class: 'rp-slice', d: ringSegment(middle, outer, inner, from, angle), fill: chartColour(slice.colour) }), {
      svg, tip,
      at: [(middle + band * Math.cos(mid)) / size, (middle + band * Math.sin(mid)) / size],
      title: slice.name,
      lines: [format(slice.minor), `${percent}% of ${centre.whole}`, ...more(slice)],
      label: [`${slice.name}, ${format(slice.minor)}, ${percent}% of ${centre.whole}`, ...more(slice)].join('. ') + '.' + (pick ? ' Opens what is inside.' : ''),
      onPick: pick ? () => onPick(slice) : null,
      focusKey: 'rp-slice:' + slice.id
    }));
    // The icon sits just outside its segment, when the segment is wide enough to own that spot.
    if (sweep >= 0.2) icons.append(chartIcon(slice.icon, middle + iconRadius * Math.cos(mid), middle + iconRadius * Math.sin(mid), 16) || '');
  }

  const amountSize = Math.min(22, (inner * 2 - 20) / (centre.amount.length * .62));
  svg.append(ring, icons, svgNode('g', { class: 'rp-centre', 'aria-hidden': 'true', 'text-anchor': 'middle' },
    svgNode('text', { class: 'rp-centre-title', x: middle, y: middle - 20, text: fitText(centre.title, inner * 2 - 24, 6.4) || centre.title.slice(0, 12) }),
    svgNode('text', { class: 'rp-centre-amount', x: middle, y: middle + 6, 'font-size': amountSize.toFixed(1), text: centre.amount }),
    svgNode('text', { class: 'rp-centre-note', x: middle, y: middle + 26, text: centre.note })));
  return svg;
}

// ---------------------------------------------------------------------------
// Shared frame for the two month charts
// ---------------------------------------------------------------------------

const MONTH_CHART = { width: 360, height: 236, left: 4, right: 356, top: 22, base: 196 };

/** Gridlines, the top value, and month letters with the year under each January (and the first month). */
function monthAxis(months, topLabel) {
  const { left, right, top, base } = MONTH_CHART;
  const slot = (right - left) / months.length;
  const axis = svgNode('g', { 'aria-hidden': 'true' },
    svgNode('line', { class: 'rp-grid', x1: left, x2: right, y1: top, y2: top }),
    svgNode('line', { class: 'rp-grid', x1: left, x2: right, y1: (top + base) / 2, y2: (top + base) / 2 }),
    svgNode('line', { class: 'rp-baseline', x1: left, x2: right, y1: base, y2: base }),
    svgNode('text', { class: 'rp-axis-text', x: left, y: top - 7, text: topLabel }));
  months.forEach((month, index) => {
    const x = left + slot * (index + .5);
    axis.append(svgNode('text', { class: 'rp-axis-text', x, y: base + 15, 'text-anchor': 'middle', text: reportMonthShort(month).slice(0, 1) }));
    if (index === 0 || month.endsWith('-01')) {
      axis.append(svgNode('text', { class: 'rp-axis-text rp-axis-year', x: left + slot * index + 2, y: base + 31, text: month.slice(0, 4) }));
    }
  });
  return { axis, slot };
}

/** A see-through rectangle over a month's whole column, so the tap target is as tall as the chart. */
function monthHit(index, slot) {
  const { left, top, height } = MONTH_CHART;
  return svgNode('rect', { class: 'rp-hit', x: left + slot * index, y: top - 8, width: slot, height: height - top + 8 });
}

// ---------------------------------------------------------------------------
// Bars
// ---------------------------------------------------------------------------

/**
 * months → [{ month, byCategory }], categories → the ones switched on, in colour order.
 * onPick(month, anchor) opens that month's breakdown.
 */
function barsChart({ months, categories, format, tip, onPick, label }) {
  const { width, height, left, top, base } = MONTH_CHART;
  const part = (month, category) => {
    const minor = month.byCategory[category.id] || 0n;
    return minor > 0n ? minor : 0n; // a month of net refunds in a category draws nothing
  };
  const sums = months.map(month => categories.reduce((sum, category) => sum + part(month, category), 0n));
  const highest = sums.reduce((max, sum) => (sum > max ? sum : max), 0n);
  const scale = (base - top) / Math.max(1, Number(highest));

  const svg = svgNode('svg', { class: 'rp-chart rp-wide-chart', viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-label': label });
  const { axis, slot } = monthAxis(months.map(m => m.month), format(highest));
  svg.append(axis);

  const barWidth = slot * .64;
  months.forEach((month, index) => {
    const x = left + slot * index + (slot - barWidth) / 2;
    const stack = svgNode('g', { class: 'rp-grow' });
    let y = base;
    for (const category of categories) {
      const barHeight = Number(part(month, category)) * scale;
      if (barHeight <= 0) continue;
      y -= barHeight;
      stack.append(svgNode('rect', { class: 'rp-bar', x: x.toFixed(2), y: y.toFixed(2), width: barWidth.toFixed(2), height: barHeight.toFixed(2), fill: chartColour(category.colour) }));
    }
    const name = reportMonthLong(month.month);
    svg.append(chartMark(svgNode('g', {}, monthHit(index, slot), stack), {
      svg, tip,
      at: [(x + barWidth / 2) / width, y / height],
      title: name,
      lines: [format(sums[index]), 'Open for the breakdown'],
      label: `${name}, ${format(sums[index])}. Opens the breakdown.`,
      onPick: anchor => onPick(month.month, anchor),
      focusKey: 'rp-month:' + month.month
    }));
  });
  return svg;
}

/**
 * The period against its comparison: a pair of horizontal bars per category, the period's
 * in the category colour and the comparison's faint and dashed underneath, on one scale.
 * rows → [{ id, name, icon, colour, minor, previous, isNew }]; negative amounts draw nothing.
 * deltaText(row) → the difference in words, for the tooltip and the label.
 */
function compareBarsChart({ rows, format, tip, label, compareLabel, deltaText }) {
  const width = 360, rowHeight = 46, left = 4, barRoom = 252, amountRight = 356;
  const height = Math.max(1, rows.length) * rowHeight + 4;
  const drawn = minor => (minor > 0n ? minor : 0n);
  const highest = rows.reduce((max, row) => [drawn(row.minor), drawn(row.previous)].reduce((m, v) => (v > m ? v : m), max), 0n);
  const scale = barRoom / Math.max(1, Number(highest));
  const svg = svgNode('svg', { class: 'rp-chart rp-wide-chart rp-compare-bars', viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-label': label });

  rows.forEach((row, index) => {
    const y = index * rowHeight + 4;
    const icon = chartIcon(row.icon, left + 6, y + 6, 12);
    const now = Math.max(drawn(row.minor) > 0n ? 1 : 0, Number(drawn(row.minor)) * scale);
    const before = Math.max(drawn(row.previous) > 0n ? 1 : 0, Number(drawn(row.previous)) * scale);
    const group = svgNode('g', {},
      svgNode('rect', { class: 'rp-hit', x: 0, y, width, height: rowHeight - 4 }),
      icon || '',
      svgNode('text', { class: 'rp-pair-name', x: left + (icon ? 17 : 0), y: y + 10, 'aria-hidden': 'true', text: fitText(row.name, 300, 6.8) || row.name.slice(0, 24) }),
      svgNode('g', { class: 'rp-widen' },
        svgNode('rect', { class: 'rp-bar', x: left, y: y + 16, width: now.toFixed(2), height: 10, fill: chartColour(row.colour) }),
        svgNode('rect', { class: 'rp-bar rp-bar--before', x: left, y: y + 29, width: before.toFixed(2), height: 8, fill: chartColour(row.colour), stroke: chartColour(row.colour) })),
      svgNode('text', { class: 'rp-pair-amount', x: amountRight, y: y + 25, 'text-anchor': 'end', 'aria-hidden': 'true', text: format(row.minor) }),
      svgNode('text', { class: 'rp-pair-amount rp-pair-amount--before', x: amountRight, y: y + 37, 'text-anchor': 'end', 'aria-hidden': 'true', text: row.isNew ? 'new' : format(row.previous) }));
    const lines = [`This period: ${format(row.minor)}`, `${compareLabel}: ${row.isNew ? 'nothing' : format(row.previous)}`, deltaText(row)];
    svg.append(chartMark(group, {
      svg, tip, at: [.5, (y + 14) / height], title: row.name, lines, label: `${row.name}. ${lines.join('. ')}.`,
      focusKey: 'rp-pair:' + row.id
    }));
  });
  return svg;
}

// ---------------------------------------------------------------------------
// Trend
// ---------------------------------------------------------------------------

/** What a month's point says: spent, budget and the difference, in words. */
function trendLines(point, format, hasBudget, reference = null) {
  const gap = point.actual - point.budget;
  return [
    `Spent ${format(point.actual)}`,
    reference && reference.minor != null && `${reference.label}: ${format(reference.minor)}`,
    hasBudget && `Budget ${format(point.budget)}`,
    hasBudget && (gap > 0n ? `${format(gap)} over budget` : gap < 0n ? `${format(-gap)} under budget` : 'Exactly on budget'),
    point.missing ? `${point.missing} left out: no value in this currency` : null
  ].filter(Boolean);
}

/**
 * series → { months: [{ month, budget, actual, missing }] }. Points over budget are vermilion diamonds.
 * reference → { label, values: [minor | null per month] }: the comparison, drawn as a faint
 * dashed line wherever there is a value.
 */
function trendChart({ series, format, tip, label, reference = null }) {
  const { width, height, left, top, base } = MONTH_CHART;
  const points = series.months;
  const hasBudget = points.some(point => point.budget !== 0n);
  const referenceAt = index => (reference ? { label: reference.label, minor: reference.values[index] ?? null } : null);
  const highest = points.reduce((max, point, index) => [point.actual, point.budget, referenceAt(index)?.minor ?? 0n].reduce((m, v) => (v > m ? v : m), max), 0n);
  const scale = (base - top) / Math.max(1, Number(highest));
  const yOf = minor => base - Math.max(0, Number(minor)) * scale;

  const svg = svgNode('svg', { class: 'rp-chart rp-wide-chart', viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-label': label });
  const { axis, slot } = monthAxis(points.map(p => p.month), format(highest));
  const xOf = index => left + slot * (index + .5);
  const line = pick => points.map((point, index) => `${xOf(index).toFixed(2)},${yOf(pick(point)).toFixed(2)}`).join(' ');

  // The reference line is broken wherever a month has nothing to compare with.
  const runs = [];
  points.forEach((point, index) => {
    const minor = referenceAt(index)?.minor;
    if (minor == null) return runs.push([]);
    if (!runs.length) runs.push([]);
    runs[runs.length - 1].push(`${xOf(index).toFixed(2)},${yOf(minor).toFixed(2)}`);
  });

  svg.append(axis, svgNode('g', { class: 'rp-enter', 'aria-hidden': 'true' },
    runs.filter(run => run.length > 1).map(run => svgNode('polyline', { class: 'rp-line rp-line--reference', points: run.join(' ') })),
    runs.filter(run => run.length === 1).map(run => svgNode('circle', { class: 'rp-reference-dot', cx: run[0].split(',')[0], cy: run[0].split(',')[1], r: 1.5 })),
    hasBudget && svgNode('polyline', { class: 'rp-line rp-line--budget', points: line(point => point.budget) }),
    svgNode('polyline', { class: 'rp-line rp-line--spent', points: line(point => point.actual) })));

  points.forEach((point, index) => {
    const x = xOf(index), y = yOf(point.actual);
    const over = hasBudget && point.actual > point.budget;
    const half = over ? 5 : 3.5;
    const square = svgNode('rect', {
      class: 'rp-point' + (over ? ' rp-point--over' : ''),
      x: (x - half).toFixed(2), y: (y - half).toFixed(2), width: half * 2, height: half * 2,
      transform: over ? `rotate(45 ${x.toFixed(2)} ${y.toFixed(2)})` : null
    });
    const name = reportMonthLong(point.month);
    const lines = trendLines(point, format, hasBudget, referenceAt(index));
    svg.append(chartMark(svgNode('g', {}, monthHit(index, slot), square), {
      svg, tip, at: [x / width, y / height], title: name, lines, label: `${name}. ${lines.join('. ')}.`,
      focusKey: 'rp-month:' + point.month
    }));
  });
  return svg;
}

// ---------------------------------------------------------------------------
// Treemap
// ---------------------------------------------------------------------------

/**
 * items → [{ id, name, icon, colour, minor (BigInt > 0), children? }]. Blocks with children show
 * them as faint subdivisions and can be picked to zoom in. more(item) → extra tooltip lines.
 */
function treemapChart({ items, total, whole, format, tip, onPick, animate, label, more = () => [] }) {
  const width = 360, height = 270;
  const svg = svgNode('svg', { class: 'rp-chart rp-wide-chart rp-treemap', viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-label': label });
  const blocks = svgNode('g', { class: animate ? 'rp-enter' : '' });
  const rects = squarify(items.map(item => Number(item.minor)), width, height);

  items.forEach((item, index) => {
    const { x, y, w, h } = rects[index];
    const inside = (item.children || []).filter(child => child.minor > 0n);
    const percent = sharePercent(item.minor, total);
    const group = svgNode('g', {}, svgNode('rect', { class: 'rp-block', x: x.toFixed(2), y: y.toFixed(2), width: w.toFixed(2), height: h.toFixed(2), fill: chartColour(item.colour) }));

    if (inside.length > 1) {
      squarify(inside.map(child => Number(child.minor)), w, h).forEach(sub => group.append(svgNode('rect', {
        class: 'rp-subblock', x: (x + sub.x).toFixed(2), y: (y + sub.y).toFixed(2), width: sub.w.toFixed(2), height: sub.h.toFixed(2)
      })));
    }

    // Icon, name and amount, each only where the block has room for it.
    const icon = w >= 26 && h >= 24 ? chartIcon(item.icon, x + 13, y + 13, 12, 'rp-block-icon') : null;
    const textLeft = x + (icon ? 24 : 6);
    const name = h >= 20 ? fitText(item.name, x + w - textLeft - 4, 6.4) : '';
    const amount = h >= 40 ? fitText(format(item.minor), w - 10, 6) : '';
    group.append(icon || '',
      name && svgNode('text', { class: 'rp-block-name', x: textLeft, y: y + 17, 'aria-hidden': 'true', text: name }),
      amount && svgNode('text', { class: 'rp-block-amount', x: x + 6, y: y + 33, 'aria-hidden': 'true', text: amount }));

    blocks.append(chartMark(group, {
      svg, tip, at: [(x + w / 2) / width, (y + Math.min(h / 2, 24)) / height],
      title: item.name,
      lines: [format(item.minor), `${percent}% of ${whole}`, ...more(item)],
      label: [`${item.name}, ${format(item.minor)}, ${percent}% of ${whole}`, ...more(item)].join('. ') + '.' + (inside.length ? ' Zooms in.' : ''),
      onPick: item.children?.length ? () => onPick(item) : null,
      focusKey: 'rp-slice:' + item.id
    }));
  });
  svg.append(blocks);
  return svg;
}

// ---- ui/reports.js ----
// The Reports tab: one row of controls (period, view, filters), the figure, the
// Hide toggles for Fixed expenses and Regulars, a view (donut, bars, trend or
// treemap) and under every view a ranked list of categories. Any view can be
// compared with earlier months.
//
// The figures come from ../reports-view.js; the drawings from ./report-charts.js.
// Totals are in the reporting currency. Entries without a value in it are
// never mixed in: they are counted and shown apart, in their own currency.









const REPORTS_KEY = 'expense-book.reports';

/**
 * The period, view, Hide toggles and comparison last chosen on this device.
 * Anything unreadable falls back to the defaults: nothing hidden, no comparison.
 */
function loadReportChoice() {
  const choice = { period: DEFAULT_REPORT_PERIOD, custom: null, view: DEFAULT_REPORT_VIEW, hide: { fixed: false, regulars: false }, compare: '' };
  try {
    const saved = JSON.parse(localStorage.getItem(REPORTS_KEY) || 'null');
    if (saved && typeof saved === 'object') {
      try { choice.custom = reportPeriod('custom', '', { from: saved.from, to: saved.to }); } catch { /* no custom dates kept */ }
      if (REPORT_PERIODS.some(p => p.id === saved.period) && (saved.period !== 'custom' || choice.custom)) choice.period = saved.period;
      if (REPORT_VIEWS.some(v => v.id === saved.view)) choice.view = saved.view;
      choice.hide = { fixed: saved.hideFixed === true, regulars: saved.hideRegulars === true };
      if (REPORT_COMPARISONS.some(c => c.id === saved.compare)) choice.compare = saved.compare;
    }
  } catch { /* storage is blocked or holds something else: use the defaults */ }
  return choice;
}

function saveReportChoice() {
  try {
    localStorage.setItem(REPORTS_KEY, JSON.stringify({
      period: reportsUi.period, view: reportsUi.view, from: reportsUi.custom?.from, to: reportsUi.custom?.to,
      hideFixed: reportsUi.hide.fixed, hideRegulars: reportsUi.hide.regulars, compare: reportsUi.compare
    }));
  } catch { /* the choice then lasts until the page is closed */ }
}

// View state kept between re-renders.
//   hide    → { fixed, regulars }: the Hide toggles
//   compare → '' or an ID from REPORT_COMPARISONS
//   drill   → '' (all categories), a top-level category ID, or 'other' (the donut's small slices)
//   hidden  → categories switched off in the bars legend
//   animate → the next drawing was reached by drilling, so it may ease in
const reportsUi = {
  ...loadReportChoice(),
  account: '', pot: '', includeTravel: false,
  drill: '', hidden: new Set(), table: false, animate: false
};

/** '1 Nov 2026' for '2026-11-01'. */
function reportDate(iso) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

function renderReports(root) {
  const state = ledger.state;
  const today = todayIso();
  /** Draw again; focus goes to `focusKey`, or stays on the control that had it. */
  const rerender = focusKey => {
    const key = focusKey || document.activeElement?.dataset?.focus;
    root.replaceChildren();
    renderReports(root);
    if (key) root.querySelector(`[data-focus="${CSS.escape(key)}"]`)?.focus();
  };

  // Keep the choices valid when accounts or pots change.
  if (reportsUi.account && !state.accounts.some(a => a.id === reportsUi.account)) reportsUi.account = '';
  if (reportsUi.pot && !state.pots.some(p => p.id === reportsUi.pot && !p.archived)) reportsUi.pot = '';
  if (reportsUi.period === 'custom' && !reportsUi.custom) reportsUi.period = DEFAULT_REPORT_PERIOD;

  const period = reportPeriod(reportsUi.period, today, reportsUi.custom);
  const filters = { account: reportsUi.account, pot: reportsUi.pot, includeTravel: reportsUi.includeTravel };
  const groups = reportHideGroups(state);
  const exclude = groups.filter(group => reportsUi.hide[group.key]).map(group => group.pot);
  const report = reportsView(state, { period, filters, exclude, today });
  const compare = reportsUi.compare ? compareView(state, { period, filters, exclude, today, mode: reportsUi.compare, report }) : null;
  const context = { state, today, report, compare, groups, filters, exclude, rerender, money: minor => formatMoney(minor, report.currency, report.precision) };

  root.append(slip({ label: 'Reports', kind: REPORT_PERIODS.find(p => p.id === reportsUi.period).label, wide: true },
    buildReportControls(context),
    buildReportSummary(context),
    buildReportView(context),
    buildMissingNote(report)));
}

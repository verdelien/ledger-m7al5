  if (!validDate(from) || !validDate(to) || !validDate(asOf)) throw Error('Choose valid dates.');
  const items = [];
  if (to < from) return items;
  const scheduleName = id => s.schedules.find(r => r.id === id)?.name;
  const categoryName = id => s.categories.find(c => c.id === id)?.name;
  const label = e => scheduleName(e.schedule) || e.note || categoryName(e.category) || (e.kind === 'transfer' ? 'Transfer' : e.kind);

  for (const e of s.entries) {
    if (e.ledger === 'active' && e.status === 'planned' && e.date >= from && e.date <= to) {
      items.push({ ...e, label: label(e), estimated: e.valuationStatus === 'estimated' });
    }
  }

  const start = from > asOf ? from : asOf;
  if (start <= to) {
    const known = new Set(s.entries.map(e => e.id));
    for (const t of s.trash) if (t.table === 'entries') known.add(t.record.id);
    for (const rule of s.schedules) {
      if (rule.archived || !rule.entry) continue;
      // The model keeps one open repayment per card; do the same here.
      if (rule.repayment && s.entries.some(e => e.schedule === rule.id && e.status === 'planned')) continue;
      for (const date of occurrences(rule, start, to)) {
        const id = `scheduled:${rule.id}:${date}`;
        if (known.has(id)) continue;
        const version = (rule.versions || []).filter(v => v.effectiveDate <= date)
          .sort((a, b) => a.effectiveDate.localeCompare(b.effectiveDate)).at(-1);
        let entry = version?.entry || rule.entry;
        let estimated = false;
        if (rule.repayment) {
          const debt = s.accounts.some(a => a.id === entry.toAccount) ? -accountBalance(s, entry.toAccount, asOf) : 0n;
          if (debt <= 0n) break;
          entry = { ...entry, minor: Number(debt), receivedMinor: Number(debt) };
          estimated = true;
        }
        items.push({ ...entry, id, date, status: 'planned', schedule: rule.id, ledger: 'active', virtual: true, estimated, label: rule.name || label(entry) });
        if (rule.repayment) break;
      }
    }
  }
  return items.sort((a, b) => a.date.localeCompare(b.date) || a.label.localeCompare(b.label));
}

// ---------------------------------------------------------------------------
// Calendar day totals
// ---------------------------------------------------------------------------

/** Add an entry's own-share amount to per-currency buckets: the reporting currency when its value there is known, otherwise its own. */
function addToBuckets(buckets, s, entry, sign) {
  const reporting = s.settings.reportingCurrency;
  const reportingValue = amountFor(entry, reporting, digits(reporting));
  const code = reportingValue === null ? entry.currency : reporting;
  const value = reportingValue === null ? amountFor(entry, entry.currency, entry.precision) : reportingValue;
  const bucket = buckets.get(code) || { currency: code, precision: reportingValue === null ? entry.precision : digits(reporting), minor: 0n };
  bucket.minor += sign * value;
  buckets.set(code, bucket);
}

/**
 * Money per day between `from` and `to`:
 *   spent   → posted expenses less refunds (own share), by currency
 *   planned → planned money going out (expenses and transfers such as the card repayment), by currency
 *   posted / items → the records behind them, and every other record that day, for the day sheet
 * Returns a Map keyed by date; days with nothing are absent.
 */
function calendarDays(s, from, to, asOf) {
  const days = new Map();
  const day = date => {
    if (!days.has(date)) days.set(date, { date, spent: new Map(), planned: new Map(), posted: [], items: [] });
    return days.get(date);
  };
  for (const e of s.entries) {
    if (e.ledger !== 'active' || e.status !== 'posted' || e.date < from || e.date > to) continue;
    const cell = day(e.date);
    cell.posted.push(e);
    if (e.kind === 'expense') addToBuckets(cell.spent, s, e, 1n);
    else if (e.kind === 'refund') addToBuckets(cell.spent, s, e, -1n);
  }
  for (const item of plannedItems(s, from, to, asOf)) {
    const cell = day(item.date);
    cell.items.push(item);
    if (item.kind === 'expense' || item.kind === 'transfer') addToBuckets(cell.planned, s, item, 1n);
  }
  return days;
}

/** A rough size in the reporting currency, used only to rank currencies. Never shown and never summed. */
function roughSize(bucket, settings) {
  const size = bucket.minor < 0n ? -bucket.minor : bucket.minor;
  let rate = { numerator: 1n, denominator: 1n };
  if (bucket.currency !== settings.reportingCurrency) {
    try { rate = rateParts(settings.defaultRates?.[bucket.currency] || '1'); } catch { /* keep 1 */ }
  }
  return size * rate.numerator * 10n ** 12n / (rate.denominator * 10n ** BigInt(bucket.precision));
}

/**
 * The one amount a calendar cell shows for a set of currency buckets.
 * One currency: that total. Several (conversion evidence is missing for
 * some): the largest, with `more: true` so the cell can add a "+".
 * Returns null when there is nothing to show.
 */
function cellAmount(buckets, settings) {
  const live = [...buckets.values()].filter(b => b.minor !== 0n);
  if (!live.length) return null;
  live.sort((a, b) => {
    const [sizeA, sizeB] = [roughSize(a, settings), roughSize(b, settings)];
    return sizeA === sizeB ? a.currency.localeCompare(b.currency) : sizeA > sizeB ? -1 : 1;
  });
  return { ...live[0], more: live.length > 1 };
}

/** A short amount for a narrow cell, in whole major units: 12, 950, 1.2k, 18k, 1.2m. Rounded; the day sheet has the exact figure. */
function compactAmount(minor, precision) {
  const value = BigInt(minor);
  const size = value < 0n ? -value : value;
  const sign = value < 0n ? '−' : '';
  const whole = divideRounded(size, 10n ** BigInt(precision));
  if (whole < 1000n) return sign + whole;
  const scaled = (unit, letter) => {
    const tenths = divideRounded(size, 10n ** BigInt(precision) * unit / 10n);
    if (tenths >= 100n) return sign + divideRounded(tenths, 10n) + letter;
    return sign + (tenths / 10n) + (tenths % 10n ? '.' + (tenths % 10n) : '') + letter;
  };
  return divideRounded(size, 10n ** BigInt(precision) * 1000n) >= 1000n ? scaled(1000000n, 'm') : scaled(1000n, 'k');
}

// ---------------------------------------------------------------------------
// Forecast
// ---------------------------------------------------------------------------

/** Accounts a forecast can cover: not archived and not investments. */
function forecastAccounts(s) {
  return s.accounts.filter(a => !a.archived && a.type !== 'investment');
}

/**
 * The account choice a forecast opens with: the default account when one is
 * set, else the first GBP current account, else the first current account in
 * the reporting currency, else every account in the reporting currency.
 */
function defaultForecastAccount(s) {
  const accounts = forecastAccounts(s);
  const pick = accounts.find(a => a.id === s.settings.defaultAccount)
    || accounts.find(a => a.type === 'current' && a.currency === 'GBP')
    || accounts.find(a => a.type === 'current' && a.currency === s.settings.reportingCurrency);
  return pick ? pick.id : ALL_ACCOUNTS;
}

/**
 * The pots the "Left in pots" block shows, in the user's order: the saved
 * choice (settings.forecastPots), or Fixed expenses, Regulars and Flexible
 * until one is saved. Pots that are archived or gone are left out.
 */
function forecastPotsOf(s) {
  const wanted = Array.isArray(s.settings.forecastPots) ? s.settings.forecastPots : DEFAULT_FORECAST_POTS;
  return wanted.filter(id => s.pots.some(p => p.id === id && !p.archived));
}

/** What one planned item does to an account, in that account's currency. null: it does not touch it. 'unknown': it does, by an amount in another currency with no settled value. */
function effectOnAccount(item, account, assumeUnassigned) {
  let effect = null;
  const unassigned = !item.account && assumeUnassigned && ['expense', 'income', 'refund'].includes(item.kind);
  if (item.account === account.id || unassigned) {
    if (item.settledMinor == null && (item.currency !== account.currency || item.precision !== account.precision)) return 'unknown';
    const amount = BigInt(item.settledMinor ?? item.minor);
    const adds = ['income', 'refund'].includes(item.kind)
      || (['adjustment', 'settlement'].includes(item.kind) && item.direction === 'increase');
    effect = adds ? amount : -amount;
  }
  if (item.kind === 'transfer' && item.toAccount === account.id) effect = (effect || 0n) + BigInt(item.receivedMinor ?? item.minor);
  return effect;
}

/**
 * The forecast for a range.
 *   account → an account ID, or ALL_ACCOUNTS for every account held in the reporting currency
 *   pots    → the pot IDs to report on (see forecastPotsOf); none by default
 *
 * left = balance today + planned items up to the end of the range − estimates.
 * Planned items and estimates count from `today` to `range.to`, both included.
 * A planned expense or income with no account is taken to go through the
 * chosen account(s). Anything whose amount is not known in the forecast
 * currency is listed with `counted: false` and left out of the sums.
 * `pots` has one line per pot asked for: its balance today and what is left
 * in it at the end of the range.
 */
function forecastSummary(s, { range, today, account = ALL_ACCOUNTS, pots = [] }) {
  const all = forecastAccounts(s);
  const chosen = account === ALL_ACCOUNTS
    ? all.filter(a => a.currency === s.settings.reportingCurrency)
    : all.filter(a => a.id === account);
  if (!chosen.length) return null;
  const { currency, precision } = chosen[0];
  if (chosen.some(a => a.currency !== currency || a.precision !== precision)) throw Error('A forecast covers one currency at a time.');

  let balance = 0n;
  for (const a of chosen) balance += accountBalance(s, a.id, today);

  const planned = plannedItems(s, today, range.to, today);
  const fixed = [];
  let fixedTotal = 0n; // signed: money out is negative
  for (const item of planned) {
    let effect = null;
    let unknown = false;
    chosen.forEach((a, index) => {
      const one = effectOnAccount(item, a, index === 0);
      if (one === 'unknown') unknown = true;
      else if (one !== null) effect = (effect ?? 0n) + one;
    });
    if (effect === null && !unknown) continue; // another account's business
    const counted = !unknown;
    if (counted) fixedTotal += effect;
    fixed.push({
      id: item.id, tag: 'fixed', name: item.label, date: item.date, kind: item.kind, category: item.category || '',
      estimated: !!item.estimated, counted,
      minor: counted ? effect : BigInt(item.minor), currency: counted ? currency : item.currency, precision: counted ? precision : item.precision
    });
  }

  const estimates = [];
  let estimateTotal = 0n;
  for (const estimate of estimatesOf(s)) {
    if (estimate.every !== 'week') continue;
    for (const line of estimateLines(estimate, today, range.to)) {
      const counted = line.currency === currency && line.precision === precision;
      if (counted) estimateTotal += line.minor;
      estimates.push({ ...line, counted });
    }
  }
  estimates.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));

  const left = balance + fixedTotal - estimateTotal;
  const uncounted = fixed.filter(line => !line.counted).length + estimates.filter(line => !line.counted).length;

  return {
    currency, precision, accounts: chosen.map(a => a.id),
    balance, fixedTotal, estimateTotal, left, uncounted,
    fixed, estimates,
    pots: pots.map(id => potForecast(s, id, planned, today, range.to)).filter(Boolean)
  };
}

/** A pot's balance today less the planned spending and the estimates that draw on it, up to `to`. `missing` counts amounts with no value in the pot's currency. */
function potForecast(s, potId, planned, today, to) {
  const pot = s.pots.find(p => p.id === potId);
  if (!pot) return null;
  const now = potBalance(s, potId, today);
  let minor = now.minor;
  let missing = now.missing;
  for (const row of spendingRows(s, planned).filter(r => r.pot === potId)) {
    const value = amountFor(row, pot.currency, pot.precision);
    if (value === null) missing++;
    else minor += row.kind === 'refund' ? value : -value;
  }
  for (const estimate of estimatesOf(s)) {
    if (estimate.every !== 'week' || s.categories.find(c => c.id === estimate.category)?.pot !== potId) continue;
    if (estimate.currency !== pot.currency || digits(estimate.currency) !== pot.precision) { missing++; continue; }
    for (const line of estimateLines(estimate, today, to)) minor -= line.minor;
  }
  return { id: potId, name: pot.name, icon: pot.icon || null, currency: pot.currency, precision: pot.precision, balance: now.minor, left: minor, missing };
}

// ---- payday-flow.js ----
// The monthly payday flow. Pure functions over the ledger state: nothing here
// saves, reads the clock or touches the page.
//
// On payday the salary is shared out between pots, in this order:
//   1. savings    a fixed amount plus a percentage of the salary
//   2. fixed      fill "Fixed expenses" up to what is due before the next payday
//   3. regulars   fill "Regulars" up to the weekly estimates until the next payday
//   4. leftover   whatever is left goes to "Flexible savings"
// When the percentage is of disposable income (the salary less the fixed and
// regulars steps), savings come third instead: fixed, regulars, savings, leftover.
//
// Pots are a plan, not bank cash: every line is an allocation from outside
// into a pot, linked to the salary entry. No money leaves an account, and
// nothing is ever taken out of a pot (savings included) to cover a shortfall.
// Money is integer minor units (BigInt while summing), one currency only.






/** The income category that starts the flow. */
const SALARY_CATEGORY = 'Salary';

/** The steps, in the order they are filled. */
const PAYDAY_FLOW_STEPS = [
  { id: 'savings', potKey: 'savingsPot', label: 'Savings' },
  { id: 'fixed', potKey: 'fixedPot', label: 'Fixed expenses' },
  { id: 'regulars', potKey: 'regularsPot', label: 'Regulars' },
  { id: 'leftover', potKey: 'leftoverPot', label: 'What is left' }
];

/** Used until the user saves their own in Settings → Payday. The savings portion starts at nothing. */
const DEFAULT_PAYDAY_FLOW = Object.freeze({
  savingsPot: 'savings',
  savings: Object.freeze({ fixedMinor: 0, percent: 0, percentBase: 'total' }),
  fixedPot: 'Bills', regularsPot: 'Life regulars', leftoverPot: 'flexible-savings'
});

/**
 * settings.paydayFlow with defaults filled in. The savings portion is both parts added together:
 *   savings.fixedMinor   an amount in minor units
 *   savings.percent      hundredths of a percent (1250 = 12.5%)
 *   savings.percentBase  'total'       the percentage is of the salary
 *                        'disposable'  of the salary less the fixed and regulars steps
 * A setting still in the earlier savingsMode/savingsValue shape is read as the new one.
 */
function paydayFlowSetting(s) {
  const saved = migratePaydayFlow(s.settings.paydayFlow) || {};
  return { ...DEFAULT_PAYDAY_FLOW, ...saved, savings: { ...DEFAULT_PAYDAY_FLOW.savings, ...(saved.savings || {}) } };
}

/** The steps in the order they are filled: savings first, or third when the percentage is of disposable income. */
function paydayFlowOrder(flow) {
  const ids = flow.savings?.percentBase === 'disposable'
    ? ['fixed', 'regulars', 'savings', 'leftover']
    : ['savings', 'fixed', 'regulars', 'leftover'];
  return ids.map(id => PAYDAY_FLOW_STEPS.find(step => step.id === id));
}

/**
 * The savings portion for a salary. `deducted` is what the fixed and regulars
 * steps took; it only matters for the 'disposable' base.
 * Returns { base, fixedPart, percentPart, requested }, all BigInt minor units.
 */
function savingsPortion(savings, salaryMinor, deducted = 0n) {
  const salary = BigInt(salaryMinor);
  const rest = salary - BigInt(deducted);
  const base = savings.percentBase === 'disposable' ? (rest > 0n ? rest : 0n) : salary;
  const fixedPart = BigInt(savings.fixedMinor);
  const percentPart = divideRounded(base * BigInt(savings.percent), 10000n);
  return { base, fixedPart, percentPart, requested: fixedPart + percentPart };
}

/** True when saving this entry should offer the payday flow: a posted salary that has not been shared out. */
function opensPaydayFlow(s, entry) {
  const recorded = s.entries.find(e => e.id === entry?.id);
  return isSalaryEntry(s, recorded) && !salaryAlreadyAllocated(s, recorded.id);
}

/** True for a posted income entry in the Salary category (or under it). */
function isSalaryEntry(s, entry) {
  return Boolean(entry) && entry.kind === 'income' && entry.status === 'posted' && entry.ledger === 'active'
    && Boolean(entry.category) && withinCategory(s, entry.category, SALARY_CATEGORY);
}

/** The same guard the earlier salary allocation used: one distribution per income entry. */
function salaryAlreadyAllocated(s, entryId) {
  return s.allocations.some(a => a.salary === entryId);
}

/** Salary entries that have not been distributed yet, newest first. */
function unallocatedSalaries(s) {
  return s.entries
    .filter(e => isSalaryEntry(s, e) && !salaryAlreadyAllocated(s, e.id))
    .sort((a, b) => b.date.localeCompare(a.date) || a.id.localeCompare(b.id));
}

/** The recorded entry and the pots of each step; throws a readable error when the flow cannot run. */
function paydayFlowContext(s, entry) {
  const recorded = s.entries.find(e => e.id === entry?.id);
  if (!recorded || recorded.minor !== entry.minor || recorded.currency !== entry.currency || recorded.date !== entry.date) {
    throw Error('Record the income first, or preview again if it changed.');
  }
  if (recorded.kind !== 'income' || recorded.status !== 'posted' || recorded.ledger !== 'active') {
    throw Error('Choose a posted income entry.');
  }
  if (salaryAlreadyAllocated(s, recorded.id)) throw Error('This income has already been allocated.');

  const flow = paydayFlowSetting(s);
  const pots = {};
  for (const step of PAYDAY_FLOW_STEPS) {
    const pot = s.pots.find(p => p.id === flow[step.potKey]);
    if (!pot || pot.archived) throw Error(`Choose a pot for "${step.label}" in Settings → Payday.`);
    // Never mix currencies: a pot in another currency would need a valuation.
    if (pot.currency !== recorded.currency || pot.precision !== recorded.precision) {
      throw Error(`${pot.name} is in ${pot.currency}, and this salary is in ${recorded.currency}. Choose pots in the salary's currency.`);
    }
    pots[step.id] = pot;
  }
  if (pots.fixed.id === pots.regulars.id) throw Error('Fixed expenses and Regulars need different pots.');
  return { recorded, flow, pots };
}

/**
 * What is due from a pot between `from` and `to`: planned entries and
 * schedule dates with no entry yet (rent, bills, subscriptions).
 * `missing` counts items with no value in the pot's currency; they are left out.
 */
function fixedDue(s, pot, from, to) {
  let minor = 0n;
  let missing = 0;
  const items = [];
  if (to < from) return { minor, missing, items };
  for (const row of spendingRows(s, plannedItems(s, from, to, from)).filter(r => r.pot === pot.id)) {
    const value = amountFor(row, pot.currency, pot.precision);
    if (value === null) { missing++; continue; }
    minor += row.kind === 'refund' ? -value : value;
    items.push({ id: row.id, label: row.label, date: row.date, minor: value, estimated: Boolean(row.estimated) });
  }
  return { minor: minor < 0n ? 0n : minor, missing, items };
}

/**
 * The weekly estimates that draw on a pot, from `from` to `to`: the weekly
 * amount for each week, and a share by days for a part week (as the forecast does).
 */
function regularsDue(s, pot, from, to) {
  let minor = 0n;
  let missing = 0;
  if (to < from) return { minor, missing };
  for (const estimate of estimatesOf(s)) {
    if (estimate.every !== 'week' || s.categories.find(c => c.id === estimate.category)?.pot !== pot.id) continue;
    if (estimate.currency !== pot.currency) { missing++; continue; }
    for (const line of estimateLines(estimate, from, to)) minor += line.minor;
  }
  return { minor, missing };
}

/**
 * The preview for one salary entry. `today` matters when the salary is shared
 * out some days after it arrived: balances and what is still due are taken
 * from that day on.
 *
 * Returns { entry, salary, period: { from, to }, savings, lines, short, remaining }.
 * `savings` is the rule used, with the base the percentage was taken of.
 * Lines come in the order they are filled (see paydayFlowOrder).
 * Each line: { step, label, pot, potName, target, balance, requested, funded, shortfall, missing }
 *   target     what the pot should hold (fixed and regulars only)
 *   requested  what the step asks for; funded what the salary covers, in order
 *   missing    amounts that could not be valued in the pot's currency (left out)
 * `short` lists the steps the salary did not cover.
 */
function paydayFlowPreview(s, entry, today = entry?.date) {
  const { recorded, flow, pots } = paydayFlowContext(s, entry);
  const salary = BigInt(recorded.minor);
  const asOf = today > recorded.date ? today : recorded.date;
  const to = forecastRange('before-payday', recorded.date, s.settings).to;

  // Fixed and regulars: top the pot up to what it needs, counting what it already holds.
  const topUp = (pot, due) => {
    const balance = potBalance(s, pot.id, asOf);
    const gap = due.minor - balance.minor;
    return { target: due.minor, balance: balance.minor, requested: gap > 0n ? gap : 0n, missing: due.missing + balance.missing };
  };
  const wanted = {
    fixed: topUp(pots.fixed, fixedDue(s, pots.fixed, asOf, to)),
    regulars: topUp(pots.regulars, regularsDue(s, pots.regulars, asOf, to))
  };

  let available = salary;
  let portion = null;
  const lines = [];
  for (const step of paydayFlowOrder(flow)) {
    const pot = pots[step.id];
    let want = wanted[step.id];
    if (step.id === 'savings') {
      // With the 'disposable' base this runs third, so the salary less what fixed and regulars took is known.
      portion = savingsPortion(flow.savings, salary, salary - available);
      want = { requested: portion.requested };
    }
    // The last step takes whatever the first three left.
    if (step.id === 'leftover') want = { requested: available };
    const funded = available < want.requested ? available : want.requested;
    available -= funded;
    lines.push({
      step: step.id, label: step.label, pot: pot.id, potName: pot.name,
      target: want.target ?? null, balance: want.balance ?? null, missing: want.missing || 0,
      requested: want.requested, funded, shortfall: want.requested - funded
    });
  }
  return {
    entry: recorded, salary, period: { from: asOf, to }, savings: { ...flow.savings, ...portion }, lines,
    short: lines.filter(line => line.shortfall > 0n).map(line => line.step),
    remaining: available
  };
}

/**
 * The allocations for the amounts the user confirmed, one per step with an
 * amount. `amounts` is { savings, fixed, regulars, leftover } in minor units.
 * IDs are fixed per salary entry and step, so saving twice cannot add twice.
 */
function paydayFlowOperations(s, entry, amounts) {
  const { recorded, flow, pots } = paydayFlowContext(s, entry);
  let total = 0n;
  const operations = [];
  for (const step of paydayFlowOrder(flow)) {
    const minor = BigInt(amounts?.[step.id] ?? 0);
    if (minor < 0n) throw Error('An amount cannot be below zero.');
    if (minor === 0n) continue;
    if (minor > BigInt(Number.MAX_SAFE_INTEGER)) throw Error('An amount is outside the supported integer range.');
    total += minor;
    operations.push({
      table: 'allocations',
      record: {
        id: `salary:${recorded.id}:${step.id}`, date: recorded.date, from: '', to: pots[step.id].id,
        minor: Number(minor), salary: recorded.id, note: `Payday: ${step.label.toLowerCase()}`
      }
    });
  }
  if (total > BigInt(recorded.minor)) throw Error('These amounts add up to more than the salary.');
  if (!operations.length) throw Error('Enter at least one amount to distribute.');
  return operations;
}

/** Write the confirmed allocations in one batch. A second attempt for the same salary is refused. */
function confirmPaydayFlow(s, entry, amounts) {
  return commitBatch(s, paydayFlowOperations(s, entry, amounts));
}

/**
 * A worked example of a savings rule against the latest salary, for Settings.
 * Returns null without a salary, or { entry, salary, base, fixedPart, percentPart, requested }.
 * For the 'disposable' base it uses what the fixed and regulars steps were
 * given if that salary was shared out, and what they would ask for otherwise.
 */
function savingsExample(s, savings) {
  const entry = s.entries.filter(e => isSalaryEntry(s, e))
    .sort((a, b) => b.date.localeCompare(a.date) || a.id.localeCompare(b.id))[0];
  if (!entry) return null;
  const salary = BigInt(entry.minor);
  let deducted = 0n;
  if (savings.percentBase === 'disposable') {
    if (salaryAlreadyAllocated(s, entry.id)) {
      for (const step of ['fixed', 'regulars']) {
        deducted += BigInt(s.allocations.find(a => a.id === `salary:${entry.id}:${step}`)?.minor ?? 0);
      }
    } else {
      try {
        const lines = paydayFlowPreview({ ...s, settings: { ...s.settings, paydayFlow: { ...paydayFlowSetting(s), savings } } }, entry).lines;
        deducted = lines.filter(line => line.step === 'fixed' || line.step === 'regulars').reduce((sum, line) => sum + line.funded, 0n);
      } catch {
        return null; // the flow cannot run yet (a pot is missing or in another currency)
      }
    }
  }
  return { entry, salary, ...savingsPortion(savings, salary, deducted) };
}

// ---- pots-logic.js ----
// Pot rules for the new interface. Pure functions over the ledger state:
// nothing here saves, reads the clock or touches the page.
//
//   - a pot's month at a glance (funding, spending, what is coming up)
//   - the warning when an expense would take a pot below zero
//   - a move between two pots (only ever when the user asks)
//   - the opt-in three-month rollover of unused funding into savings
//
// Pots are a plan, not bank cash: a move is one allocation and no account
// changes. Money is integer minor units (BigInt while summing). A pot move
// needs both pots in the same currency; nothing is converted.






// ---------------------------------------------------------------------------
// A pot's month
// ---------------------------------------------------------------------------

/**
 * This calendar month for one pot, up to `today`:
 *   funded    allocations into the pot
 *   movedOut  allocations out of it
 *   spent     posted expenses less refunds
 *   missing   spending with no value in the pot's currency (left out)
 */
function potMonthSummary(s, potId, today) {
  const pot = s.pots.find(p => p.id === potId);
  if (!pot) throw Error('Pot not found.');
  const { from } = monthBounds(today);
  const inMonth = record => record.date >= from && record.date <= today;

  let funded = 0n;
  let movedOut = 0n;
  for (const a of s.allocations.filter(inMonth)) {
    if (a.to === potId) funded += BigInt(a.minor);
    if (a.from === potId) movedOut += BigInt(a.minor);
  }

  let spent = 0n;
  let missing = 0;
  const posted = s.entries.filter(e => e.ledger === 'active' && e.status === 'posted' && inMonth(e));
  for (const row of spendingRows(s, posted)) {
    if (row.pot !== potId) continue; // a refund carries the pot of its purchase
    const value = amountFor(row, pot.currency, pot.precision);
    if (value === null) missing++;
    else spent += row.kind === 'refund' ? -value : value;
  }
  return { from, to: today, funded, movedOut, spent, missing };
}

/** Planned items that will draw on a pot from `today` until the day before the next payday. */
function potUpcoming(s, potId, today) {
  const pot = s.pots.find(p => p.id === potId);
  if (!pot) throw Error('Pot not found.');
  const { to } = forecastRange('before-payday', today, s.settings);
  return spendingRows(s, plannedItems(s, today, to, today))
    .filter(row => row.pot === potId && row.kind === 'expense')
    .map(row => ({ id: row.id, label: row.label, date: row.date, minor: BigInt(row.minor), currency: row.currency, precision: row.precision, estimated: Boolean(row.estimated) }));
}

// ---------------------------------------------------------------------------
// Below zero
// ---------------------------------------------------------------------------

/**
 * Would a save take a pot below zero? Compare the ledger `before` and `after`
 * the save. Returns null when there is nothing to say, or
 * { pot, balance, shortfall } (balance is negative; shortfall is what would cover it).
 *
 * It stays quiet when the save does not make the pot worse (for example,
 * lowering an expense in a pot that is already red), and for a pot that has
 * never been funded: pots are not in use there yet.
 */
function negativePotCheck(before, after, potId, asOf) {
  const pot = after.pots.find(p => p.id === potId);
  if (!pot) return null;
  if (!after.allocations.some(a => a.to === potId)) return null;
  const was = potBalance(before, potId, asOf).minor;
  const now = potBalance(after, potId, asOf).minor;
  if (now >= 0n || now >= was) return null;
  return { pot, balance: now, shortfall: -now };
}

/**
 * One allocation moving `minor` from pot `from` to pot `to` on `date`.
 * Returns the operation for commitBatch. The source must hold that much:
 * a move never turns another pot red.
 */
function potMoveOperation(s, { id, from, to, minor, date, note = '' }) {
  const source = s.pots.find(p => p.id === from);
  const target = s.pots.find(p => p.id === to);
  if (!source || !target) throw Error('Choose the pot to move from.');
  if (source.id === target.id) throw Error('Choose a different pot to move from.');
  if (source.currency !== target.currency || source.precision !== target.precision) {
    throw Error(`${source.name} and ${target.name} are in different currencies. Nothing is converted between pots.`);
  }
  if (!Number.isSafeInteger(minor) || minor <= 0) throw Error('Enter an amount to move.');
  const held = potBalance(s, source.id, date);
  if (held.minor < BigInt(minor)) throw Error(`${source.name} does not hold that much.`);
  return { table: 'allocations', record: { id, date, from: source.id, to: target.id, minor, note } };
}

// ---------------------------------------------------------------------------
// Three-month rollover (opt-in per pot)
// ---------------------------------------------------------------------------

const DEFAULT_ROLLOVER_MONTHS = 3;

/** A pot's rollover setting with defaults filled in. Off unless the user switched it on. */
function rolloverSetting(pot) {
  return { enabled: false, months: DEFAULT_ROLLOVER_MONTHS, to: '', ...(pot?.rollover || {}) };
}

/** The ID of the sweep of one pot's funding from one month ('2026-07'). One per pot and month, ever. */
function rolloverId(potId, month) {
  return `rollover:${potId}:${month}`;
}

/**
 * What the rollover would move on `today`. Nothing is written.
 *
 * Each pot's funding is aged first in, first out: everything that left the
 * pot (spending less refunds, moves out, earlier sweeps) uses up the oldest
 * funding first. Funding is grouped by the calendar month it arrived in; a
 * month is due once all of its funding is at least `months` old. What is
 * left of a due month moves to the target pot.
 *
 * A month is swept once: if its sweep exists, or was undone (it is then
 * among the deleted records), it is not swept again.
 *
 * Returns { moves, skipped }.
 *   moves    [{ id, pot, potName, to, toName, month, minor, date, currency, precision }]
 *   skipped  [{ pot, reason }] for pots that could not be checked safely
 */
function rolloverPlan(s, today) {
  const moves = [];
  const skipped = [];
  const done = new Set(s.allocations.map(a => a.id));
  for (const item of s.trash) if (item.table === 'allocations') done.add(item.record.id);

  for (const pot of s.pots) {
    const setting = rolloverSetting(pot);
    if (pot.archived || !setting.enabled) continue;
    const target = s.pots.find(p => p.id === setting.to);
    if (!target || target.archived || target.id === pot.id || target.currency !== pot.currency || target.precision !== pot.precision) {
      skipped.push({ pot: pot.id, reason: 'Choose a savings pot in the same currency for the rollover.' });
      continue;
    }
    const balance = potBalance(s, pot.id, today);
    if (balance.missing) {
      skipped.push({ pot: pot.id, reason: 'Some spending has no value in the pot currency yet.' });
      continue;
    }
    if (balance.minor <= 0n) continue;

    // Funding, oldest first.
    const lots = s.allocations
      .filter(a => a.to === pot.id && a.date <= today)
      .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id))
      .map(a => ({ date: a.date, month: a.date.slice(0, 7), left: BigInt(a.minor) }));
    const fundedTotal = lots.reduce((sum, lot) => sum + lot.left, 0n);

    // Everything that left the pot uses up the oldest funding first.
    let used = fundedTotal - balance.minor;
    for (const lot of lots) {
      if (used <= 0n) break;
      const take = used < lot.left ? used : lot.left;
      lot.left -= take;
      used -= take;
    }

    // Group by month. A month is due when its newest funding is old enough.
    const months = new Map();
    for (const lot of lots) {
      const group = months.get(lot.month) || { left: 0n, newest: lot.date };
      group.left += lot.left;
      if (lot.date > group.newest) group.newest = lot.date;
      months.set(lot.month, group);
    }
    for (const [month, group] of months) {
      if (group.left <= 0n || addMonths(group.newest, setting.months) > today) continue;
      const id = rolloverId(pot.id, month);
      if (done.has(id)) continue;
      moves.push({
        id, pot: pot.id, potName: pot.name, to: target.id, toName: target.name, month,
        minor: group.left, date: today, currency: pot.currency, precision: pot.precision
      });
    }
  }
  return { moves, skipped };
}

/**
 * Write the due sweeps as dated allocations, in one batch.
 * Returns { state, moved, skipped }; `state` is the same object when nothing was due.
 * Running it again changes nothing.
 */
function applyRollover(s, today) {
  const { moves, skipped } = rolloverPlan(s, today);
  if (!moves.length) return { state: s, moved: [], skipped };
  const state = commitBatch(s, moves.map(move => ({
    table: 'allocations',
    record: {
      id: move.id, date: move.date, from: move.pot, to: move.to, minor: Number(move.minor),
      note: `Unused since ${move.month}`
    }
  })));
  return { state, moved: moves, skipped };
}

/**
 * Undo sweeps by ID: the allocations are removed (kept among the deleted
 * records), so the money is back in its pot and those months stay there.
 */
function undoRollover(s, ids) {
  const operations = s.allocations
    .filter(a => ids.includes(a.id) && a.id.startsWith('rollover:'))
    .map(record => ({ table: 'allocations', record, action: 'delete' }));
  return operations.length ? commitBatch(s, operations) : s;
}

// ---- transfer-logic.js ----
// Transfers between two accounts, with an optional fee taken from the amount received
// (an ATM or exchange charge that reduced what arrived).
//
// The transfer records the amount sent (in the from-account's currency) and the gross
// amount received (in the to-account's currency, before the fee). The fee is a linked
// expense on the receiving account, so the account's balance goes up by the net amount,
// the fee appears in reports, and nothing is counted twice.



const SOURCE_FEE_MESSAGE = 'This transfer has a fee taken from the amount sent. Edit it in the previous version.';

/** True when the transfer has the older kind of fee, charged on top at the source. */
function hasSourceFee(state, transfer) {
  return transfer.totalDebit != null || state.entries.some(entry => entry.feeFor === transfer.id);
}

/** The fee taken from the amount received (or null) and what actually arrived. */
function transferParts(state, transfer) {
  const fee = state.entries.find(entry => entry.feeOnReceived === transfer.id) || null;
  return { fee, receivedNet: BigInt(transfer.receivedMinor) - BigInt(fee ? fee.minor : 0) };
}

/**
 * Save a transfer and its fee as one change. Returns the new, validated state.
 *   transfer     the transfer record (id, account, toAccount, minor, date, status, note…)
 *   receivedNet  what actually arrived, in the destination currency's minor units
 *   fee          the fee taken from the amount received, same units; 0 for none
 *   feeCategory  the expense category for the fee; needed only when there is a fee
 */
function saveTransfer(state, { transfer, receivedNet, fee = 0, feeCategory = '' }) {
  if (!Number.isSafeInteger(fee) || fee < 0) throw Error('The fee cannot be negative.');
  if (!Number.isSafeInteger(receivedNet) || receivedNet <= 0) throw Error('Enter the amount received.');
  if (!Number.isSafeInteger(receivedNet + fee)) throw Error('Amount must be within the supported range.');

  const from = state.accounts.find(account => account.id === transfer.account);
  const to = state.accounts.find(account => account.id === transfer.toAccount);
  if (!transfer.account || !transfer.toAccount || !from || !to) {
    throw Error('Choose the account the money leaves and the account it arrives in.');
  }
  if (from.id === to.id) throw Error('Choose two different accounts.');
  if (hasSourceFee(state, transfer)) throw Error(SOURCE_FEE_MESSAGE);

  const id = transfer.id;
  const old = state.entries.find(entry => entry.id === id);
  const oldFee = state.entries.find(entry => entry.feeOnReceived === id);

  const record = {
    ...transfer,
    kind: 'transfer',
    currency: from.currency,
    precision: from.precision,
    receivedMinor: receivedNet + fee
  };
  // The amount sent is always in the from-account's own currency.
  delete record.settledMinor; delete record.settledCurrency; delete record.settledPrecision;
  delete record.settledEstimate;
  // A changed amount makes an older reporting-currency value stale.
  if (old && (old.minor !== record.minor || old.currency !== record.currency)) {
    delete record.reportingMinor; delete record.reportingCurrency; delete record.reportingPrecision;
  }
  if (fee > 0) record.group = id;
  else if (record.group === id) delete record.group;

  const operations = [{ table: 'entries', record }];
  if (fee > 0) {
    const category = state.categories.find(c => c.id === feeCategory && c.kind === 'expense');
    if (!category) throw Error('Choose an expense category for the fee.');
    operations.push({
      table: 'entries',
      record: {
        id: oldFee?.id || 'rfee:' + id,
        kind: 'expense',
        feeOnReceived: id,
        group: id,
        status: record.status,
        date: record.date,
        minor: fee,
        currency: to.currency,
        precision: to.precision,
        account: to.id,
        category: category.id,
        pot: category.pot || '',
        trip: '',
        tags: 'fee',
        note: 'Fee taken from the amount received',
        ledger: 'active'
      }
    });
  } else if (oldFee) {
    operations.push({ table: 'entries', record: oldFee, action: 'delete' });
  }
  return commitBatch(state, operations);
}

// ---- refund-logic.js ----
// Refunds against a purchase.
//
// A refund is its own record that points at the purchase (`original`). It copies the
// purchase's currency, account, category and pot, so the money returns to the same
// account and the same pot. A purchase can have several part refunds; together they can
// never be more than the purchase.
//
// Purchases shared with a friend, and fees that belong to a transfer, have their own
// rules and are still refunded in the previous version.





/** Today's date on this device, as YYYY-MM-DD. */
function localToday() {
  const now = new Date();
  const pad = number => String(number).padStart(2, '0');
  return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
}

/** '85.00' for 8500 at precision 2. Plain fixed decimals, for messages. */
function fixedAmount(minor, precision) {
  const digits = BigInt(minor).toString().padStart(precision + 1, '0');
  return precision ? `${digits.slice(0, -precision)}.${digits.slice(-precision)}` : digits;
}

/** `part` of `whole`, applied to `amount`, rounded half away from zero. */
function proportion(amount, part, whole) {
  return Number(divideRounded(BigInt(amount) * BigInt(part), BigInt(whole)));
}

/**
 * How much of a purchase has been refunded already, in the purchase currency's minor
 * units. `exceptId` leaves one refund out: the one being edited.
 */
function refundedSoFar(state, purchase, exceptId = '') {
  return state.entries
    .filter(entry => entry.kind === 'refund' && entry.original === purchase.id
      && entry.status !== 'cancelled' && entry.id !== exceptId)
    .reduce((sum, entry) => sum + BigInt(entry.minor), 0n);
}

/** True when this purchase's refunds can be recorded in this version. */
function canRefundHere(state, purchase) {
  return Boolean(purchase)
    && purchase.kind === 'expense'
    && purchase.status === 'posted'
    && purchase.ledger === 'active'
    && !purchase.friend
    && !purchase.feeOnReceived
    && !purchase.feeFor;
}

/**
 * The likely amount credited to the account for a refund of `minor`, when the account
 * is in a different currency from the purchase: the same share of the original charge.
 * Null when the purchase was paid in the account's own currency.
 */
function suggestedSettled(purchase, minor) {
  if (purchase.settledMinor == null) return null;
  if (!Number.isSafeInteger(minor) || minor <= 0 || !(purchase.minor > 0)) return null;
  return proportion(purchase.settledMinor, minor, purchase.minor);
}

/**
 * Add a refund, or change an existing one. Returns the new, validated state.
 *   purchaseId       the purchase being refunded
 *   id               the refund to change; empty for a new refund
 *   minor            the refund, in the purchase currency's minor units
 *   date             YYYY-MM-DD; from the purchase date up to today
 *   note             optional text
 *   settledMinor     what the account was credited, in the account currency's minor
 *                    units. Only for a purchase in another currency; left out, it is
 *                    estimated from the original charge.
 *   settledEstimate  true when a given settledMinor is itself an estimate
 *   today            the latest date allowed; defaults to today on this device
 */
function saveRefund(state, { purchaseId, id = '', minor, date, note = '', settledMinor, settledEstimate, today = localToday() }) {
  const purchase = state.entries.find(entry => entry.id === purchaseId);
  if (!purchase) throw Error('The purchase for this refund was not found.');
  if (!canRefundHere(state, purchase)) throw Error('Refunds for this purchase are recorded in the previous version.');
  if (id && !state.entries.some(entry => entry.id === id && entry.kind === 'refund' && entry.original === purchase.id)) {
    throw Error('That refund was not found.');
  }

  if (!Number.isSafeInteger(minor) || minor <= 0) throw Error('Enter the refund amount.');
  const left = BigInt(purchase.minor) - refundedSoFar(state, purchase, id);
  if (left <= 0n) throw Error('This purchase is already fully refunded.');
  if (BigInt(minor) > left) {
    throw Error(`The most left to refund is ${fixedAmount(left, purchase.precision)} ${purchase.currency}.`);
  }

  if (typeof date !== 'string' || !validDate(date)) throw Error('Choose the refund date.');
  if (date < purchase.date) throw Error('A refund cannot be dated before the purchase.');
  if (date > today) throw Error('A refund cannot be dated in the future.');

  // Start from the purchase so the currency, account, category, pot, trip and tags match,
  // then remove what belongs to the purchase alone.
  const record = {
    ...purchase,
    id: id || uid(),
    kind: 'refund',
    original: purchase.id,
    minor,
    date,
    status: 'posted',
    note: String(note || '').trim()
  };
  for (const key of ['settledMinor', 'settledCurrency', 'settledPrecision', 'settledEstimate',
    'reportingMinor', 'reportingCurrency', 'reportingPrecision', 'splits', 'group', 'feeFor']) {
    delete record[key];
  }

  // The account is in another currency: record what it was credited.
  if (purchase.settledMinor != null && purchase.settledCurrency) {
    record.settledCurrency = purchase.settledCurrency;
    record.settledPrecision = purchase.settledPrecision;
    if (settledMinor == null) {
      record.settledMinor = proportion(purchase.settledMinor, minor, purchase.minor);
      record.settledEstimate = true;
    } else {
      if (!Number.isSafeInteger(settledMinor) || settledMinor <= 0) throw Error('Enter the amount credited to the account.');
      record.settledMinor = settledMinor;
      if (settledEstimate === true) record.settledEstimate = true;
    }
  }

  // Keep the same share of the purchase's reporting value, so reports show the net.
  if (purchase.reportingMinor != null && purchase.reportingCurrency) {
    record.reportingMinor = proportion(purchase.reportingMinor, minor, purchase.minor);
    record.reportingCurrency = purchase.reportingCurrency;
    record.reportingPrecision = purchase.reportingPrecision;
  }

  return commitBatch(state, [{ table: 'entries', record }]);
}

/** Remove one refund. Returns the new, validated state. */
function deleteRefund(state, id) {
  const record = state.entries.find(entry => entry.id === id);
  if (!record || record.kind !== 'refund') throw Error('That refund was not found.');
  return commitBatch(state, [{ table: 'entries', record, action: 'delete' }]);
}

// ---- reports-view.js ----
// Reports: the figures behind the Reports tab. Pure functions, no DOM.
//
// Money rules (see AGENTS.md):
//   - amounts are exact integer minor units (BigInt here);
//   - spending is net of refunds and counts only the user's own share;
//   - totals are in the reporting currency, and only for entries that carry a
//     value in it. Entries without one are never converted or mixed in: they
//     are counted in `missing` and listed per currency in `others`.







const REPORT_PERIODS = [
  { id: 'this-month', label: 'This month' },
  { id: 'last-month', label: 'Last month' },
  { id: 'last-3-months', label: 'Last 3 months' },
  { id: 'this-year', label: 'This year' },
  { id: 'custom', label: 'Custom' }
];
const DEFAULT_REPORT_PERIOD = 'this-month';
const REPORT_VIEWS = [
  { id: 'donut', label: 'Donut' },
  { id: 'bars', label: 'Bars' },
  { id: 'trend', label: 'Trend' },
  { id: 'treemap', label: 'Treemap' }
];
const DEFAULT_REPORT_VIEW = 'donut';
const REPORT_MONTHS = 12;
const REPORT_COLOURS = 10;
const UNCATEGORISED = 'uncategorised';
const SMALL_SLICE_PERCENT = 3;
// Comparisons: `back` lists how many months earlier each compared period lies.
// More than one means their average.
const REPORT_COMPARISONS = [
  { id: 'last-month', label: 'vs last month', short: 'last month', back: [1] },
  { id: 'average-3', label: 'vs average of last 3 months', short: '3-month average', back: [1, 2, 3] },
  { id: 'average-6', label: 'vs average of last 6 months', short: '6-month average', back: [1, 2, 3, 4, 5, 6] },
  { id: 'last-year', label: 'vs same month last year', short: 'last year', back: [12] }
];
// The two groups that can be hidden: the payday flow's Fixed expenses and Regulars pots.
const HIDE_GROUPS = [
  { key: 'fixed', title: 'Fixed expenses', potKey: 'fixedPot' },
  { key: 'regulars', title: 'Regulars', potKey: 'regularsPot' }
];
const HIDE_NAMES_SHOWN = 3;

/**
 * The dates a period covers, both ends counted.
 * "Last 3 months" is this month and the two before it; "Custom" takes `custom` ({ from, to }).
 */
function reportPeriod(id, today, custom) {
  if (id === 'custom') return validateCustomRange(custom?.from, custom?.to);
  if (id === 'last-month') return monthBounds(today, -1);
  if (id === 'last-3-months') return { from: monthBounds(today, -2).from, to: monthBounds(today).to };
  if (id === 'this-year') return { from: today.slice(0, 4) + '-01-01', to: today.slice(0, 4) + '-12-31' };
  return monthBounds(today);
}

/** The `count` months ending with the one that holds `today`, oldest first: ['2025-12', …, '2026-11']. */
function reportMonths(today, count = REPORT_MONTHS) {
  const months = [];
  for (let back = count - 1; back >= 0; back--) months.push(monthBounds(today, -back).from.slice(0, 7));
  return months;
}

/**
 * A spending row's own-share value in the reporting currency, or null when it has none.
 * Follows reportingTotal() in features.js, including the one-off display policy.
 */
function reportValue(s, row, currency, precision) {
  const direct = amountFor(row, currency, precision);
  if (direct !== null) return direct;
  const policy = s.settings.reportingDisplay;
  if (policy?.mode === 'oneoff' && row.reportingCurrency === policy.from && row.reportingMinor != null) {
    const value = BigInt(convert(row.reportingMinor, row.reportingPrecision, precision, policy.rate));
    return row.personalMinor != null ? divideRounded(value * BigInt(row.personalMinor), BigInt(row.minor)) : value;
  }
  return null;
}

/** Top-level expense categories in their saved order: the order colours are given in. */
function topLevelOrder(s) {
  return s.categories
    .map((category, position) => ({ category, position }))
    .filter(({ category }) => !category.parent && category.kind === 'expense')
    .sort((a, b) => (a.category.order ?? 0) - (b.category.order ?? 0) || a.position - b.position)
    .map(({ category }) => category.id);
}

/** For a category ID: its top-level ancestor and the child of that ancestor it sits under (null when it is the top itself). */
function categoryPlace(s, id, memo) {
  if (memo.has(id)) return memo.get(id);
  const byId = memo.byId || (memo.byId = new Map(s.categories.map(c => [c.id, c])));
  const path = [];
  const seen = new Set();
  for (let c = byId.get(id); c && !seen.has(c.id); c = c.parent ? byId.get(c.parent) : null) {
    seen.add(c.id);
    path.push(c);
  }
  const place = path.length ? { top: path[path.length - 1], child: path.length > 1 ? path[path.length - 2] : null } : { top: null, child: null };
  memo.set(id, place);
  return place;
}

/** Where a subcategory sits among its siblings, for a steady colour within its parent. */
function siblingColour(s, child, memo) {
  const key = 'siblings:' + child.parent;
  if (!memo.has(key)) {
    memo.set(key, s.categories
      .map((category, position) => ({ category, position }))
      .filter(({ category }) => category.parent === child.parent)
      .sort((a, b) => (a.category.order ?? 0) - (b.category.order ?? 0) || a.position - b.position)
      .map(({ category }) => category.id));
  }
  return memo.get(key).indexOf(child.id) % REPORT_COLOURS;
}

const sortBySize = (a, b) => (a.minor === b.minor ? a.name.localeCompare(b.name) : a.minor > b.minor ? -1 : 1);

/**
 * Everything the Reports tab shows.
 *   period  → { from, to }, both counted
 *   filters → { account, pot, includeTravel } (travel is off unless asked for: trips have their own view)
 *   exclude → pot IDs to hide: spending in a category whose own pot is one of them is left out
 *             of the totals, the categories and the months, and summed apart in `hidden`.
 *             The category decides, not the pot the purchase was paid from, so what is hidden
 *             is exactly the categories named on the toggle (see reportHideGroups).
 *   today   → fixes the last 12 months (or `monthCount` months)
 *
 * Returns
 *   currency, precision      the reporting currency every total below is in
 *   total, categories        the period: top-level categories, largest first, each with
 *                            { id, name, icon, colour, minor, children: [{ id, name, icon, colour, minor }] }
 *   months                   the last 12 months: { month, total, byCategory: { id: minor }, missing }
 *   monthCategories          the categories that appear in `months`, in colour order
 *   budget                   { pots: [{ id, name, kind, currency, precision, months: [{ month, budget, actual, missing }] }],
 *                              all: the same summed over pots in the reporting currency, leftOut: other pots' names }
 *   missing, others          period entries with no reporting value: how many, and their own-currency
 *                            sums kept apart as [{ currency, precision, minor, count }]
 *   hidden                   one per excluded pot: { pot, name, minor, missing } for the period,
 *                            `missing` being hidden entries with no reporting value (never added in)
 *
 * The budget series is a pot's own story: every posted purchase paid from it, whatever the
 * account or travel filter says, against the allocations made to it that month (sweeps by
 * the rollover are left out, so a tidy-up does not look like a smaller budget).
 * An excluded pot keeps its own series but is left out of "All pots" (named in `all.hidden`).
 */
function reportsView(s, { period, filters = {}, exclude = [], today, monthCount = REPORT_MONTHS }) {
  const currency = s.settings.reportingCurrency;
  const precision = digits(currency);
  const { account = '', pot = '', includeTravel = false } = filters;
  const months = reportMonths(today, monthCount);
  const excluded = new Set(exclude.filter(Boolean));
  const potOfCategory = new Map(s.categories.map(c => [c.id, c.pot]));
  const hidden = new Map([...excluded].map(id => [id, { pot: id, name: s.pots.find(p => p.id === id)?.name || id, minor: 0n, ids: new Set() }]));
  const monthIndex = new Map(months.map((month, index) => [month, index]));
  const order = topLevelOrder(s);
  const colourOf = id => {
    const index = order.indexOf(id);
    return index < 0 ? -1 : index % REPORT_COLOURS;
  };
  const memo = new Map();

  const tops = new Map(); // id → { id, name, icon, colour, minor, children: Map }
  const monthRows = months.map(month => ({ month, total: 0n, byCategory: {}, missing: 0 }));
  const others = new Map();
  const missingIds = new Set();
  const monthMissing = months.map(() => new Set());
  let total = 0n;

  const potSeries = s.pots.filter(p => !p.archived).map(p => ({
    id: p.id, name: p.name, kind: p.kind, currency: p.currency, precision: p.precision,
    months: months.map(month => ({ month, budget: 0n, actual: 0n, missing: 0 }))
  }));
  const seriesOf = new Map(potSeries.map(series => [series.id, series]));

  for (const a of s.allocations) {
    const index = monthIndex.get(a.date.slice(0, 7));
    if (index == null || a.id.startsWith('rollover:') || a.id.startsWith('quarter:')) continue;
    if (seriesOf.has(a.to)) seriesOf.get(a.to).months[index].budget += BigInt(a.minor);
    if (seriesOf.has(a.from)) seriesOf.get(a.from).months[index].budget -= BigInt(a.minor);
  }

  const posted = s.entries.filter(e => e.ledger === 'active' && e.status === 'posted' && ['expense', 'refund'].includes(e.kind));
  for (const row of spendingRows(s, posted)) {
    const sign = row.kind === 'refund' ? -1n : 1n;
    const index = monthIndex.get(row.date.slice(0, 7));
    const entryId = row.sourceId || row.id;

    // Budget against actual, in the pot's own currency.
    const series = seriesOf.get(row.pot);
    if (series && index != null) {
      const value = amountFor(row, series.currency, series.precision);
      if (value === null) series.months[index].missing++;
      else series.months[index].actual += sign * value;
    }

    if (row.trip && !includeTravel) continue;
    if (account && row.account !== account) continue;
    if (pot && row.pot !== pot) continue;

    const inPeriod = row.date >= period.from && row.date <= period.to;
    if (!inPeriod && index == null) continue;

    const value = reportValue(s, row, currency, precision);
    const hide = excluded.size ? hidden.get(potOfCategory.get(row.category)) : null;
    if (hide) {
      if (inPeriod && value === null) hide.ids.add(entryId);
      else if (inPeriod) hide.minor += sign * value;
      continue;
    }
    if (value === null) {
      if (index != null) monthMissing[index].add(entryId);
      if (inPeriod) {
        missingIds.add(entryId);
        const key = row.currency + ':' + row.precision;
        const other = others.get(key) || { currency: row.currency, precision: row.precision, minor: 0n, ids: new Set() };
        other.minor += sign * personalAmount(row);
        other.ids.add(entryId);
        others.set(key, other);
      }
      continue;
    }

    const place = categoryPlace(s, row.category, memo);
    const topId = place.top?.id || UNCATEGORISED;
    const signed = sign * value;

    if (index != null) {
      monthRows[index].total += signed;
      monthRows[index].byCategory[topId] = (monthRows[index].byCategory[topId] || 0n) + signed;
    }
    if (!inPeriod) continue;

    total += signed;
    if (!tops.has(topId)) {
      tops.set(topId, {
        id: topId, name: place.top?.name || 'Uncategorised', icon: place.top?.icon || null,
        colour: colourOf(topId), minor: 0n, children: new Map()
      });
    }
    const top = tops.get(topId);
    top.minor += signed;
    // Spending put straight on the parent is kept as its own line beside the subcategories.
    const childId = place.child?.id || topId + ':direct';
    if (!top.children.has(childId)) {
      top.children.set(childId, {
        id: childId, name: place.child?.name || `${top.name} (no subcategory)`, icon: place.child?.icon || null,
        colour: place.child ? siblingColour(s, place.child, memo) : -1, direct: !place.child, minor: 0n
      });
    }
    top.children.get(childId).minor += signed;
  }

  const categories = [...tops.values()].map(top => {
    const children = [...top.children.values()].sort(sortBySize);
    return { ...top, children: children.some(child => !child.direct) ? children : [] };
  }).sort(sortBySize);

  monthRows.forEach((row, index) => { row.missing = monthMissing[index].size; });
  const monthIds = new Set(monthRows.flatMap(row => Object.keys(row.byCategory)));
  const byId = new Map(s.categories.map(c => [c.id, c]));
  const monthCategories = [...order.filter(id => monthIds.has(id)), ...(monthIds.has(UNCATEGORISED) ? [UNCATEGORISED] : [])]
    .map(id => ({ id, name: byId.get(id)?.name || 'Uncategorised', icon: byId.get(id)?.icon || null, colour: colourOf(id) }));

  // "All pots": only pots kept in the reporting currency can be added together.
  const sameCurrency = series => series.currency === currency && series.precision === precision && !excluded.has(series.id);
  const all = {
    id: '', name: 'All pots', currency, precision,
    months: months.map((month, index) => potSeries.filter(sameCurrency).reduce((sum, series) => ({
      month,
      budget: sum.budget + series.months[index].budget,
      actual: sum.actual + series.months[index].actual,
      missing: sum.missing + series.months[index].missing
    }), { month, budget: 0n, actual: 0n, missing: 0 })),
    leftOut: potSeries.filter(series => !sameCurrency(series) && !excluded.has(series.id)).map(series => series.name),
    hidden: potSeries.filter(series => excluded.has(series.id)).map(series => series.name)
  };

  return {
    currency, precision, period, total, categories,
    months: monthRows, monthCategories,
    budget: { pots: potSeries, all },
    missing: missingIds.size,
    hidden: [...hidden.values()].map(({ ids, ...group }) => ({ ...group, missing: ids.size })),
    others: [...others.values()]
      .map(({ ids, ...other }) => ({ ...other, count: ids.size }))
      .sort((a, b) => a.currency.localeCompare(b.currency))
  };
}

// ---------------------------------------------------------------------------
// Hiding Fixed expenses and Regulars
// ---------------------------------------------------------------------------

/**
 * The two hide toggles: [{ key: 'fixed' | 'regulars', title, pot, names, label }].
 * The pot is settings.paydayFlow.fixedPot / regularsPot, or failing that the pot named
 * "Fixed expenses" / "Regulars"; a group with no such pot is left out.
 * `names` are the categories that belong to the pot, each branch named once at its highest
 * point: a top-level category when it is in the pot, otherwise the subcategory that is
 * ("TfL" under a Transport that is paid from elsewhere). The label shows at most three, then "…":
 *   "Hide Fixed expenses (Bills, Subscriptions)"
 */
function reportHideGroups(s) {
  const flow = s.settings.paydayFlow || {};
  const ordered = parent => s.categories
    .map((category, position) => ({ category, position }))
    .filter(({ category }) => (category.parent || '') === parent && category.kind === 'expense' && !category.archived)
    .sort((a, b) => (a.category.order ?? 0) - (b.category.order ?? 0) || a.position - b.position)
    .map(({ category }) => category);
  const namesIn = (pot, parent, seen) => ordered(parent).flatMap(category => {
    if (seen.has(category.id)) return [];
    seen.add(category.id);
    return category.pot === pot ? [category.name] : namesIn(pot, category.id, seen);
  });
  return HIDE_GROUPS.flatMap(({ key, title, potKey }) => {
    const pot = s.pots.find(p => p.id === flow[potKey])
      || s.pots.find(p => p.name.trim().toLowerCase() === title.toLowerCase());
    if (!pot) return [];
    const names = namesIn(pot.id, '', new Set());
    const shown = names.length > HIDE_NAMES_SHOWN ? [...names.slice(0, HIDE_NAMES_SHOWN), '…'] : names;
    return [{ key, title, pot: pot.id, names, label: `Hide ${title}` + (shown.length ? ` (${shown.join(', ')})` : '') }];
  });
}

// ---------------------------------------------------------------------------
// Comparing with earlier months
// ---------------------------------------------------------------------------

const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/**
 * A date moved `back` months earlier. The day number is kept, or clamped to the length of
 * the earlier month (30 Mar → 28 Feb). With `stickToEnd`, a month's last day stays a last day
 * (28 Feb → 31 Jan), so whole months are compared with whole months.
 */
function monthsEarlier(iso, back, stickToEnd) {
  const target = monthBounds(iso, -back);
  const lastDay = Number(target.to.slice(8));
  const isEnd = iso === monthBounds(iso).to;
  const day = stickToEnd && isEnd ? lastDay : Math.min(Number(iso.slice(8)), lastDay);
  return target.from.slice(0, 8) + String(day).padStart(2, '0');
}

/** '1–12 Nov', '28 Oct – 3 Nov', with the year when asked. */
function rangeLabel({ from, to }, withYear) {
  const part = (iso, day, year) => [day && Number(iso.slice(8)), MONTH_NAMES[Number(iso.slice(5, 7)) - 1], year && iso.slice(0, 4)].filter(Boolean).join(' ');
  if (from.slice(0, 7) === to.slice(0, 7)) return `${Number(from.slice(8))}–${part(to, true, withYear)}`;
  return `${part(from, true, withYear)} – ${part(to, true, withYear)}`;
}

/**
 * What a period is compared with.
 *   mode   → an ID from REPORT_COMPARISONS
 *   period → { from, to } as shown
 *   today  → for month-to-date fairness
 *
 * Month to date: when the period holds today and runs on past it (This month before the
 * month's last day), only the days so far are compared: `current` ends today, and each
 * earlier period covers the same day numbers of its own month, clamped to that month's
 * length (1–30 Mar is compared with 1–28 Feb). Otherwise whole periods are compared, a
 * month's last day matching the earlier month's last day.
 *
 * Returns { mode, label, short, toDate, current: { from, to }, periods: [{ from, to }], note },
 * newest period first, or null for an unknown mode. `note` says it in words:
 * "1–12 Nov vs 1–12 Oct".
 */
function comparisonPeriod(mode, period, today) {
  const comparison = REPORT_COMPARISONS.find(c => c.id === mode);
  if (!comparison || !period) return null;
  const toDate = period.from <= today && today < period.to;
  const current = toDate ? { from: period.from, to: today } : { from: period.from, to: period.to };
  const periods = comparison.back.map(back => ({
    from: monthsEarlier(current.from, back, false),
    to: monthsEarlier(current.to, back, !toDate)
  }));
  const withYear = new Set([current, ...periods].flatMap(p => [p.from.slice(0, 4), p.to.slice(0, 4)])).size > 1;
  const note = `${rangeLabel(current, withYear)} vs ` + (periods.length === 1
    ? rangeLabel(periods[0], withYear)
    : `the average of ${periods.length} months, ${rangeLabel(periods[periods.length - 1], withYear)} to ${rangeLabel(periods[0], withYear)}`);
  return { mode, label: comparison.label, short: comparison.short, toDate, current, periods, note };
}

/** A change as a whole percentage of the earlier amount (rounded half up), or null when there is nothing positive to compare with. */
function changePercent(diff, previous) {
  return previous > 0n ? Number(divideRounded(diff * 100n, previous)) : null;
}

/**
 * The period's figures beside the comparison's.
 *   mode    → an ID from REPORT_COMPARISONS
 *   report  → the reportsView() result for the same period, filters and exclude, when the
 *             caller already has it
 *
 * Every comparison period goes through reportsView() with the same filters and `exclude`,
 * so hidden groups stay hidden on both sides and only reporting-currency values are counted:
 * entries with no reporting value are never converted or added in, only counted in `missing`.
 *
 * Averages are exact integers: the amounts of the 3 or 6 periods are summed in minor units
 * and divided by the number of periods, rounded half up (half away from zero when refunds
 * make the sum negative). A period with no spending counts as zero and still counts in the
 * divisor. Each line is rounded on its own, so averaged lines can differ from the averaged
 * total by a minor unit.
 *
 * The current side is the report as shown. With month to date that is the same thing unless
 * posted entries are dated after today.
 *
 * Returns the comparisonPeriod() fields, plus
 *   total       { minor, previous, diff, percent }
 *   categories  the report's top-level categories in the same order, each with
 *               { previous, diff, percent, isNew } and children carrying the same; categories
 *               found only in the comparison follow with minor 0n, largest earlier amount first.
 *               `isNew` means nothing was recorded for it in any comparison period.
 *   missing     comparison entries left out for want of a reporting value
 */
function compareView(s, { period, filters = {}, exclude = [], today, mode, report = null }) {
  const comparison = comparisonPeriod(mode, period, today);
  if (!comparison) return null;
  const current = report || reportsView(s, { period, filters, exclude, today });
  const count = BigInt(comparison.periods.length);

  const earlier = new Map(); // id → { item, sum }
  const add = (item, minor, parent = null) => {
    const found = earlier.get(item.id) || { item, parent, sum: 0n };
    found.sum += minor;
    earlier.set(item.id, found);
  };
  let sum = 0n, missing = 0;
  for (const range of comparison.periods) {
    const past = reportsView(s, { period: range, filters, exclude, today, monthCount: 1 });
    sum += past.total;
    missing += past.missing;
    for (const top of past.categories) {
      add(top, top.minor);
      // A category with nothing but direct spending has no children listed: it is all "no subcategory".
      if (top.children.length) top.children.forEach(child => add(child, child.minor, top.id));
      else add({ id: top.id + ':direct', name: `${top.name} (no subcategory)`, icon: null, colour: -1, direct: true }, top.minor, top.id);
    }
  }
  const average = minor => (count > 1n ? divideRounded(minor, count) : minor);
  const line = item => {
    const found = earlier.get(item.id);
    const previous = found ? average(found.sum) : 0n;
    const diff = item.minor - previous;
    return { ...item, previous, diff, percent: changePercent(diff, previous), isNew: !found };
  };
  const onlyEarlier = (parent, have) => [...earlier.values()]
    .filter(found => found.parent === parent && !have.has(found.item.id))
    .map(found => line({ ...found.item, minor: 0n, children: parent ? undefined : [] }))
    .sort((a, b) => (a.previous === b.previous ? a.name.localeCompare(b.name) : a.previous > b.previous ? -1 : 1));

  const categories = current.categories.map(top => {
    const children = top.children.length
      ? [...top.children.map(line), ...onlyEarlier(top.id, new Set(top.children.map(child => child.id))).filter(child => child.previous !== 0n)]
      : [];
    return { ...line(top), children };
  });
  categories.push(...onlyEarlier(null, new Set(current.categories.map(top => top.id))));

  const previous = average(sum);
  const diff = current.total - previous;
  return {
    ...comparison, currency: current.currency, precision: current.precision,
    total: { minor: current.total, previous, diff, percent: changePercent(diff, previous) },
    categories, missing
  };
}

/**
 * The comparison as a reference line for the trend: for each of the last `count` months,
 * what was spent in the month(s) it would be compared with (the month before, the average of
 * the 3 or 6 before, or the same month a year earlier), from a longer run of months.
 *   points → [{ month, actual, budget, missing }], oldest first, long enough to look back
 * Whole months throughout. Returns [{ month, minor }]; minor is null where the run does not
 * reach back far enough or the records had not begun, so nothing is drawn there.
 * Averages are rounded as in compareView().
 */
function trendReference(points, mode, count = REPORT_MONTHS) {
  const comparison = REPORT_COMPARISONS.find(c => c.id === mode);
  const first = points.findIndex(point => point.actual !== 0n || point.budget !== 0n || point.missing);
  return points.slice(-count).map((point, offset) => {
    const index = points.length - Math.min(count, points.length) + offset;
    const from = comparison ? comparison.back.map(back => index - back) : [];
    if (!from.length || first < 0 || from.some(i => i < first)) return { month: point.month, minor: null };
    const total = from.reduce((n, i) => n + points[i].actual, 0n);
    return { month: point.month, minor: from.length > 1 ? divideRounded(total, BigInt(from.length)) : total };
  });
}

/**
 * Slices for a donut: positive amounts only, and when two or more are each under
 * `percent` of the total they are gathered into one "Other" slice that keeps its members.
 * Returns { total, slices }.
 */
function groupSmallSlices(items, percent = SMALL_SLICE_PERCENT) {
  const positive = items.filter(item => item.minor > 0n);
  const total = positive.reduce((sum, item) => sum + item.minor, 0n);
  const isSmall = item => item.minor * 100n < total * BigInt(percent);
  const small = positive.filter(isSmall);
  if (small.length < 2) return { total, slices: positive };
  return {
    total,
    slices: [...positive.filter(item => !isSmall(item)), {
      id: 'other', name: 'Other', icon: null, colour: -1, other: true,
      minor: small.reduce((sum, item) => sum + item.minor, 0n), members: small
    }]
  };
}

/** A share of a total as a percentage with one decimal ('12.5'), from exact integers. */
function sharePercent(minor, total) {
  if (total <= 0n || minor <= 0n) return '0';
  const tenths = divideRounded(minor * 1000n, total);
  return tenths % 10n === 0n ? String(tenths / 10n) : `${tenths / 10n}.${tenths % 10n}`;
}

/**
 * Squarified treemap (Bruls, Huizing, van Wijk). `values` are plain numbers; the result has
 * one { x, y, w, h } per value, in the same order, tiling a width × height rectangle with
 * areas in proportion to the values. Values of zero or less get an empty rectangle.
 */
function squarify(values, width, height) {
  const out = values.map(() => ({ x: 0, y: 0, w: 0, h: 0 }));
  const sum = values.reduce((n, value) => n + Math.max(0, value), 0);
  if (!(sum > 0) || !(width > 0) || !(height > 0)) return out;

  const scale = width * height / sum;
  const items = values
    .map((value, index) => ({ index, area: Math.max(0, value) * scale }))
    .filter(item => item.area > 0)
    .sort((a, b) => b.area - a.area);

  let x = 0, y = 0, w = width, h = height;
  let row = [], rowArea = 0;

  /** The worst aspect ratio in a row laid along a side of the given length. */
  const worst = (largest, smallest, area, side) =>
    Math.max(side * side * largest / (area * area), area * area / (side * side * smallest));

  function layRow() {
    const alongHeight = w >= h;
    const thickness = rowArea / (alongHeight ? h : w);
    let offset = 0;
    for (const item of row) {
      const length = item.area / thickness;
      out[item.index] = alongHeight
        ? { x, y: y + offset, w: thickness, h: length }
        : { x: x + offset, y, w: length, h: thickness };
      offset += length;
    }
    if (alongHeight) { x += thickness; w -= thickness; } else { y += thickness; h -= thickness; }
    row = [];
    rowArea = 0;
  }

  for (const item of items) {
    const side = Math.min(w, h);
    if (row.length && worst(row[0].area, item.area, rowArea + item.area, side) > worst(row[0].area, row[row.length - 1].area, rowArea, side)) layRow();
    row.push(item);
    rowArea += item.area;
  }
  if (row.length) layRow();
  return out;
}

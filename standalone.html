    settings.activeCurrencies = moveItem(settings.activeCurrencies, from, to);
  }));

  const rows = active.map((code, index) => {
    if (currencyView.editingCode === code) {
      return el('li', { class: 'ed-item', 'data-drag-item': '' }, currencyForm(state, code, rerender));
    }
    const moveButton = (direction, symbol, word) => el('button', {
      type: 'button', class: 'icon-btn', text: symbol,
      'aria-label': `Move ${code} ${word}`, 'data-focus': `cur-${word}:${code}`,
      disabled: direction < 0 ? index === 0 : index === active.length - 1,
      onclick: () => reorder(index, index + direction)
    });
    const meta = code === reporting ? 'reporting'
      : rates[code] ? `1 ${code} ≈ ${rates[code]} ${reporting}` : '';

    return el('li', { class: 'ed-item', 'data-drag-item': '' },
      el('div', { class: 'ed-row' },
        active.length > 1 && dragHandle({ label: `Drag ${code} to reorder`, onDrop: reorder }),
        el('span', { class: 'ed-name' },
          el('span', { class: 'ed-name-text' }, el('strong', { text: code }), ` ${currencyName(code)}`),
          meta && el('span', { class: 'ed-meta', text: meta })),
        el('div', { class: 'ed-actions' },
          moveButton(-1, '↑', 'up'),
          moveButton(1, '↓', 'down'),
          el('button', {
            type: 'button', class: 'btn-text', text: 'Edit', 'aria-label': `Edit ${code}`, 'data-focus': `cur-edit:${code}`,
            onclick: () => { currencyView.editingCode = code; rerender(); document.getElementById('cur-rate')?.focus(); }
          }))));
  });

  const reportingSelect = el('select', {
    id: 'reporting-currency', 'data-focus': 'reporting-currency',
    onchange: () => quietly(async () => {
      const chosen = reportingSelect.value;
      await saveSettings(settings => {
        // Earlier entries keep their original amounts, as in the previous version.
        settings.reportingDisplay = { mode: 'retain', from: reporting, rate: '', date: todayIso() };
        settings.reportingCurrency = chosen;
        delete settings.defaultRates; // they were quoted in the old reporting currency
      });
      showToast(`Totals are now reported in ${chosen}.` + (hasRates ? ` Default rates were cleared: they were quoted in ${reporting}.` : ''));
    })
  }, active.map(code => el('option', { value: code, text: `${code} ${currencyName(code)}`.trim() })));
  reportingSelect.value = reporting;

  const adder = currencyView.adding
    ? buildCurrencySearch({
        exclude: active,
        onPick: code => quietly(async () => {
          currencyView.adding = false;
          await addActiveCurrency(code);
          showToast(`${code} added.`);
        }),
        onCancel: () => { currencyView.adding = false; rerender(); }
      })
    : el('button', {
        type: 'button', class: 'btn-secondary btn-small', text: 'Add a currency', 'data-focus': 'cur-add',
        onclick: () => { currencyView.adding = true; rerender(); document.querySelector('.cur-search-input')?.focus(); }
      });

  return el('div', { class: 'cur-editor' },
    el('p', { class: 'note', text: 'These are the currencies offered when you add an entry or an account, in this order. Drag the grip, or use the arrows, to reorder.' }),
    el('ul', { class: 'ed-list' }, rows),
    el('div', { class: 'cur-adder' }, adder),
    el('div', { class: 'field' },
      el('label', { for: 'reporting-currency', text: 'Reporting currency' }),
      reportingSelect,
      el('p', {
        class: 'hint',
        text: 'Totals and reports use this currency. To report in another one, add it to the list first.'
          + (hasRates ? ' Changing it clears the default rates, because they are quoted in it.' : '')
      })));
}

/** Inline form for one currency: its rough default rate, and removal. */
function currencyForm(state, code, rerender) {
  const reporting = state.settings.reportingCurrency;
  const isReporting = code === reporting;
  const reason = currencyInUse(state, code);
  const close = () => { currencyView.editingCode = ''; };

  const rate = el('input', {
    id: 'cur-rate', type: 'text', inputMode: 'decimal', autocomplete: 'off',
    value: state.settings.defaultRates?.[code] || '', placeholder: 'No default rate'
  });

  return el('form', {
    class: 'ed-edit',
    onsubmit: event => {
      event.preventDefault();
      quietly(() => {
        const text = rate.value.trim().replace(',', '.');
        if (text) rateParts(text); // a positive decimal, or a readable error
        close();
        if (isReporting || text === (state.settings.defaultRates?.[code] || '')) return rerender();
        return saveSettings(settings => {
          const next = { ...(settings.defaultRates || {}) };
          if (text) next[code] = text; else delete next[code];
          settings.defaultRates = next;
        });
      });
    }
  },
    el('p', { class: 'cur-form-title' }, el('strong', { text: code }), ` ${currencyName(code)}`),
    !isReporting && el('div', { class: 'field' },
      el('label', { for: 'cur-rate', text: `Rough default rate: 1 ${code} = how many ${reporting}?` }),
      rate,
      el('p', { class: 'hint', text: 'Optional. A starting estimate you can correct later; saved amounts are never changed by it.' })),
    el('p', {
      class: 'hint',
      text: reason ? `${code} stays in the list because ${reason}.` : `Removing ${code} only hides it from the lists. You can add it again at any time.`
    }),
    el('div', { class: 'ed-edit-actions' },
      !isReporting && el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Save' }),
      el('button', {
        type: 'button', class: 'btn-secondary btn-small', text: 'Remove', disabled: !!reason,
        onclick: () => quietly(async () => {
          close();
          await saveSettings(settings => {
            settings.activeCurrencies = settings.activeCurrencies.filter(c => c !== code);
            if (settings.defaultRates) delete settings.defaultRates[code];
          });
          showToast(`${code} removed from the list.`);
        })
      }),
      el('button', { type: 'button', class: 'btn-text', text: isReporting ? 'Close' : 'Cancel', onclick: () => { close(); rerender(); } })));
}

/** Run an action and show any problem calmly. */
async function quietly(action) {
  try {
    await action();
  } catch (error) {
    showToast(errorMessage(error));
  }
}

// ---- ui/transfer.js ----
// Move money between two accounts, with an optional fee taken from what arrived
// (an ATM or exchange charge).











const FEE_CATEGORY_KEY = 'expense-book.fee-category';
const FEE_HINT = 'Use this for an ATM or exchange charge that reduced what arrived. What you type in Amount received is what actually arrived.';

// Remembered while the page is open, so repeating a transfer is quick.
const lastUsed = { from: null, to: null };

function rememberedFeeCategory() {
  try { return localStorage.getItem(FEE_CATEGORY_KEY) || ''; } catch { return ''; }
}
function rememberFeeCategory(id) {
  try { localStorage.setItem(FEE_CATEGORY_KEY, id); } catch { /* private window: nothing to remember */ }
}

/** A typed fee as minor units; an empty field or zero means no fee. */
function parseFee(text, currency) {
  const typed = text.trim();
  if (!typed || /^0+(?:[.,]0*)?$/.test(typed)) return 0;
  if (typed.startsWith('-')) throw Error('The fee cannot be negative.');
  return parseAmount(typed, currency);
}

/**
 * The transfer form. `editing` is the transfer being changed, or null for a new one.
 *   onSaved(record)  called after the transfer is saved
 *   onCancel()       called by Cancel while editing
 */
function buildTransferForm(state, today, editing, { onSaved = () => {}, onCancel = () => {} } = {}) {
  const offered = current => current.accounts.filter(a => !a.archived || a.id === editing?.account || a.id === editing?.toAccount);
  const accounts = offered(state);
  const has = id => accounts.some(a => a.id === id);
  const parts = editing ? transferParts(state, editing) : null;

  const startFrom = editing ? editing.account
    : (has(lastUsed.from) && lastUsed.from)
      || (has(state.settings.defaultAccount) && state.settings.defaultAccount)
      || accounts.find(a => a.type === 'current' && a.currency === 'GBP')?.id
      || accounts[0]?.id
      || '';
  const startTo = editing ? editing.toAccount
    : (has(lastUsed.to) && lastUsed.to !== startFrom && lastUsed.to)
      || accounts.find(a => a.id !== startFrom)?.id
      || '';

  const caret = () => el('span', { class: 'caret', 'aria-hidden': 'true', text: '▾' });
  const accountOf = id => ledger.state.accounts.find(a => a.id === id);

  // --- From and To: each a button that opens the account picker.
  function accountField(id, label, value) {
    let popover = null;
    const picker = createAccountPicker({
      getState: () => ledger.state,
      getAccounts: offered,
      value,
      currency: '', // the "All" tab
      today,
      chosenLabel: label,
      onChange: () => { show(); closePopover(); syncFields(); }
    });
    const button = el('button', {
      type: 'button', id, class: 'paid-button',
      'aria-haspopup': 'dialog', 'aria-expanded': 'false',
      onclick: () => {
        if (popover) return closePopover();
        popover = openPopover({
          anchor: button, content: picker.element, label, role: 'dialog', wide: true,
          onClose: () => { popover = null; }
        });
        (picker.element.querySelector('[data-acct][aria-pressed="true"]')
          || picker.element.querySelector('button'))?.focus();
      }
    });
    function show() {
      const account = accountOf(picker.getValue());
      button.replaceChildren(...[
        account && accountIconNode(account),
        el('span', { class: 'paid-name', text: account ? account.name : 'Choose an account' }),
        account && el('span', { class: 'paid-currency', text: account.currency }),
        caret()
      ].filter(Boolean));
    }
    show();
    return {
      account: () => accountOf(picker.getValue()),
      field: el('div', { class: 'field' }, el('label', { for: id, text: label }), button)
    };
  }
  const from = accountField('transfer-from', 'From', startFrom);
  const to = accountField('transfer-to', 'To', startTo);

  // --- Amounts
  const sent = el('input', {
    id: 'transfer-amount', class: 'amount-input', type: 'text', inputMode: 'decimal',
    autocomplete: 'off', placeholder: '0.00',
    value: editing ? plainAmount(editing.minor, editing.precision) : '',
    oninput: () => syncFields()
  });
  const sentLabel = el('label', { for: 'transfer-amount' });
  const dateInput = el('input', { id: 'transfer-date', type: 'date', 'aria-label': 'Date', value: editing?.date || today });

  // Amount received: only shown when the two accounts hold different currencies.
  // 'auto'   a live estimate from the default rates, recalculated as the form changes
  // 'manual' typed by the user, or the amount saved with the transfer being edited
  const editingDestination = editing && state.accounts.find(a => a.id === editing.toAccount);
  let receivedState = editing ? 'manual' : 'auto';
  let receivedFor = null; // the currency the field holds; null until first shown
  const received = el('input', {
    id: 'transfer-received', type: 'text', inputMode: 'decimal', autocomplete: 'off',
    value: parts && editingDestination ? plainAmount(parts.receivedNet, editingDestination.precision) : '',
    oninput: () => { receivedState = 'manual'; estimateTag.hidden = true; }
  });
  const receivedLabelText = el('span');
  const estimateTag = el('span', { class: 'tag-estimate', text: 'estimate', hidden: true });
  const receivedField = el('div', { class: 'field', hidden: true },
    el('label', { for: 'transfer-received' }, receivedLabelText, ' ', estimateTag),
    received);

  // --- Fee taken from the amount received, and the category it is reported under.
  const fee = el('input', {
    id: 'transfer-fee', type: 'text', inputMode: 'decimal', autocomplete: 'off',
    value: parts?.fee && editingDestination ? plainAmount(parts.fee.minor, editingDestination.precision) : '',
    oninput: () => syncFields()
  });
  const feeLabel = el('label', { for: 'transfer-fee' });

  const expenseCategories = state.categories.filter(c => c.kind === 'expense' && (!c.archived || c.id === parts?.fee?.category));
  const categoryLabel = category => {
    const parent = category.parent && state.categories.find(c => c.id === category.parent);
    return parent ? `${parent.name} › ${category.name}` : category.name;
  };
  const isOffered = id => expenseCategories.some(c => c.id === id);
  const remembered = rememberedFeeCategory();
  const startCategory = (parts?.fee && isOffered(parts.fee.category) && parts.fee.category)
    || (isOffered(remembered) && remembered)
    || expenseCategories.find(c => c.name === 'Admin fees')?.id
    || expenseCategories[0]?.id
    || '';
  const feeCategory = el('select', { id: 'transfer-fee-category' },
    expenseCategories.map(c => el('option', { value: c.id, text: categoryLabel(c) })));
  feeCategory.value = startCategory;
  const feeCategoryField = el('div', { class: 'field', hidden: true },
    el('label', { for: 'transfer-fee-category', text: 'Fee category' }), feeCategory);

  const note = el('input', { id: 'transfer-note', type: 'text', maxLength: 500, value: editing?.note || '' });

  /** The estimate of what arrives, as text for the field, or '' without an amount or a rate. */
  function estimateReceived(source, destination) {
    try {
      const { reportingCurrency, defaultRates } = ledger.state.settings;
      const gross = estimateAccountAmount(parseAmount(sent.value, source.currency),
        { currency: source.currency, precision: source.precision }, destination, reportingCurrency, defaultRates);
      if (gross == null) return '';
      let charge = 0;
      try { charge = parseFee(fee.value, destination.currency); } catch { /* a half-typed fee */ }
      const net = gross > charge ? gross - charge : gross;
      return net > 0 ? plainAmount(net, destination.precision) : '';
    } catch {
      return ''; // no amount typed yet
    }
  }

  /** Labels and the received field follow the two chosen accounts. */
  function syncFields() {
    const source = from.account();
    const destination = to.account();
    sentLabel.textContent = source ? `Amount sent (${source.currency})` : 'Amount sent';
    feeLabel.textContent = destination
      ? `Fee taken from the amount received (optional, ${destination.currency})`
      : 'Fee taken from the amount received (optional)';
    feeCategoryField.hidden = !fee.value.trim();

    const needed = !!source && !!destination && source.currency !== destination.currency;
    receivedField.hidden = !needed;
    if (!needed) {
      // Same currency: what is received equals what is sent.
      received.value = '';
      receivedState = 'auto';
      receivedFor = '';
      return;
    }
    receivedLabelText.textContent = `Amount received (${destination.currency})`;
    if (receivedFor !== null && receivedFor !== destination.currency) {
      received.value = ''; // it was an amount in another currency
      receivedState = 'auto';
    }
    receivedFor = destination.currency;
    if (receivedState === 'auto' || !received.value.trim()) {
      received.value = estimateReceived(source, destination);
      receivedState = received.value ? 'auto' : 'manual';
    }
    estimateTag.hidden = receivedState === 'manual';
  }
  syncFields();

  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });
  const enough = accounts.length >= 2;
  const saveButton = el('button', {
    type: 'submit', class: 'btn-primary', text: editing ? 'Save changes' : 'Save transfer'
  });
  if (!enough) saveButton.disabled = true;

  /** Read the form. Throws a readable error if something is missing. */
  function readForm() {
    const source = from.account();
    const destination = to.account();
    if (!source || !destination) throw Error('Choose the account the money leaves and the account it arrives in.');
    if (source.id === destination.id) throw Error('Choose two different accounts.');
    if (!sent.value.trim()) throw Error('Enter the amount sent.');
    const minor = parseAmount(sent.value, source.currency);
    if (!dateInput.value) throw Error('Choose a date.');
    const charge = parseFee(fee.value, destination.currency);

    let receivedNet;
    if (source.currency === destination.currency) {
      if (charge >= minor) throw Error('The fee must be smaller than the amount sent.');
      receivedNet = minor - charge; // the fee reduced what arrived
    } else {
      if (!received.value.trim()) throw Error(`Enter what ${destination.name} received in ${destination.currency} (an estimate is fine).`);
      receivedNet = parseAmount(received.value, destination.currency);
    }

    const transfer = {
      tags: '', trip: '',
      ...(editing || {}),
      id: editing?.id || uid(),
      kind: 'transfer',
      ledger: 'active',
      status: dateInput.value > today ? 'planned' : editing?.status || 'posted',
      date: dateInput.value,
      minor,
      currency: source.currency,
      precision: source.precision,
      account: source.id,
      toAccount: destination.id,
      category: '',
      pot: '',
      note: note.value.trim()
    };
    return { transfer, receivedNet, fee: charge, feeCategory: charge ? feeCategory.value : '' };
  }

  let saving = false;
  async function submit(event) {
    event.preventDefault();
    if (saving || !enough) return;
    try {
      const input = readForm();
      const next = saveTransfer(ledger.state, input);
      saving = true;
      saveButton.disabled = true;
      lastUsed.from = input.transfer.account;
      lastUsed.to = input.transfer.toAccount;
      if (input.fee) rememberFeeCategory(input.feeCategory);
      await saveLedger(next);
      onSaved(input.transfer);
      showToast(input.transfer.status === 'planned'
        ? `Saved as planned for ${formatDay(input.transfer.date)}.`
        : 'Saved on this device.');
    } catch (error) {
      // Keep everything the user typed.
      saving = false;
      saveButton.disabled = false;
      errorBox.textContent = errorMessage(error);
      errorBox.hidden = false;
    }
  }

  return el('form', { class: 'entry-form transfer-form', onsubmit: submit, novalidate: true },
    sectionTitle(editing ? 'Edit transfer' : 'Move money'),
    !enough && el('p', { class: 'hint', text: 'Add two accounts in Settings to move money between them.' }),
    from.field,
    to.field,
    el('div', { class: 'field' }, sentLabel, el('div', { class: 'amount-row' }, sent)),
    el('div', { class: 'entry-meta-row' }, dateInput),
    receivedField,
    el('div', { class: 'field' }, feeLabel, fee, el('p', { class: 'hint', text: FEE_HINT })),
    feeCategoryField,
    el('div', { class: 'field' }, el('label', { for: 'transfer-note', text: 'Note (optional)' }), note),
    errorBox,
    el('div', { class: 'form-actions' },
      saveButton,
      editing && el('button', { type: 'button', class: 'btn-secondary', text: 'Cancel', onclick: () => onCancel() })));
}

// ---- ui/today.js ----
// Today: quick add for an expense, an income or a transfer, and the recent entries with net amounts.


















const RECENT_LIMIT = 40;
const MORE_CURRENCIES = '__more';

// Remembered while the page is open, so adding several entries is quick.
// `kept` holds a half-filled form across the redraw that follows adding a currency.
// `kind` is what the add form records: 'expense', 'income' or 'transfer'.
const todayDraft = { currency: '', account: null, editingId: '', kept: null, kind: 'expense' };

function renderToday(root) {
  const state = ledger.state;
  const today = todayIso();
  const editing = state.entries.find(e => e.id === todayDraft.editingId) || null;
  if (!editing) todayDraft.editingId = '';

  root.append(slip({ label: 'Today', kind: formatDay(today), wide: true },
    el('div', { class: 'today-layout' },
      editing?.kind === 'transfer' || (!editing && todayDraft.kind === 'transfer')
        ? buildTransferPanel(state, today, editing)
        : buildEntryForm(state, today, editing),
      buildRecentList(state, today))));
}

// ---------------------------------------------------------------------------
// Quick add
// ---------------------------------------------------------------------------

const KINDS = [['expense', 'Expense'], ['income', 'Income'], ['transfer', 'Transfer']];

/** Expense | Income | Transfer. Switching redraws the form for the other kind. */
function buildKindSwitch(kind, beforeSwitch = () => {}) {
  return el('div', { class: 'segmented entry-kind', role: 'group', 'aria-label': 'Kind of entry' },
    KINDS.map(([value, label]) => el('button', {
      type: 'button', id: `entry-kind-${value}`,
      class: value === kind ? 'is-selected' : '',
      'aria-pressed': String(value === kind),
      text: label,
      onclick: () => {
        if (value === kind) return;
        beforeSwitch(value);
        todayDraft.kind = value;
        closePopover({ restoreFocus: false });
        rerenderToday();
        document.getElementById(`entry-kind-${value}`)?.focus();
      }
    })));
}

/** The transfer form, with the kind switch above it for a new transfer. */
function buildTransferPanel(state, today, editing) {
  const form = buildTransferForm(state, today, editing, {
    onSaved: () => {
      todayDraft.editingId = '';
      todayDraft.kind = 'expense'; // the form goes back to the common case
      todayDraft.kept = null;
      rerenderToday();
    },
    onCancel: () => { todayDraft.editingId = ''; rerenderToday(); }
  });
  if (!editing) form.prepend(buildKindSwitch('transfer'));
  return form;
}

function buildEntryForm(state, today, editing) {
  const currencies = [...new Set([...state.settings.activeCurrencies, editing?.currency].filter(Boolean))];
  const accounts = state.accounts.filter(a => !a.archived || a.id === editing?.account);

  const kept = todayDraft.kept;
  todayDraft.kept = null;

  // Plain expenses and incomes are edited here; the switch is for new entries.
  const kind = (editing ? editing.kind : todayDraft.kind) === 'income' ? 'income' : 'expense';
  const isIncome = kind === 'income';
  const paidLabel = isIncome ? 'Paid into' : 'Paid from';

  // A currency just added through "More currencies…" comes first, even while editing.
  const startCurrency = (kept && currencies.includes(todayDraft.currency) && todayDraft.currency)
    || editing?.currency
    || (currencies.includes(todayDraft.currency) && todayDraft.currency)
    || state.settings.reportingCurrency;
  const rememberedAccount = accounts.some(a => a.id === todayDraft.account) || todayDraft.account === ''
    ? todayDraft.account : null;
  const startAccount = kept ? kept.account
    : editing ? editing.account
    : rememberedAccount
      ?? (accounts.some(a => a.id === state.settings.defaultAccount) ? state.settings.defaultAccount : null)
      ?? accounts.find(a => a.type === 'current' && a.currency === 'GBP')?.id
      ?? '';

  // Fields
  const amount = el('input', {
    id: 'entry-amount', class: 'amount-input', type: 'text', inputMode: 'decimal',
    autocomplete: 'off', placeholder: '0.00',
    value: kept ? kept.amount : editing ? plainAmount(editing.minor, editing.precision) : '',
    oninput: () => syncSettledField()
  });
  const dateInput = el('input', {
    id: 'entry-date', type: 'date', 'aria-label': 'Date', value: kept?.date || editing?.date || today
  });
  const note = el('input', { id: 'entry-note', type: 'text', maxLength: 500, value: kept ? kept.note : editing?.note || '' });
  const caret = () => el('span', { class: 'caret', 'aria-hidden': 'true', text: '▾' });

  // --- Currency: a compact button that opens the list of active currencies.
  let currentCurrency = startCurrency;
  let currencyPopover = null;
  const currencyButton = el('button', {
    type: 'button', id: 'entry-currency', class: 'cur-button',
    'aria-haspopup': 'listbox', 'aria-expanded': 'false',
    onclick: () => (currencyPopover ? closePopover() : openCurrencyList()),
    onkeydown: event => {
      if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
      event.preventDefault();
      if (!currencyPopover) openCurrencyList();
    }
  });
  function showCurrency() {
    currencyButton.replaceChildren(el('span', { text: currentCurrency }), caret());
    currencyButton.setAttribute('aria-label', `Currency: ${currentCurrency}`);
  }
  showCurrency();

  /** The active currencies in the user's order, then the way to switch on another. */
  function openCurrencyList() {
    const choose = code => {
      if (code === MORE_CURRENCIES) return openCurrencySearch();
      currentCurrency = code;
      showCurrency();
      closePopover();
      syncSettledField();
    };
    const option = (code, main, detail) => el('li', {
      role: 'option', tabIndex: -1, class: 'pop-option',
      'aria-selected': String(code === currentCurrency), 'data-value': code,
      onclick: () => choose(code)
    }, el('strong', { text: main }), detail && el('span', { class: 'pop-option-detail', text: detail }));

    const list = el('ul', { class: 'pop-list', role: 'listbox', 'aria-label': 'Currency' },
      currencies.map(code => option(code, code, currencyName(code))),
      option(MORE_CURRENCIES, 'More currencies…'));
    const items = [...list.children];

    list.addEventListener('keydown', event => {
      const at = items.indexOf(document.activeElement);
      let to = -1;
      if (event.key === 'ArrowDown') to = (at + 1) % items.length;
      else if (event.key === 'ArrowUp') to = (at - 1 + items.length) % items.length;
      else if (event.key === 'Home') to = 0;
      else if (event.key === 'End') to = items.length - 1;
      else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (at >= 0) choose(items[at].dataset.value);
        return;
      } else if (/^[a-z]$/i.test(event.key)) {
        // Typing a letter jumps to the next code that starts with it.
        const letter = event.key.toUpperCase();
        const order = [...items.slice(at + 1), ...items.slice(0, at + 1)];
        to = items.indexOf(order.find(item => item.dataset.value.startsWith(letter)));
      }
      if (to < 0) return;
      event.preventDefault();
      items[to].focus();
    });

    currencyPopover = openPopover({
      anchor: currencyButton, content: list, label: 'Currency',
      onClose: () => { currencyPopover = null; }
    });
    (items.find(item => item.dataset.value === currentCurrency) || items[0]).focus();
  }

  /** "More currencies…": search the full list and switch the chosen one on. */
  function openCurrencySearch() {
    const search = buildCurrencySearch({
      exclude: ledger.state.settings.activeCurrencies,
      onCancel: () => closePopover(),
      onPick: async code => {
        // Saving redraws the screen, so carry what was typed across it.
        const previousCurrency = todayDraft.currency;
        todayDraft.kept = keepForm();
        todayDraft.currency = code;
        closePopover({ restoreFocus: false });
        try {
          await addActiveCurrency(code);
          showToast(`${code} added to your currencies.`);
          document.getElementById('entry-amount')?.focus();
        } catch (error) {
          todayDraft.kept = null;
          todayDraft.currency = previousCurrency;
          showToast(errorMessage(error));
        }
      }
    });
    currencyPopover = openPopover({
      anchor: currencyButton, content: search, label: 'More currencies', role: 'dialog',
      onClose: () => { currencyPopover = null; }
    });
    search.querySelector('input')?.focus();
  }

  // --- Paid from (or Paid into, for income): one button that opens the account picker.
  // The account and the entry currency are independent: choosing one never changes the other.
  let accountPopover = null;
  const accountPicker = createAccountPicker({
    getState: () => ledger.state,
    getAccounts: current => current.accounts.filter(a => !a.archived || a.id === editing?.account),
    value: startAccount,
    currency: '', // the "All" tab
    today,
    onChange: () => { showAccount(); closePopover(); syncSettledField(); }
  });
  const selectedAccount = () => state.accounts.find(a => a.id === accountPicker.getValue());
  const accountButton = el('button', {
    type: 'button', id: 'entry-account', class: 'paid-button',
    'aria-haspopup': 'dialog', 'aria-expanded': 'false',
    onclick: () => {
      if (accountPopover) return closePopover();
      accountPopover = openPopover({
        anchor: accountButton, content: accountPicker.element, label: paidLabel, role: 'dialog', wide: true,
        onClose: () => { accountPopover = null; }
      });
      (accountPicker.element.querySelector('[data-acct][aria-pressed="true"]')
        || accountPicker.element.querySelector('button'))?.focus();
    }
  });
  function showAccount() {
    const account = selectedAccount();
    accountButton.replaceChildren(...[
      account && accountIconNode(account),
      el('span', { class: 'paid-name', text: account ? account.name : 'No account' }),
      account && el('span', { class: 'paid-currency', text: account.currency }),
      caret()
    ].filter(Boolean));
  }
  showAccount();

  // --- Charged to account: only shown when the account's currency differs from the entry's.
  // 'auto'   a live estimate from the default rates, recalculated as the form changes
  // 'saved'  an estimate stored with the entry being edited; left alone until changed
  // 'manual' typed by the user
  let settledState = kept ? kept.settledState
    : editing?.settledMinor != null && editing.settledEstimate ? 'saved' : 'manual';
  let settledFor = null; // account currency the field holds; null until first shown
  const settled = el('input', {
    id: 'entry-settled', type: 'text', inputMode: 'decimal', autocomplete: 'off',
    value: kept ? kept.settled : editing?.settledMinor != null ? plainAmount(editing.settledMinor, editing.settledPrecision) : '',
    oninput: () => { settledState = 'manual'; estimateTag.hidden = true; }
  });
  const settledLabelText = el('span');
  const estimateTag = el('span', { class: 'tag-estimate', text: 'estimate', hidden: true });
  const settledField = el('div', { class: 'field', hidden: true },
    el('label', { for: 'entry-settled' }, settledLabelText, ' ', estimateTag),
    settled,
    el('p', { class: 'hint', text: isIncome
      ? 'What the account received in its own currency. An estimate is fine; you can correct it later.'
      : 'What the account was charged in its own currency. An estimate is fine; you can correct it later.' }));

  /** The estimate as text for the field, or '' without an amount or a rate. */
  function estimateSettled(account) {
    try {
      const { reportingCurrency, defaultRates } = ledger.state.settings;
      const minor = parseAmount(amount.value, currentCurrency);
      const estimate = estimateAccountAmount(minor,
        { currency: currentCurrency, precision: digits(currentCurrency) }, account, reportingCurrency, defaultRates);
      return estimate == null ? '' : plainAmount(estimate, account.precision);
    } catch {
      return ''; // no amount typed yet
    }
  }

  function syncSettledField() {
    const account = selectedAccount();
    const needed = !!account && account.currency !== currentCurrency;
    settledField.hidden = !needed;
    if (!needed) {
      settled.value = '';
      settledState = 'manual';
      settledFor = '';
      return;
    }
    settledLabelText.textContent = `${isIncome ? 'Received in account' : 'Charged to account'} (${account.currency})`;
    if (settledFor !== null && settledFor !== account.currency) {
      settled.value = ''; // it was an amount in another currency
      settledState = 'manual';
    }
    settledFor = account.currency;
    if (settledState === 'auto' || !settled.value.trim()) {
      settled.value = estimateSettled(account);
      settledState = settled.value ? 'auto' : 'manual';
    }
    estimateTag.hidden = settledState === 'manual';
  }
  syncSettledField();

  const picker = createCategoryPicker({
    getState: () => ledger.state,
    kind,
    value: kept?.category || editing?.category || (isIncome ? '' : state.settings.defaultCategory || '')
  });

  /** What is typed so far, to carry across a redraw of the form. */
  function keepForm() {
    return {
      amount: amount.value, note: note.value, date: dateInput.value,
      settled: settled.value, settledState,
      category: picker.getValue(), account: accountPicker.getValue()
    };
  }

  // --- Expense | Income | Transfer. What is typed is carried across the redraw.
  const kindSwitch = !editing && buildKindSwitch(kind, () => {
    todayDraft.kept = { ...keepForm(), category: '' }; // a category belongs to one kind
    todayDraft.currency = currentCurrency;
  });

  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });
  const saveButton = el('button', { type: 'submit', class: 'btn-primary', text: editing ? 'Save changes' : isIncome ? 'Save income' : 'Save expense' });

  /** Read the form into an entry record. Throws a readable error if something is missing. */
  function readForm() {
    const currencyCode = currentCurrency;
    if (!amount.value.trim()) throw Error('Enter an amount.');
    const minor = parseAmount(amount.value, currencyCode);
    if (!dateInput.value) throw Error('Choose a date.');
    const category = ledger.state.categories.find(c => c.id === picker.getValue());
    if (!category) throw Error('Choose a category.');

    const record = {
      tags: '', trip: '',
      ...(editing || {}),
      id: editing?.id || uid(),
      kind,
      ledger: 'active',
      status: dateInput.value > today ? 'planned' : editing?.status || 'posted',
      date: dateInput.value,
      minor,
      currency: currencyCode,
      precision: digits(currencyCode),
      category: category.id,
      pot: isIncome ? '' : category.pot || '', // income is shared out between pots by the payday flow
      account: accountPicker.getValue(),
      note: note.value.trim()
    };

    // The amount in the account's own currency, when it differs. The ledger
    // needs it to keep that account's balance, so an estimate is asked for.
    const account = selectedAccount();
    delete record.settledMinor; delete record.settledCurrency; delete record.settledPrecision;
    delete record.settledEstimate;
    if (account && account.currency !== currencyCode) {
      if (!settled.value.trim()) {
        throw Error(`Enter what ${account.name} ${isIncome ? 'received' : 'was charged'} in ${account.currency} (an estimate is fine), or choose "No account".`);
      }
      record.settledMinor = parseAmount(settled.value, account.currency);
      record.settledCurrency = account.currency;
      record.settledPrecision = account.precision;
      if (settledState !== 'manual') record.settledEstimate = true; // to be confirmed later
    }

    // A changed amount makes an older reporting-currency value stale.
    if (editing && (editing.minor !== minor || editing.currency !== currencyCode)) {
      delete record.reportingMinor; delete record.reportingCurrency; delete record.reportingPrecision;
    }
    return record;
  }

  let saving = false;
  async function submit(event) {
    event.preventDefault();
    if (saving) return;
    const previousEditing = todayDraft.editingId;
    try {
      const record = readForm();
      let next = commit(ledger.state, 'entries', record);

      // Would this expense take its pot below zero? Ask first; nothing moves unless the user chooses it.
      // Income never takes a pot down, so it is not checked.
      let moved = null;
      const warning = record.kind === 'expense' && record.status === 'posted'
        ? negativePotCheck(ledger.state, next, record.pot, today) : null;
      if (warning) {
        const answer = await askNegativePot(saveButton, warning, next, record.date);
        if (!answer) return; // closed without choosing: nothing saved, the form is kept
        next = answer.state;
        moved = answer.moved;
      }
      saving = true;
      saveButton.disabled = true;
      todayDraft.currency = record.currency;
      todayDraft.account = record.account;
      todayDraft.editingId = '';
      todayDraft.kind = 'expense'; // the form goes back to the common case
      const sharesOut = opensPaydayFlow(next, record);
      await saveLedger(next); // re-renders the screen with an empty form
      if (sharesOut) {
        // A salary: open the payday preview for it straight away. Closing it changes nothing;
        // the salary stays listed under Pots → Distribute salary.
        showToast('Salary saved. Share it out now, or later from Pots.');
        const anchor = document.querySelector('.entry-form button[type="submit"]');
        if (anchor) openPaydayPreview(anchor, record);
        return;
      }
      showToast(record.status === 'planned'
        ? `Saved as planned for ${formatDay(record.date)}.`
        : moved ? `Saved. Moved ${formatMoney(moved.minor, moved.pot.currency, moved.pot.precision)} from ${moved.from} to ${moved.pot.name}.`
        : warning ? `Saved. ${warning.pot.name} is below zero until you cover it.`
        : 'Saved on this device.');
    } catch (error) {
      // Keep everything the user typed.
      todayDraft.editingId = previousEditing;
      todayDraft.kind = kind;
      saving = false;
      saveButton.disabled = false;
      errorBox.textContent = errorMessage(error);
      errorBox.hidden = false;
    }
  }

  return el('form', { class: 'entry-form', onsubmit: submit, novalidate: true },
    kindSwitch,
    sectionTitle(editing ? (isIncome ? 'Edit income' : 'Edit expense') : isIncome ? 'Add income' : 'Add an expense'),
    el('div', { class: 'field' },
      el('label', { for: 'entry-amount', text: 'Amount' }),
      el('div', { class: 'amount-row' }, amount)),
    el('div', { class: 'entry-meta-row' }, currencyButton, dateInput),
    el('div', { class: 'field' }, el('span', { class: 'field-label', text: 'Category' }), picker.element),
    el('div', { class: 'field' }, el('label', { for: 'entry-account', text: paidLabel }), accountButton),
    !accounts.length && el('p', { class: 'hint', text: 'No accounts yet. You can add one in Settings, or save without one.' }),
    settledField,
    el('div', { class: 'field' }, el('label', { for: 'entry-note', text: 'Note (optional)' }), note),
    errorBox,
    el('div', { class: 'form-actions' },
      saveButton,
      editing && el('button', {
        type: 'button', class: 'btn-secondary', text: 'Cancel',
        onclick: () => { todayDraft.editingId = ''; rerenderToday(); }
      })));
}

/** Redraw this screen without saving anything. */
function rerenderToday() {
  const root = document.getElementById('screen');
  root.replaceChildren();
  renderToday(root);
}

// ---------------------------------------------------------------------------
// Recent entries
// ---------------------------------------------------------------------------

/** Refunds recorded against a purchase, oldest first. */
function refundsOf(state, entry) {
  return state.entries
    .filter(r => r.kind === 'refund' && r.original === entry.id && r.status !== 'cancelled')
    .sort((a, b) => a.date.localeCompare(b.date));
}

/**
 * The signed amount an entry contributes to "what I spent", in its own
 * currency. Expenses are your share minus refunds; transfers are neutral.
 */
function netAmount(state, entry) {
  if (entry.kind === 'expense') {
    const refunded = refundsOf(state, entry).reduce((sum, r) => sum + BigInt(r.personalMinor ?? r.minor), 0n);
    return -(personalAmount(entry) - refunded);
  }
  if (entry.kind === 'income') return BigInt(entry.minor);
  if (entry.kind === 'transfer') return 0n;
  return entry.direction === 'increase' ? BigInt(entry.minor) : -BigInt(entry.minor);
}

function buildRecentList(state, today) {
  const wrap = el('div', { class: 'recent' }, sectionTitle('Today and recent'));

  // Newest first. Refunds are folded into their purchase, not listed alone.
  const rows = state.entries
    .map((entry, index) => ({ entry, index }))
    .filter(({ entry }) => entry.ledger === 'active' && entry.status !== 'cancelled'
      && entry.kind !== 'refund' && !entry.feeOnReceived && entry.date <= today)
    .sort((a, b) => b.entry.date.localeCompare(a.entry.date) || b.index - a.index)
    .slice(0, RECENT_LIMIT)
    .map(row => row.entry);

  if (!rows.some(entry => entry.date === today)) {
    wrap.append(el('p', { class: 'empty', text: 'Nothing recorded today yet. Entries you save will appear here.' }));
  }

  const dates = [...new Set(rows.map(entry => entry.date))];
  for (const date of dates) {
    const dayRows = rows.filter(entry => entry.date === date);

    // Net spending per currency for the day. Currencies are never added together.
    const totals = new Map();
    // A fee taken from a transfer is spending too, though it is listed inside its transfer.
    const spending = dayRows.flatMap(e => e.kind === 'transfer' ? [transferParts(state, e).fee].filter(Boolean) : [e]);
    for (const entry of spending.filter(e => e.kind === 'expense')) {
      const key = `${entry.currency}:${entry.precision}`;
      totals.set(key, (totals.get(key) || 0n) + netAmount(state, entry));
    }
    const totalText = [...totals].map(([key, sum]) => {
      const [code, precision] = key.split(':');
      return formatMoney(sum, code, Number(precision));
    }).join(' · ');

    wrap.append(el('div', { class: 'day-group' },
      el('div', { class: 'day-head' },
        el('span', { text: date === today ? `Today · ${formatDay(date)}` : formatDay(date) }),
        el('span', { class: 'day-total', text: totalText })),
      dayRows.map(entry => entryRow(state, entry))));
  }

  if (rows.length === RECENT_LIMIT) {
    wrap.append(el('p', { class: 'hint' }, 'Showing the latest 40. Older entries are in the ',
      el('a', { href: LEGACY_URL, text: 'previous version' }), '.'));
  }
  return wrap;
}

function entryRow(state, entry) {
  const nameOf = (table, id) => state[table].find(r => r.id === id)?.name || '';
  const category = state.categories.find(c => c.id === entry.category);
  const parent = category && state.categories.find(c => c.id === category.parent);

  const title = entry.kind === 'transfer'
    ? `${nameOf('accounts', entry.account)} → ${nameOf('accounts', entry.toAccount)}`
    : category?.name || entry.kind;
  const receivedFee = entry.kind === 'transfer' ? transferParts(state, entry).fee : null;
  const meta = [
    parent?.name,
    entry.kind === 'transfer' ? 'Transfer' : nameOf('accounts', entry.account),
    receivedFee && `fee ${formatMoney(receivedFee.minor, receivedFee.currency, receivedFee.precision)}`,
    entry.status === 'planned' && 'Planned',
    entry.note
  ].filter(Boolean).join(' · ');

  const net = netAmount(state, entry);
  const shown = entry.kind === 'transfer' ? BigInt(entry.minor) : net;
  const amountClass = 'entry-amount' + (net > 0n ? ' is-income' : '');

  return el('details', { class: 'entry' },
    el('summary', { class: 'entry-summary' },
      el('span', { class: 'entry-text' },
        el('span', { class: 'entry-title', text: title }),
        meta && el('span', { class: 'entry-meta', text: meta })),
      el('span', { class: amountClass, text: formatMoney(shown, entry.currency, entry.precision, { signed: entry.kind !== 'transfer' }) })),
    entryDetail(state, entry, net));
}

/** The unfolded part: dated components, where it went, and actions. */
function entryDetail(state, entry, net) {
  const line = (label, value) => el('div', { class: 'detail-line' },
    el('span', { text: label }), el('span', { class: 'detail-value', text: value }));
  const money = (minor, signed = true) => formatMoney(minor, entry.currency, entry.precision, { signed });
  const lines = [];

  if (entry.kind === 'expense') {
    const refunds = refundsOf(state, entry);
    lines.push(line(`${formatDay(entry.date)} · Paid`, money(-BigInt(entry.minor))));
    if (entry.friend) {
      const friend = state.friends.find(f => f.id === entry.friend)?.name || 'Friend';
      lines.push(line(`Your share (${friend} covers the rest)`, money(-personalAmount(entry))));
    }
    const refundable = canRefundHere(state, entry);
    for (const refund of refunds) {
      const label = `${formatDay(refund.date)} · Refund`;
      const value = money(BigInt(refund.personalMinor ?? refund.minor));
      // Refunds recorded here can be changed here: the label carries an Edit button.
      lines.push(refundable
        ? el('div', { class: 'detail-line' },
            el('span', {}, label + ' ', el('button', {
              type: 'button', class: 'btn-text', text: 'Edit', 'aria-label': `Edit refund of ${value}`,
              onclick: event => openRefundSheet(event.currentTarget, entry, refund)
            })),
            el('span', { class: 'detail-value', text: value }))
        : line(label, value));
    }
    if (refunds.length || entry.friend) lines.push(line('Net', money(net)));
    if (entry.splits) lines.push(line('Split', `${entry.splits.length} parts`));
  } else if (entry.kind === 'transfer') {
    // Sent in the from-account's currency; received, fee and arrived in the to-account's.
    const destination = state.accounts.find(a => a.id === entry.toAccount);
    const arrived = minor => formatMoney(minor, destination?.currency || entry.currency, destination?.precision ?? entry.precision);
    const { fee, receivedNet } = transferParts(state, entry);
    lines.push(line(`${formatDay(entry.date)} · Sent`, money(BigInt(entry.minor), false)));
    lines.push(line('Received', arrived(BigInt(entry.receivedMinor))));
    if (fee) {
      lines.push(line('Fee', arrived(BigInt(fee.minor))));
      lines.push(line('Arrived', arrived(receivedNet)));
    }
  } else {
    lines.push(line(formatDay(entry.date), money(net)));
  }

  if (entry.settledMinor != null && entry.settledCurrency !== entry.currency) {
    lines.push(line(entry.settledEstimate ? 'Charged to account (estimate)' : 'Charged to account', formatMoney(entry.settledMinor, entry.settledCurrency, entry.settledPrecision)));
  }
  const pot = state.pots.find(p => p.id === entry.pot);
  if (pot) lines.push(line('Pot', pot.name));

  // Plain expenses, incomes not yet shared out between pots, and transfers can be edited here.
  // Other kinds keep their own forms in the previous version.
  const simple = (entry.kind === 'expense' && !entry.splits && !entry.friend)
    || (entry.kind === 'income' && !entry.friend && !state.allocations.some(a => a.salary === entry.id))
    || (entry.kind === 'transfer' && !hasSourceFee(state, entry));
  const firstField = entry.kind === 'transfer' ? 'transfer-amount' : 'entry-amount';
  const actions = el('div', { class: 'entry-actions' },
    simple
      ? el('button', {
          type: 'button', class: 'btn-text', text: 'Edit',
          onclick: () => { todayDraft.editingId = entry.id; rerenderToday(); document.getElementById(firstField)?.focus(); }
        })
      : el('a', { class: 'btn-text', href: LEGACY_URL, text: 'Edit in previous version' }),
    entry.kind === 'expense' && canRefundHere(state, entry) && refundedSoFar(state, entry) < BigInt(entry.minor)
      && el('button', { type: 'button', class: 'btn-text', text: 'Add refund', onclick: event => openRefundSheet(event.currentTarget, entry) }),
    deleteButton(entry));

  return el('div', { class: 'entry-detail' }, lines, actions);
}

/**
 * The refund sheet for a purchase: a new refund, or `refund` to change or delete.
 * The rules (how much is left, which dates are allowed) live in refund-logic.js.
 */
function openRefundSheet(anchor, purchase, refund = null) {
  const state = ledger.state;
  const today = todayIso();
  const left = BigInt(purchase.minor) - refundedSoFar(state, purchase, refund?.id || '');
  const account = state.accounts.find(a => a.id === purchase.account);
  const foreign = purchase.settledMinor != null && Boolean(purchase.settledCurrency);
  const field = (id, label, control, hint) => el('div', { class: 'field' },
    el('label', { for: id, text: label }), control, hint && el('p', { class: 'hint', text: hint }));
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });
  const showError = error => {
    errorBox.textContent = errorMessage(error);
    errorBox.hidden = false;
    if (!form.isConnected) showToast(errorMessage(error));
  };

  const amount = el('input', {
    id: 'refund-amount', type: 'text', inputMode: 'decimal', autocomplete: 'off',
    placeholder: `Up to ${formatMoney(left, purchase.currency, purchase.precision)}`,
    value: refund ? plainAmount(refund.minor, purchase.precision) : ''
  });
  const date = el('input', {
    id: 'refund-date', type: 'date', min: purchase.date, max: today, value: refund ? refund.date : today
  });
  const note = el('input', { id: 'refund-note', type: 'text', maxLength: 500, autocomplete: 'off', value: refund?.note || '' });

  // Paid in another currency: what the account got back. It follows the refund amount
  // as an estimate until the user types their own figure.
  let creditIsEstimate = !refund || refund.settledEstimate === true;
  const credited = foreign && el('input', {
    id: 'refund-credited', type: 'text', inputMode: 'decimal', autocomplete: 'off',
    value: refund?.settledMinor != null ? plainAmount(refund.settledMinor, purchase.settledPrecision) : '',
    oninput: () => { creditIsEstimate = false; }
  });
  const readAmount = () => parseAmount(amount.value, purchase.currency);
  if (foreign) {
    amount.addEventListener('input', () => {
      if (!creditIsEstimate) return;
      let suggestion = null;
      try { suggestion = suggestedSettled(purchase, readAmount()); } catch { /* amount not complete yet */ }
      credited.value = suggestion == null ? '' : plainAmount(suggestion, purchase.settledPrecision);
    });
  }

  let armed = false;
  const remove = refund && el('button', { type: 'button', class: 'btn-text', text: 'Delete refund' });
  if (remove) {
    remove.addEventListener('blur', () => { armed = false; remove.textContent = 'Delete refund'; remove.classList.remove('is-armed'); });
    remove.addEventListener('click', async () => {
      if (!armed) {
        armed = true;
        remove.textContent = 'Press again to delete';
        remove.classList.add('is-armed');
        return;
      }
      try {
        const next = deleteRefund(ledger.state, refund.id);
        closePopover({ restoreFocus: false });
        await saveLedger(next);
        showToast('Refund deleted.');
      } catch (error) {
        showError(error);
      }
    });
  }

  const form = el('form', {
    class: 'pot-sheet', novalidate: true,
    onsubmit: async event => {
      event.preventDefault();
      try {
        if (!amount.value.trim()) throw Error('Enter the refund amount.');
        const fields = { purchaseId: purchase.id, id: refund?.id || '', minor: readAmount(), date: date.value, note: note.value, today };
        if (foreign && credited.value.trim()) {
          fields.settledMinor = parseAmount(credited.value, purchase.settledCurrency);
          fields.settledEstimate = creditIsEstimate;
        }
        const next = saveRefund(ledger.state, fields);
        closePopover({ restoreFocus: false });
        await saveLedger(next);
        showToast('Refund saved.');
      } catch (error) {
        showError(error);
      }
    }
  },
    field('refund-amount', `Amount (${purchase.currency})`, amount),
    field('refund-date', 'Date', date),
    foreign && field('refund-credited', `Credited to ${account?.name || 'account'} (${purchase.settledCurrency})`, credited, 'Estimate from the original charge'),
    field('refund-note', 'Note (optional)', note),
    errorBox,
    el('div', { class: 'entry-actions' },
      el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Save refund' }),
      remove));

  openPopover({ anchor, label: refund ? 'Edit refund' : 'Refund', role: 'dialog', content: form });
}

/** Two presses: the first asks, the second deletes. Deleted records can be restored. */
function deleteButton(entry) {
  let armed = false;
  const button = el('button', { type: 'button', class: 'btn-text', text: 'Delete' });
  button.addEventListener('blur', () => { armed = false; button.textContent = 'Delete'; button.classList.remove('is-armed'); });
  button.addEventListener('click', async () => {
    if (!armed) {
      armed = true;
      button.textContent = 'Press again to delete';
      button.classList.add('is-armed');
      return;
    }
    try {
      const state = ledger.state;
      if (entry.kind === 'settlement') throw Error('This payment is linked to a shared debt. Record a correcting settlement in the previous version instead.');
      if (state.allocations.some(a => a.salary === entry.id)) throw Error('This income has pot allocations. Reverse them in the previous version first.');
      // Linked records go together: a transfer with its fee, a purchase with its refunds.
      const linked = state.entries.filter(r => r.id === entry.id
        || (entry.group && r.group === entry.group)
        || (r.kind === 'refund' && r.original === entry.id));
      const ordered = [...linked.filter(r => r.kind === 'refund' || r.feeFor), ...linked.filter(r => r.kind !== 'refund' && !r.feeFor)];
      await saveLedger(commitBatch(state, ordered.map(record => ({ table: 'entries', record, action: 'delete' }))));
      showToast(`Moved ${ordered.length === 1 ? 'the entry' : ordered.length + ' linked records'} to deleted records. You can restore from the previous version.`);
    } catch (error) {
      showToast(errorMessage(error));
    }
  });
  return button;
}

// ---- ui/category-editor.js ----
// Settings → Categories: add, rename, reorder and archive.
// Nothing is ever deleted here; archived categories stay on old entries and
// can be restored.








const MAX_DEPTH = 3; // top level → group → item

// View state kept between re-renders.
const editorView = { kind: 'expense', open: new Set(), editingId: '' };

function buildCategoryEditor(rerender) {
  const state = ledger.state;

  const kindSwitch = el('div', { class: 'segmented', role: 'group', 'aria-label': 'Category type' },
    [['expense', 'Spending'], ['income', 'Income']].map(([kind, label]) => el('button', {
      type: 'button',
      class: editorView.kind === kind ? 'is-selected' : '',
      'aria-pressed': String(editorView.kind === kind),
      'data-focus': `kind:${kind}`,
      text: label,
      onclick: () => { editorView.kind = kind; editorView.editingId = ''; rerender(); }
    })));

  return el('div', { class: 'cat-editor' },
    el('p', { class: 'note', text: 'Tap a name to unfold it. Drag the grip, or use the arrows, to reorder within a level. Archiving hides a category from the picker; entries that use it keep it.' }),
    kindSwitch,
    levelList(state, '', 1, rerender));
}

/** One level of the tree, followed by its "add" row. */
function levelList(state, parentId, depth, rerender) {
  const siblings = childCategories(state, parentId, editorView.kind, true);
  const parent = state.categories.find(c => c.id === parentId);

  return el('ul', { class: 'ed-list' + (depth > 1 ? ' ed-list--nested' : '') },
    siblings.map((category, index) => categoryRow(state, category, index, siblings, depth, rerender)),
    el('li', { class: 'ed-add' }, addForm(parent, siblings, rerender)));
}

function categoryRow(state, category, index, siblings, depth, rerender) {
  const canHoldChildren = depth < MAX_DEPTH;
  const isOpen = editorView.open.has(category.id);
  const childCount = childCategories(state, category.id, editorView.kind, true).length;
  const pot = state.pots.find(p => p.id === category.pot);

  if (editorView.editingId === category.id) {
    return el('li', { class: 'ed-item', 'data-drag-item': '' }, renameForm(category, siblings, rerender));
  }

  const label = [
    el('span', { class: 'ed-name-text' }, categoryIconNode(category.icon), el('span', { text: category.name })),
    el('span', { class: 'ed-meta', text: [childCount ? `${childCount}` : '', pot?.name, category.archived && 'archived'].filter(Boolean).join(' · ') })
  ];
  const name = canHoldChildren
    ? el('button', {
        type: 'button', class: 'ed-name', 'aria-expanded': String(isOpen), 'data-focus': `fold:${category.id}`,
        onclick: () => { isOpen ? editorView.open.delete(category.id) : editorView.open.add(category.id); rerender(); }
      }, el('span', { class: 'fold-mark', 'aria-hidden': 'true', text: isOpen ? '−' : '+' }), label)
    : el('span', { class: 'ed-name' }, label);

  const moveButton = (direction, symbol, word) => el('button', {
    type: 'button', class: 'icon-btn', text: symbol,
    'aria-label': `Move ${category.name} ${word}`,
    'data-focus': `${word}:${category.id}`,
    disabled: direction < 0 ? index === 0 : index === siblings.length - 1,
    onclick: () => run(() => saveCategoryOrder(moveItem(siblings, index, index + direction)))
  });
  // Dragging stays inside this list, so a category keeps its parent.
  const grip = siblings.length > 1 && dragHandle({
    label: `Drag ${category.name} to reorder`,
    onDrop: (from, to) => run(() => saveCategoryOrder(moveItem(siblings, from, to)))
  });

  return el('li', { class: 'ed-item' + (category.archived ? ' is-archived' : ''), 'data-drag-item': '' },
    el('div', { class: 'ed-row' },
      grip,
      name,
      el('div', { class: 'ed-actions' },
        moveButton(-1, '↑', 'up'),
        moveButton(1, '↓', 'down'),
        el('button', {
          type: 'button', class: 'btn-text', text: 'Edit', 'aria-label': `Edit ${category.name}`,
          'data-focus': `edit:${category.id}`,
          onclick: () => { editorView.editingId = category.id; rerender(); document.getElementById('ed-rename')?.focus(); }
        }))),
    canHoldChildren && isOpen && levelList(state, category.id, depth + 1, rerender));
}

/**
 * The "Icon" control: None, one emoji, or one of the built-in pixel icons.
 * Works for any record with an optional `icon` (categories and accounts).
 * Returns { element, getValue() }. getValue gives the icon to store:
 * an icon object, null for "None", or undefined to leave the record as it is.
 */
function iconField(category, noneLabel = 'None') {
  const current = category.icon;
  let type = current?.type === 'emoji' ? 'emoji' : current?.type === 'pixel' ? 'pixel' : 'none';
  let pixelId = current?.type === 'pixel' && Object.hasOwn(PIXEL_ICONS, current.value) ? current.value : '';

  const emojiInput = el('input', {
    type: 'text', class: 'icon-emoji-input', maxLength: 32, autocomplete: 'off',
    value: current?.type === 'emoji' ? current.value : '',
    'aria-label': 'Emoji', placeholder: '🙂',
    // Keep one symbol once typing has settled (not in the middle of IME input).
    oninput: event => { if (!event.isComposing) emojiInput.value = firstGrapheme(emojiInput.value); }
  });
  const pixelButtons = PIXEL_ICON_IDS.map(id => el('button', {
    type: 'button', class: 'icon-choice', title: pixelIconLabel(id), 'aria-label': pixelIconLabel(id),
    onclick: () => { pixelId = id; update(); }
  }, pixelIconNode(id)));
  const pixelGrid = el('div', { class: 'icon-grid', role: 'group', 'aria-label': 'Pixel icons' }, pixelButtons);

  const typeButtons = [['none', noneLabel], ['emoji', 'Emoji'], ['pixel', 'Pixel']].map(([value, label]) => el('button', {
    type: 'button', text: label, 'data-icon-type': value,
    onclick: () => { type = value; update(); if (value === 'emoji') emojiInput.focus(); }
  }));

  function update() {
    for (const button of typeButtons) {
      const on = button.dataset.iconType === type;
      button.classList.toggle('is-selected', on);
      button.setAttribute('aria-pressed', String(on));
    }
    emojiInput.hidden = type !== 'emoji';
    pixelGrid.hidden = type !== 'pixel';
    pixelButtons.forEach((button, index) => {
      const on = PIXEL_ICON_IDS[index] === pixelId;
      button.classList.toggle('is-selected', on);
      button.setAttribute('aria-pressed', String(on));
    });
  }
  update();

  return {
    element: el('div', { class: 'icon-field' },
      el('span', { class: 'icon-field-label', text: 'Icon' }),
      el('div', { class: 'segmented', role: 'group', 'aria-label': 'Icon type' }, typeButtons),
      emojiInput, pixelGrid),
    getValue() {
      const emoji = firstGrapheme(emojiInput.value);
      if (type === 'emoji' && emoji) return { type: 'emoji', value: emoji };
      if (type === 'pixel' && pixelId) return { type: 'pixel', value: pixelId };
      // "None" is stored as null so a later upgrade does not put a default back.
      return current === undefined ? undefined : null;
    }
  };
}

/** How many levels deep a category sits (top level = 1). */
function depthOf(state, id) {
  let depth = 0;
  for (let c = state.categories.find(x => x.id === id); c; c = state.categories.find(x => x.id === c.parent)) depth += 1;
  return depth;
}

/** Levels in a category's own subtree (a leaf = 1). */
function subtreeHeight(state, id) {
  const kids = state.categories.filter(c => c.parent === id);
  return 1 + kids.reduce((most, c) => Math.max(most, subtreeHeight(state, c.id)), 0);
}

/** Every category a given one could move under without breaking the tree. */
function moveTargets(state, category) {
  const height = subtreeHeight(state, category.id);
  const insideItself = id => {
    for (let c = state.categories.find(x => x.id === id); c; c = state.categories.find(x => x.id === c.parent)) {
      if (c.id === category.id) return true;
    }
    return false;
  };
  const targets = [];
  const walk = (parentId, depth) => {
    for (const c of childCategories(state, parentId, category.kind, false)) {
      if (insideItself(c.id)) continue;
      if (depth + height <= MAX_DEPTH) targets.push({ category: c, depth });
      if (depth < MAX_DEPTH - 1) walk(c.id, depth + 1);
    }
  };
  walk('', 1);
  return targets;
}

/**
 * Records for moving a category under a new parent: it goes to the end of
 * its new level, and it (with any children that shared its pot) follows the
 * new parent's pot. Entries keep pointing at the same category ID.
 */
function moveRecords(state, category, newParentId, base) {
  const newParent = state.categories.find(c => c.id === newParentId);
  const newSiblings = state.categories.filter(c => c.parent === newParentId && c.kind === category.kind && c.id !== category.id);
  const order = newSiblings.reduce((highest, c) => Math.max(highest, c.order ?? -1), newSiblings.length - 1) + 1;
  const newPot = newParent ? newParent.pot : category.pot;
  const records = [{ ...base, parent: newParentId, order, pot: newPot }];
  if (newPot !== category.pot) {
    const walk = id => state.categories.filter(c => c.parent === id).forEach(child => {
      if (child.pot === category.pot) records.push({ ...child, pot: newPot });
      walk(child.id);
    });
    walk(category.id);
  }
  return records;
}

/** Inline form: rename, choose an icon, move, archive or restore. */
function renameForm(category, siblings, rerender) {
  const state = ledger.state;
  const input = el('input', { id: 'ed-rename', type: 'text', maxLength: 150, value: category.name, 'aria-label': 'Category name' });
  const icon = iconField(category);
  const close = () => { editorView.editingId = ''; };

  const parentSelect = el('select', { id: 'ed-parent', 'aria-label': 'Belongs to' },
    el('option', { value: '', text: 'Top level' }),
    moveTargets(state, category).map(({ category: target, depth }) => el('option', {
      value: target.id,
      text: `${'  '.repeat(depth - 1)}${depth > 1 ? '└ ' : ''}${target.name}`
    })));
  parentSelect.value = category.parent || '';
  const moveField = el('label', { class: 'ed-move' },
    el('span', { class: 'ed-move-label', text: 'Belongs to' }),
    parentSelect);

  return el('form', {
    class: 'ed-edit',
    onsubmit: event => {
      event.preventDefault();
      run(() => {
        const current = ledger.state;
        const newParent = parentSelect.value;
        const moving = newParent !== (category.parent || '');
        const targetSiblings = moving
          ? current.categories.filter(c => c.parent === newParent && c.kind === category.kind)
          : siblings;
        const name = checkedName(input.value, targetSiblings, category.id);
        const record = { ...category, name };
        const chosenIcon = icon.getValue();
        if (chosenIcon !== undefined) record.icon = chosenIcon;
        close();
        if (!moving) return saveLedger(commit(current, 'categories', record));
        if (newParent) editorView.open.add(newParent); // show where it went
        const operations = moveRecords(current, category, newParent, record)
          .map(r => ({ table: 'categories', record: r }));
        const destination = current.categories.find(c => c.id === newParent)?.name || 'the top level';
        return saveLedger(commitBatch(current, operations)).then(() => showToast(`Moved ${name} to ${destination}.`));
      });
    }
  },
    input,
    icon.element,
    moveField,
    el('div', { class: 'ed-edit-actions' },
      el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Save' }),
      el('button', {
        type: 'button', class: 'btn-secondary btn-small', text: category.archived ? 'Restore' : 'Archive',
        onclick: () => run(() => {
          close();
          return saveLedger(commit(ledger.state, 'categories', { ...category, archived: !category.archived }));
        })
      }),
      el('button', { type: 'button', class: 'btn-text', text: 'Cancel', onclick: () => { close(); rerender(); } })));
}

function addForm(parent, siblings, rerender) {
  const label = parent ? `Add to ${parent.name}` : 'Add a category';
  const input = el('input', { type: 'text', maxLength: 150, placeholder: label, 'aria-label': label, 'data-focus': `add:${parent?.id || ''}` });

  return el('form', {
    class: 'ed-add-form',
    onsubmit: event => {
      event.preventDefault();
      run(() => {
        const state = ledger.state;
        const name = checkedName(input.value, siblings, '');
        // A new category follows its parent's pot. Top-level spending starts in Flexible.
        const pot = parent ? parent.pot
          : editorView.kind === 'income' ? state.settings.savingsPot || ''
          : state.pots.find(p => p.id === 'Clothing' && !p.archived)?.id || '';
        const order = siblings.reduce((highest, c) => Math.max(highest, c.order ?? -1), siblings.length - 1) + 1;
        return saveLedger(commit(state, 'categories', {
          id: uid(), name, kind: editorView.kind, parent: parent?.id || '', pot, order, archived: false
        }));
      });
    }
  }, input, el('button', { type: 'submit', class: 'btn-secondary btn-small', text: 'Add' }));
}

/** Trimmed name, or a readable error. Names are unique among siblings. */
function checkedName(raw, siblings, ownId) {
  const name = raw.trim();
  if (!name) throw Error('Type a name first.');
  if (siblings.some(c => c.id !== ownId && c.name.trim().toLowerCase() === name.toLowerCase())) {
    throw Error(`There is already a category called “${name}” here.`);
  }
  return name;
}

/** Store a clean 0…n order for one level, in a single commit. */
function saveCategoryOrder(reordered) {
  const operations = orderChanges(reordered)
    .map(({ item, order }) => ({ table: 'categories', record: { ...item, order } }));
  if (operations.length) return saveLedger(commitBatch(ledger.state, operations));
}

/** Run an action and show any problem calmly. */
async function run(action) {
  try {
    await action();
  } catch (error) {
    showToast(errorMessage(error));
  }
}

// ---- ui/pots.js ----
// The Pots tab: each pot with its balance, a sheet with the pot's month, the
// payday flow ("Distribute salary"), moving money between pots, the warning
// when an expense would take a pot below zero, and the three-month rollover
// that runs when the app opens.
//
// Pots are a plan for the money, not bank cash: nothing here changes an
// account. All sums come from payday-flow.js and pots-logic.js.











/** Format an amount in a pot's own currency. */
function potMoney(minor, pot) {
  return formatMoney(minor, pot.currency, pot.precision);
}

/** A stored percentage (hundredths) as text: 1250 → "12.5", 1000 → "10". */
function percentText(hundredths) {
  const text = plainAmount(hundredths, 2);
  return text.includes('.') ? text.replace(/\.?0+$/, '') : text;
}

/** The savings rule in a few words: "Savings · £300.00 + 10% of disposable". */
function savingsRuleLabel(savings, currencyCode, precision) {
  const parts = [
    savings.fixedMinor > 0 && formatMoney(savings.fixedMinor, currencyCode, precision),
    savings.percent > 0 && `${percentText(savings.percent)}% of ${savings.percentBase === 'disposable' ? 'disposable' : 'total'}`
  ].filter(Boolean);
  return parts.length ? `Savings · ${parts.join(' + ')}` : 'Savings';
}

/** Read an amount field; empty or zero is 0. Returns integer minor units. */
function potAmountInput(text, currencyCode) {
  const trimmed = text.trim();
  if (!trimmed || /^0*(?:[.,]0*)?$/.test(trimmed)) return 0;
  return parseAmount(trimmed, currencyCode);
}

/** A labelled field. */
function potField(id, label, control) {
  return el('div', { class: 'field' }, el('label', { for: id, text: label }), control);
}

// ---------------------------------------------------------------------------
// The list
// ---------------------------------------------------------------------------

function renderPots(root) {
  const state = ledger.state;
  const today = todayIso();
  const pots = state.pots.filter(p => !p.archived);

  const distribute = el('button', {
    type: 'button', class: 'btn-primary', text: 'Distribute salary',
    'aria-haspopup': 'dialog', 'aria-expanded': 'false', 'data-focus': 'pots-distribute',
    onclick: () => openDistribute(distribute)
  });
  const waiting = unallocatedSalaries(state).length;

  root.append(slip({ label: 'Pots', kind: `Payday ${formatDay(nextPayday(today, state.settings))}`, wide: true },
    el('p', { class: 'note', text: 'Pots are a plan for your money. Moving money between pots never moves it between bank accounts.' }),
    el('div', { class: 'pots-actions' },
      distribute,
      waiting > 0 && el('span', { class: 'hint', text: waiting === 1 ? 'One salary is waiting to be shared out.' : `${waiting} salaries are waiting to be shared out.` })),
    sectionTitle('Your pots'),
    pots.length
      ? el('ul', { class: 'plain-list pots-list' }, pots.map(pot => potRow(state, pot, today)))
      : el('p', { class: 'empty', text: 'There are no pots yet. You can add one in Settings.' }),
    el('p', { class: 'hint', text: 'Tap a pot to see its month. A pot below zero stays red until you cover it; nothing moves on its own.' }),
    el('a', { class: 'btn-text', href: '#settings/pots', text: 'Add, rename or archive pots' })));
}

function potRow(state, pot, today) {
  const balance = potBalance(state, pot.id, today);
  const negative = balance.minor < 0n;
  const rollover = rolloverSetting(pot);
  const meta = [
    pot.kind === 'savings' ? 'Savings' : 'Budget',
    rollover.enabled && `rolls over after ${rollover.months} months`,
    balance.missing > 0 && `${balance.missing} not counted (another currency)`
  ].filter(Boolean).join(' · ');

  const open = el('button', {
    type: 'button', class: 'pot-open', 'aria-haspopup': 'dialog', 'aria-expanded': 'false', 'data-focus': `pot:${pot.id}`,
    'aria-label': `${pot.name}, ${potMoney(balance.minor, pot)}${negative ? ', below zero' : ''}`,
    onclick: () => openPopover({ anchor: open, label: pot.name, role: 'dialog', content: potSheet(ledger.state, pot, todayIso()) })
  },
    el('span', { class: 'entry-text' },
      el('span', { class: 'entry-title' }, categoryIconNode(pot.icon), el('span', { text: pot.name })),
      el('span', { class: 'entry-meta', text: meta })),
    el('span', { class: 'entry-amount' + (negative ? ' is-negative' : ''), text: potMoney(balance.minor, pot) }));

  const move = negative && el('button', {
    type: 'button', class: 'btn-secondary btn-small', text: 'Move money',
    'aria-haspopup': 'dialog', 'aria-expanded': 'false', 'data-focus': `pot-move:${pot.id}`,
    'aria-label': `Move money into ${pot.name}`,
    onclick: () => openMoveMoney(move, pot)
  });

  return el('li', { class: 'list-row pot-row' + (negative ? ' is-negative' : '') }, open, move);
}

// ---------------------------------------------------------------------------
// One pot's sheet
// ---------------------------------------------------------------------------

function potSheet(state, pot, today) {
  const balance = potBalance(state, pot.id, today);
  const month = potMonthSummary(state, pot.id, today);
  const upcoming = potUpcoming(state, pot.id, today);
  const rollover = rolloverSetting(pot);
  const target = state.pots.find(p => p.id === rollover.to);
  const monthName = new Date(Number(today.slice(0, 4)), Number(today.slice(5, 7)) - 1, 1).toLocaleDateString('en-GB', { month: 'long' });

  const fact = (label, value, negative = false) => el('div', { class: 'pot-fact' },
    el('dt', { text: label }),
    el('dd', { class: negative ? 'is-negative' : '', text: value }));

  return el('div', { class: 'pot-sheet' },
    el('dl', { class: 'pot-facts' },
      fact('Balance', potMoney(balance.minor, pot), balance.minor < 0n),
      fact(`Funded in ${monthName}`, potMoney(month.funded, pot)),
      month.movedOut > 0n && fact(`Moved out in ${monthName}`, potMoney(month.movedOut, pot)),
      fact(`Spent in ${monthName}`, potMoney(month.spent, pot))),
    (balance.missing > 0 || month.missing > 0) && el('p', { class: 'hint', text: 'Spending in another currency with no recorded value is not counted here.' }),

    el('div', { class: 'day-head' }, el('span', { text: 'Fixed items before payday' })),
    upcoming.length
      ? el('ul', { class: 'plain-list' }, upcoming.map(item => el('li', { class: 'list-row' },
          el('span', { class: 'entry-text' },
            el('span', { class: 'entry-title', text: item.label }),
            el('span', { class: 'entry-meta', text: formatDay(item.date) + (item.estimated ? ' · estimate' : '') })),
          el('span', { class: 'entry-amount', text: formatMoney(item.minor, item.currency, item.precision) }))))
      : el('p', { class: 'empty', text: 'Nothing planned from this pot before payday.' }),

    el('div', { class: 'day-head' }, el('span', { text: 'Rollover' })),
    el('p', {
      class: 'note', text: rollover.enabled
        ? `On. Money left unused for ${rollover.months} months moves to ${target?.name || 'savings'} when the app opens.`
        : 'Off. Unused money stays in this pot.'
    }),
    el('a', { class: 'btn-text', href: '#settings/pots', text: 'Change in Settings' }));
}

// ---------------------------------------------------------------------------
// Moving money between pots (only ever when the user asks)
// ---------------------------------------------------------------------------

/**
 * The two fields of a move into `target`: where from, and how much
 * (prefilled with `amountMinor`). Returns { element, hasSource, read(state, date) };
 * read gives the allocation operation or throws a readable error.
 */
function potMoveFields(state, target, amountMinor, date) {
  const sources = state.pots.filter(p => !p.archived && p.id !== target.id && p.currency === target.currency && p.precision === target.precision);
  const held = new Map(sources.map(p => [p.id, potBalance(state, p.id, date).minor]));
  const flow = paydayFlowSetting(state);

  const from = el('select', { id: 'pot-move-from' }, sources.map(p => el('option', { value: p.id, text: `${p.name} · ${potMoney(held.get(p.id), p)}` })));
  // Prefer "Flexible savings" (the leftover pot), then savings, then any pot that holds enough.
  const enough = id => held.has(id) && held.get(id) >= BigInt(amountMinor);
  const preferred = [flow.leftoverPot, flow.savingsPot, ...sources.map(p => p.id)].find(enough);
  if (preferred) from.value = preferred;

  const amount = el('input', {
    id: 'pot-move-amount', type: 'text', inputMode: 'decimal', autocomplete: 'off',
    value: amountMinor > 0n ? plainAmount(amountMinor, target.precision) : ''
  });

  return {
    hasSource: sources.length > 0,
    element: el('div', { class: 'field-pair' },
      potField('pot-move-from', 'Move from', from),
      potField('pot-move-amount', `Amount (${target.currency})`, amount)),
    read(current, moveDate) {
      const minor = potAmountInput(amount.value, target.currency);
      return potMoveOperation(current, {
        id: uid(), from: from.value, to: target.id, minor, date: moveDate, note: `Moved to cover ${target.name}`
      });
    }
  };
}

/** "Move money" on a pot below zero. */
function openMoveMoney(anchor, pot) {
  const today = todayIso();
  const balance = potBalance(ledger.state, pot.id, today).minor;
  const fields = potMoveFields(ledger.state, pot, balance < 0n ? -balance : 0n, today);
  const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });

  const form = el('form', {
    class: 'pot-sheet', novalidate: true,
    onsubmit: async event => {
      event.preventDefault();
      try {
        const operation = fields.read(ledger.state, today);
        const next = commitBatch(ledger.state, [operation]);
        const sourceName = ledger.state.pots.find(p => p.id === operation.record.from)?.name;
        closePopover({ restoreFocus: false });
        await saveLedger(next);
        showToast(`Moved ${potMoney(operation.record.minor, pot)} from ${sourceName} to ${pot.name}.`);
      } catch (error) {
        errorBox.textContent = errorMessage(error);
        errorBox.hidden = false;
        if (!form.isConnected) showToast(errorMessage(error));
      }
    }
  },
    el('p', { class: 'note', text: `${pot.name} is at ${potMoney(balance, pot)}. Choose where the money comes from. No bank account changes.` }),
    fields.hasSource ? fields.element : el('p', { class: 'empty', text: 'There is no other pot in this currency to move from.' }),
    errorBox,
    fields.hasSource && el('button', { type: 'submit', class: 'btn-primary btn-small', text: 'Move' }));

  openPopover({ anchor, label: `Move money into ${pot.name}`, role: 'dialog', content: form });
}

/**
 * Today's Save, when the expense would take its pot below zero.
 * `warning` comes from negativePotCheck; `next` is the ledger with the
 * expense already in it (not saved yet).
 *
 * Resolves with null (closed: nothing is saved), or { state, moved }:
 *   OK        → state is `next`; the pot shows red until it is covered
 *   Move now  → state also holds one allocation from the chosen pot; moved describes it
 */
function askNegativePot(anchor, warning, next, date) {
  return new Promise(resolve => {
    let answer = null;
    const pot = warning.pot;
    const fields = potMoveFields(next, pot, warning.shortfall, date);
    const errorBox = el('p', { class: 'form-error', role: 'alert', hidden: true });

    const moveForm = el('form', {
      hidden: true, novalidate: true,
      onsubmit: event => {
        event.preventDefault();
        try {
          const operation = fields.read(next, date);
          answer = {
            state: commitBatch(next, [operation]),
            moved: { minor: operation.record.minor, from: next.pots.find(p => p.id === operation.record.from)?.name, pot }
          };

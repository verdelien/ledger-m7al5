class LedgerStore {
 async open(today){this.db=await new Promise((resolve,reject)=>{const r=indexedDB.open('expense-book',1);r.onupgradeneeded=()=>r.result.createObjectStore('ledger');r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Close other expense-book tabs to upgrade storage.'));r.onsuccess=()=>resolve(r.result);});this.db.onversionchange=()=>this.db.close();let state=await this.read();if(!state){const raw=localStorage.getItem('expense-book.v1');state=raw?migrate(JSON.parse(raw),today):initial();await this.write(state,null);}return validateState(state);}
 read(){return new Promise((resolve,reject)=>{const tx=this.db.transaction('ledger','readonly');let value;const r=tx.objectStore('ledger').get('state');r.onsuccess=()=>value=r.result;tx.oncomplete=()=>resolve(value);tx.onabort=()=>reject(tx.error||Error('Could not read the ledger.'));});}
 write(state,expected){validateState(state);return new Promise((resolve,reject)=>{const tx=this.db.transaction('ledger','readwrite');const store=tx.objectStore('ledger');let failure;const r=store.get('state');r.onsuccess=()=>{if((r.result?.revision??null)!==expected){failure=Error('Another tab changed the ledger. Reload before saving; your form is kept.');tx.abort();return;}store.put(structuredClone(state),'state');};tx.oncomplete=()=>{try{this.channel?.postMessage({revision:state.revision});}catch{}resolve();};tx.onabort=()=>reject(failure||tx.error||Error('The save failed. Your previous ledger was preserved.'));});}
 // Side records kept beside the ledger (for example 'sync': what the sheet last confirmed). Never part of a backup.
 readKey(key){return new Promise((resolve,reject)=>{const tx=this.db.transaction('ledger','readonly');let value;const r=tx.objectStore('ledger').get(key);r.onsuccess=()=>value=r.result;tx.oncomplete=()=>resolve(value);tx.onabort=()=>reject(tx.error||Error('Could not read stored data.'));});}
 writeKey(key,value){if(key==='state')throw Error('Use write() for the ledger.');return new Promise((resolve,reject)=>{const tx=this.db.transaction('ledger','readwrite');tx.objectStore('ledger').put(structuredClone(value),key);tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||Error('The save failed.'));});}
 watch(fn){if('BroadcastChannel'in globalThis){this.channel=new BroadcastChannel('expense-book');this.channel.onmessage=fn;}}
}

// ---- sync-core.js ----
// Shared sync rules, used by the page and bundled into backend/Code.gs.
// Pure functions only: no network, no browser or Google APIs, no secrets.
// Top-level names are prefixed so they stay unique in the bundled files.

/** Protocol version. The page and the script must agree. */
const SYNC_SCHEMA = 2;

/** Ledger tables that sync, one row per record. Settings sync one row per key. */
const SYNC_TABLES = ['accounts', 'categories', 'pots', 'entries', 'allocations', 'templates', 'schedules', 'trips', 'wishlist', 'friends', 'settlements', 'valuations', 'caps', 'trash'];
const SYNC_SETTINGS = 'settings';

/** The largest record the sheet accepts (a cell holds 50,000 characters). */
const SYNC_MAX_RECORD = 45000;

/** Technical columns at the far right of every tab. `json` is the source of truth. */
const SYNC_TECH = ['id', 'revision', 'updatedAt', 'deleted', 'changedAt', 'table', 'json'];

/**
 * The readable tabs. `amounts` are the 1-based columns holding decimal amounts;
 * `names` marks tabs whose readable cells show names from other tabs.
 */
const SHEET_TABS = [
  {
    name: 'Entries', tables: ['entries'], amounts: [3, 11], names: true,
    columns: ['Date', 'Type', 'Amount', 'Currency', 'Category', 'Pot', 'Account', 'Note', 'Tags', 'Status', 'Charged to account', 'Account currency', 'Trip']
  },
  { name: 'Accounts', tables: ['accounts'], amounts: [4], columns: ['Name', 'Type', 'Currency', 'Opening balance', 'Opening date', 'Archived'] },
  { name: 'Pots', tables: ['pots'], amounts: [4], names: true, columns: ['Name', 'Type', 'Currency', 'Target', 'Rolls over', 'Archived'] },
  { name: 'Categories', tables: ['categories'], names: true, columns: ['Category', 'Type', 'Pot', 'Archived'] },
  { name: 'Allocations', tables: ['allocations'], amounts: [4], names: true, columns: ['Date', 'From pot', 'To pot', 'Amount', 'Currency', 'Note'] },
  { name: 'Settings', tables: [SYNC_SETTINGS], columns: ['Setting', 'Value'] },
  {
    name: 'Other', tables: ['templates', 'schedules', 'trips', 'wishlist', 'friends', 'settlements', 'valuations', 'caps', 'trash'],
    columns: ['Kind', 'Name', 'Details']
  }
];

/** Tables whose names appear in the readable cells of other rows. */
const SYNC_NAME_TABLES = ['accounts', 'pots', 'categories', 'trips'];

function syncTabFor(table) {
  return SHEET_TABS.find(tab => tab.tables.includes(table)) || null;
}

/** JSON with sorted keys, so two copies of one record compare equal. */
function canonicalJson(value) {
  if (value === undefined || value === null) return 'null';
  if (Array.isArray(value)) return '[' + value.map(canonicalJson).join(',') + ']';
  if (typeof value === 'object') {
    return '{' + Object.keys(value).filter(key => value[key] !== undefined).sort()
      .map(key => JSON.stringify(key) + ':' + canonicalJson(value[key])).join(',') + '}';
  }
  return JSON.stringify(value);
}

function syncClone(value) {
  return JSON.parse(JSON.stringify(value));
}

/** The part of a ledger that syncs: settings and the record tables. */
function syncView(state) {
  const view = { settings: state.settings || null };
  for (const table of SYNC_TABLES) view[table] = state[table] || [];
  return syncClone(view);
}

function emptyView() {
  const view = { settings: null };
  for (const table of SYNC_TABLES) view[table] = [];
  return view;
}

/** A table's records. Settings become one `{ id: key, value }` record per key. */
function syncRecords(view, table) {
  if (table !== SYNC_SETTINGS) return view[table] || [];
  const settings = view.settings || {};
  return Object.keys(settings).filter(key => settings[key] !== undefined).map(key => ({ id: key, value: settings[key] }));
}

function syncRecord(view, table, id) {
  if (table === SYNC_SETTINGS) {
    const settings = view.settings || {};
    return Object.prototype.hasOwnProperty.call(settings, id) && settings[id] !== undefined ? { id, value: settings[id] } : null;
  }
  return (view[table] || []).find(record => record.id === id) || null;
}

/** Put a record into a view, or remove it when `record` is null. Changes `view`. */
function syncPutRecord(view, table, id, record) {
  if (table === SYNC_SETTINGS) {
    if (!view.settings) view.settings = {};
    if (record) view.settings[id] = syncClone(record.value);
    else delete view.settings[id];
    return view;
  }
  view[table] = (view[table] || []).filter(row => row.id !== id);
  if (record) view[table].push(syncClone(record));
  return view;
}

function syncKey(table, id) {
  return table + '\n' + id;
}

/** Refuse a malformed change before anything is stored. Returns the record's JSON. */
function syncCheckChange(change) {
  if (!change || (change.table !== SYNC_SETTINGS && !SYNC_TABLES.includes(change.table))) throw Error('Unknown sync table.');
  const record = change.record;
  if (!record || typeof record !== 'object' || Array.isArray(record)) throw Error('A sync change needs its record.');
  if (typeof record.id !== 'string' || !record.id || record.id.length > 300) throw Error('Invalid sync ID.');
  if (change.table === SYNC_SETTINGS && !change.deleted && record.value === undefined) throw Error('A setting needs a value.');
  const json = JSON.stringify(record);
  if (json.length > SYNC_MAX_RECORD) throw Error('The record ' + record.id + ' is too large for one sheet cell.');
  return json;
}

/**
 * What changed between two views, as push changes:
 * `{ table, record, deleted }`. A deletion carries the last known record,
 * so the sheet keeps a readable tombstone row.
 */
function syncDiff(base, current) {
  const changes = [];
  for (const table of [SYNC_SETTINGS].concat(SYNC_TABLES)) {
    const before = new Map(syncRecords(base, table).map(record => [record.id, record]));
    const after = new Map(syncRecords(current, table).map(record => [record.id, record]));
    for (const [id, record] of after) {
      if (!before.has(id) || canonicalJson(before.get(id)) !== canonicalJson(record)) changes.push({ table, record, deleted: false });
    }
    for (const [id, record] of before) {
      if (!after.has(id)) changes.push({ table, record, deleted: true });
    }
  }
  return changes;
}

// ---- Readable cells -------------------------------------------------------

/** Integer minor units as an exact decimal string: (-1250, 2) → "-12.50". */
function syncDecimal(minor, precision, negative) {
  if (minor === null || minor === undefined || !Number.isSafeInteger(minor)) return '';
  const places = Number.isInteger(precision) && precision >= 0 && precision <= 8 ? precision : 2;
  const digitsOnly = String(Math.abs(minor)).padStart(places + 1, '0');
  const whole = places ? digitsOnly.slice(0, -places) : digitsOnly;
  const sign = (minor < 0) !== !!negative && minor !== 0 ? '-' : '';
  return sign + whole + (places ? '.' + digitsOnly.slice(-places) : '');
}

function syncLabel(text) {
  const words = String(text || '').replace(/_/g, ' ');
  return words.charAt(0).toUpperCase() + words.slice(1);
}

function syncNameOf(view, table, id) {
  if (!id) return '';
  const row = (view[table] || []).find(record => record.id === id);
  return row && row.name ? row.name : String(id);
}

/** "Eating out › Takeaway". */
function syncCategoryPath(view, id) {
  const parts = [];
  const seen = {};
  let current = id;
  while (current && !seen[current]) {
    seen[current] = true;
    const category = (view.categories || []).find(record => record.id === current);
    if (!category) { if (!parts.length) parts.unshift(String(current)); break; }
    parts.unshift(category.name);
    current = category.parent;
  }
  return parts.join(' › ');
}

function syncYes(value) {
  return value ? 'yes' : '';
}

/**
 * The readable cells of one record, in the column order of its tab.
 * `view` supplies the names of categories, pots, accounts and trips.
 * These cells are for people; the app only ever reads the `json` column.
 */
function syncReadableRow(table, record, view) {
  const r = record || {};
  if (table === 'entries') {
    const outgoing = r.kind === 'expense' || ((r.kind === 'adjustment' || r.kind === 'settlement') && r.direction !== 'increase');
    const account = r.kind === 'transfer'
      ? syncNameOf(view, 'accounts', r.account) + ' → ' + syncNameOf(view, 'accounts', r.toAccount)
      : syncNameOf(view, 'accounts', r.account);
    const charged = r.settledMinor === null || r.settledMinor === undefined;
    return [
      r.date || '', syncLabel(r.kind), syncDecimal(r.minor, r.precision, outgoing), r.currency || '',
      syncCategoryPath(view, r.category), syncNameOf(view, 'pots', r.pot), account, r.note || '', r.tags || '', syncLabel(r.status),
      charged ? '' : syncDecimal(r.settledMinor, r.settledPrecision, outgoing), charged ? '' : r.settledCurrency || '',
      syncNameOf(view, 'trips', r.trip)
    ];
  }
  if (table === 'accounts') {
    return [r.name || '', syncLabel(r.type), r.currency || '', syncDecimal(r.opening, r.precision), r.openingDate || '', syncYes(r.archived)];
  }
  if (table === 'pots') {
    const rollover = r.rollover && r.rollover.enabled
      ? 'After ' + r.rollover.months + (r.rollover.months === 1 ? ' month' : ' months') + ' → ' + syncNameOf(view, 'pots', r.rollover.to)
      : '';
    return [r.name || '', syncLabel(r.kind), r.currency || '', r.target == null ? '' : syncDecimal(r.target, r.precision), rollover, syncYes(r.archived)];
  }
  if (table === 'categories') {
    return [syncCategoryPath(view, r.id), syncLabel(r.kind), syncNameOf(view, 'pots', r.pot), syncYes(r.archived)];
  }
  if (table === 'allocations') {
    const pot = (view.pots || []).find(p => p.id === r.to) || (view.pots || []).find(p => p.id === r.from) || {};
    return [
      r.date || '', r.from ? syncNameOf(view, 'pots', r.from) : 'New budget', syncNameOf(view, 'pots', r.to),
      syncDecimal(r.minor, pot.precision), pot.currency || '', r.note || ''
    ];
  }
  if (table === SYNC_SETTINGS) {
    const value = JSON.stringify(r.value === undefined ? null : r.value);
    return [r.id || '', value.length > 2000 ? value.slice(0, 2000) + '…' : value];
  }
  const inner = table === 'trash' && r.record ? r.record : r;
  const details = [table === 'trash' ? 'Deleted from ' + (r.table || 'the ledger') : '', inner.date || inner.start || '', inner.note || '']
    .filter(Boolean).join(' · ');
  return [syncLabel(table), inner.name || '', details];
}

// ---- sync-client.js ----
// Google Sheets sync, client side. Offline first: the ledger on this device
// is always usable, and changes wait here until the sheet confirms them.
//
// How it keeps track:
//   - `baseline` is what the sheet last confirmed. Anything in the ledger
//     that differs from it is a change waiting to be sent.
//   - A push is stored with a stable `opId` before it is sent, and the same
//     push is repeated until the sheet answers, so nothing is applied twice.
//   - A record changed both here and in the sheet is a conflict. It is never
//     overwritten; the person chooses "Keep mine" or "Use sheet".
//
// The web app address and secret are kept by `connection` (localStorage in
// the browser), apart from the ledger, so they never reach a backup, an
// export or the synced settings.




const SYNC_CONNECTION_KEY = 'expense-book.sync-connection';
const SYNC_PUSH_DELAY = 2500;
const SYNC_PULL_EVERY = 120000;

/** Where the address and secret live on this device. */
function browserConnectionStore(storage = globalThis.localStorage) {
  return {
    get() {
      try {
        const saved = JSON.parse(storage.getItem(SYNC_CONNECTION_KEY));
        return saved && typeof saved.url === 'string' && typeof saved.secret === 'string' ? saved : null;
      } catch { return null; }
    },
    set(connection) { storage.setItem(SYNC_CONNECTION_KEY, JSON.stringify({ url: connection.url, secret: connection.secret })); },
    clear() { try { storage.removeItem(SYNC_CONNECTION_KEY); } catch { /* nothing stored */ } }
  };
}

/** Accept only a deployed Apps Script web app address. Returns it normalised. */
function syncCheckAddress(address) {
  let url;
  try { url = new URL(String(address).trim()); } catch { throw Error('Paste the web app URL from Apps Script. It ends in /exec.'); }
  if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' || !/^\/(a\/macros\/[^/]+|macros)\/s\/[^/]+\/exec$/.test(url.pathname)) {
    throw Error('Use the web app URL from Apps Script: https://script.google.com/macros/s/…/exec');
  }
  return url.origin + url.pathname;
}

function syncProblem(code, message) {
  const error = Error(message);
  error.syncCode = code;
  return error;
}

const syncCopy = value => JSON.parse(JSON.stringify(value));
const syncBlankMeta = () => ({ ledgerKey: '', serverRevision: 0, baseline: null, pendingOp: null, conflicts: [], lastSyncedAt: '', awaiting: null });

/** "Synced 2 min ago". */
function syncAgo(iso, now = Date.now()) {
  if (!iso) return 'Not synced yet';
  const minutes = Math.floor((now - Date.parse(iso)) / 60000);
  if (!(minutes >= 1)) return 'Synced just now';
  if (minutes < 60) return `Synced ${minutes} min ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `Synced ${hours} h ago`;
  const days = Math.floor(hours / 24);
  return `Synced ${days} ${days === 1 ? 'day' : 'days'} ago`;
}

/**
 * @param getState    () => the current ledger
 * @param saveState   async next => validates and stores the next ledger (throws on failure)
 * @param loadMeta / saveMeta  durable storage for the sync record (not part of the ledger)
 * @param connection  { get, set, clear } for { url, secret }
 * @param shouldWait  () => true while an automatic sync should hold off (someone is typing)
 */
function createSyncClient({
  getState, saveState, loadMeta, saveMeta, connection,
  fetch: fetchFn = (...args) => globalThis.fetch(...args),
  isOnline = () => globalThis.navigator?.onLine !== false,
  newId = uid, now = () => new Date(), onChange = () => {}, shouldWait = () => false, timeout = 60000
}) {
  let meta = syncBlankMeta();
  let link = null;        // { url, secret }
  let busy = false;
  let again = false;
  let problem = null;     // { code, message } from the last attempt
  let pushTimer = 0;
  let detach = () => {};

  const emit = () => { try { onChange(status()); } catch { /* a listener must not stop sync */ } };
  const persist = () => saveMeta(syncCopy(meta));
  const conflictIndex = (table, id) => meta.conflicts.findIndex(c => c.table === table && c.id === id);

  /** Changes on this device the sheet has not confirmed (conflicts wait for a choice). */
  function waiting() {
    if (!meta.baseline) return [];
    return syncDiff(meta.baseline, syncView(getState())).filter(change => conflictIndex(change.table, change.record.id) < 0);
  }

  function withMine(conflicts) {
    const local = syncView(getState());
    return conflicts.map(c => ({ ...c, mine: syncRecord(local, c.table, c.id) }));
  }

  function status() {
    const connected = !!link;
    const count = connected && meta.baseline ? waiting().length : 0;
    const changes = `${count} ${count === 1 ? 'change' : 'changes'} waiting`;
    let kind = 'synced';
    let text = syncAgo(meta.lastSyncedAt, now().getTime());
    if (!connected) { kind = 'off'; text = 'Not connected'; }
    else if (meta.awaiting) { kind = 'choose'; text = 'Connected — choose which copy to keep'; }
    else if (meta.conflicts.length) { kind = 'conflict'; text = 'Conflict — review'; }
    else if (busy) { kind = 'syncing'; text = 'Syncing…'; }
    else if (!isOnline() || problem?.code === 'network') { kind = 'offline'; text = count ? `Offline — ${changes}` : 'Offline — nothing waiting'; }
    else if (problem) { kind = 'error'; text = `Sync paused — ${problem.message}`; }
    else if (count) { kind = 'waiting'; text = changes[0].toUpperCase() + changes.slice(1); }
    return {
      kind, text, connected, waiting: count, url: link?.url || '', awaiting: meta.awaiting, lastSyncedAt: meta.lastSyncedAt,
      problem: problem?.message || '', conflicts: meta.conflicts.length ? withMine(meta.conflicts) : []
    };
  }

  /** One request. Anything but a readable `{ ok: true }` answer is a failure. */
  async function post(body, target = link) {
    if (!target) throw syncProblem('off', 'Connect to a sheet first.');
    if (!isOnline()) throw syncProblem('network', 'This device is offline.');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    let response;
    try {
      // text/plain keeps this a "simple" request (no CORS preflight, which Apps
      // Script cannot answer). Apps Script replies with a 302 that must be followed.
      response = await fetchFn(target.url, {
        method: 'POST', redirect: 'follow', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ secret: target.secret, schema: SYNC_SCHEMA, ledgerKey: meta.ledgerKey || undefined, ...body }),
        signal: controller.signal
      });
    } catch (error) {
      throw syncProblem('network', error?.name === 'AbortError' ? 'The sheet took too long to answer.' : 'The sheet could not be reached.');
    } finally {
      clearTimeout(timer);
    }
    if (!response || response.type === 'opaque' || response.type === 'opaqueredirect' || !response.ok) {
      throw syncProblem('network', `The sheet did not answer${response?.status ? ` (HTTP ${response.status})` : ''}.`);
    }
    let reply;
    try { reply = JSON.parse(await response.text()); } catch {
      throw syncProblem('server', 'The web app did not answer as expected. Check the deployment: Execute as “Me”, Who has access “Anyone”.');
    }
    if (!reply || reply.ok !== true) throw syncProblem(reply?.code || 'server', reply?.error || 'The sheet refused the request.');
    return reply;
  }

  const remoteValue = change => (change.deleted ? null : change.record);

  /** Note a record that differs here and in the sheet. `draft` is the sync record being built. */
  function noteConflict(draft, change, state) {
    const theirs = remoteValue(change);
    const mine = syncRecord(syncView(state), change.table, change.id);
    syncPutRecord(draft.baseline, change.table, change.id, theirs);
    draft.conflicts = draft.conflicts.filter(c => !(c.table === change.table && c.id === change.id));
    if (canonicalJson(mine) !== canonicalJson(theirs)) draft.conflicts.push({ table: change.table, id: change.id, theirs, changedAt: change.changedAt });
  }

  /** Send one stored push and record the answer. Throws (keeping the push) when no answer came. */
  async function send(op) {
    let reply;
    try {
      reply = await post({ op: 'push', opId: op.opId, baseRevision: op.baseRevision, changes: op.changes });
    } catch (error) {
      // The sheet read the request and said no: sending the same bytes again cannot help.
      if (error.syncCode === 'invalid' || error.syncCode === 'reused') { meta.pendingOp = null; await persist(); }
      throw error;
    }
    const draft = syncCopy(meta);
    draft.pendingOp = null;
    if (reply.rejected) {
      meta = draft;
      await persist();
      throw syncProblem('rejected', `The sheet did not accept these changes: ${reply.rejected}`);
    }
    const refused = new Set((reply.conflicts || []).map(c => syncKey(c.table, c.id)));
    for (const change of op.changes) {
      if (!refused.has(syncKey(change.table, change.record.id))) syncPutRecord(draft.baseline, change.table, change.record.id, change.deleted ? null : change.record);
    }
    const state = getState();
    for (const conflict of reply.conflicts || []) noteConflict(draft, conflict, state);
    // Move the cursor only when nothing else can have happened in between.
    if (!reply.duplicate && reply.serverRevision === draft.serverRevision + 1) draft.serverRevision = reply.serverRevision;
    meta = draft;
    await persist();
  }

  /** Fetch what changed in the sheet and merge it. Untouched records update; edited ones become conflicts. */
  async function pull() {
    const reply = await post({ op: 'pull', sinceRevision: meta.serverRevision });
    if (!Array.isArray(reply.changes) || !Number.isSafeInteger(reply.serverRevision)) throw syncProblem('server', 'The sheet sent an answer this app does not understand.');
    if (!reply.changes.length) {
      if (meta.serverRevision !== reply.serverRevision) { meta.serverRevision = reply.serverRevision; await persist(); }
      return;
    }
    const state = getState();
    const local = syncView(state);
    const draft = syncCopy(meta);
    const incoming = [];
    for (const change of reply.changes) {
      const theirs = canonicalJson(remoteValue(change));
      const known = canonicalJson(syncRecord(draft.baseline, change.table, change.id));
      if (theirs === known) continue; // already known here (often our own push)
      const mine = canonicalJson(syncRecord(local, change.table, change.id));
      if (mine === theirs || mine === known) {
        if (mine !== theirs) incoming.push(change);
        syncPutRecord(draft.baseline, change.table, change.id, remoteValue(change));
        draft.conflicts = draft.conflicts.filter(c => !(c.table === change.table && c.id === change.id));
      } else {
        noteConflict(draft, change, state);
      }
    }
    draft.serverRevision = reply.serverRevision;
    if (incoming.length) {
      const next = structuredClone(state);
      next.settings = { ...next.settings };
      for (const change of incoming) syncPutRecord(next, change.table, change.id, remoteValue(change));
      next.revision++;
      try {
        await saveState(next); // the ledger first; the sync record only once it is stored
      } catch (error) {
        throw syncProblem('merge', `Changes from the sheet could not be applied here (${error.message}). Nothing was changed on this device.`);
      }
    }
    meta = draft;
    await persist();
  }

  async function cycle() {
    if (meta.pendingOp) await send(meta.pendingOp);
    await pull();
    const changes = waiting();
    if (changes.length) {
      // Store the push before sending it, so a lost answer is retried with the same ID.
      meta.pendingOp = { opId: newId(), baseRevision: meta.serverRevision, changes: syncCopy(changes) };
      await persist();
      await send(meta.pendingOp);
    }
    meta.lastSyncedAt = now().toISOString();
    await persist();
  }

  /** Push what is waiting and pull what is new. `automatic` runs hold off while someone is typing. */
  async function sync({ automatic = false } = {}) {
    if (!link || !meta.baseline || meta.awaiting) return status();
    if (automatic && shouldWait()) return status();
    if (busy) { again = true; return status(); }
    busy = true;
    emit();
    try {
      do {
        again = false;
        await cycle();
      } while (again);
      problem = null;
    } catch (error) {
      problem = { code: error.syncCode || 'error', message: error.message || 'Sync failed.' };
    } finally {
      busy = false;
      again = false;
    }
    emit();
    return status();
  }

  /** Call after every local save: sends the change once things have been quiet for 2.5 s. */
  function schedule() {
    clearTimeout(pushTimer);
    if (!link || !meta.baseline || meta.awaiting) return;
    pushTimer = setTimeout(() => { sync({ automatic: true }); }, SYNC_PUSH_DELAY);
    emit();
  }

  /** Read the stored connection and sync record. Call once, before anything else. */
  async function start() {
    link = connection.get();
    meta = { ...syncBlankMeta(), ...(await loadMeta() || {}) };
    emit();
    return status();
  }

  const hasOwnRecords = state => ['entries', 'accounts', 'allocations'].some(table => state[table]?.length);

  async function fetchSheet(target) {
    const reply = await post({ op: 'pull', sinceRevision: 0 }, target);
    const view = emptyView();
    for (const change of reply.changes) if (!change.deleted) syncPutRecord(view, change.table, change.id, change.record);
    return { view, serverRevision: reply.serverRevision };
  }

  /** Replace this device's records with the sheet's. */
  async function adoptSheet(target) {
    const sheet = await fetchSheet(target);
    if (!sheet.view.settings) throw syncProblem('server', 'The sheet has records but no settings. Upload from the device that has your records.');
    const next = structuredClone(getState());
    next.settings = syncCopy(sheet.view.settings);
    for (const table of SYNC_TABLES) next[table] = syncCopy(sheet.view[table]);
    next.revision++;
    await saveState(next);
    meta = { ...meta, baseline: sheet.view, serverRevision: sheet.serverRevision, pendingOp: null, conflicts: [], awaiting: null };
    await persist();
  }

  /**
   * Check the address and secret with the sheet, then remember them on this device.
   * Returns the status; `status.awaiting` is set when the person must choose a copy.
   */
  async function connect(address, secret) {
    const target = { url: syncCheckAddress(address), secret: String(secret || '').trim() };
    if (target.secret.length < 40) throw Error('Paste the whole secret from the script log. It is at least 40 characters.');
    const previous = meta;
    try {
      meta = { ...previous, ledgerKey: '' }; // a new connection may point at a different sheet
      const ping = await post({ op: 'ping' }, target);
      if (ping.ledgerKey === previous.ledgerKey && previous.baseline) {
        meta = previous;                                               // the same sheet as before: carry on
      } else {
        meta = { ...syncBlankMeta(), ledgerKey: ping.ledgerKey };
        if (ping.records === 0) meta.baseline = emptyView();           // empty sheet: upload everything
        else if (hasOwnRecords(getState())) meta.awaiting = { sheetRecords: ping.records };
        else await adoptSheet(target);                                 // nothing here yet: take the sheet's copy
      }
    } catch (error) {
      meta = previous;
      throw error;
    }
    link = target;
    connection.set(target);
    problem = null;
    await persist();
    emit();
    if (!meta.awaiting) await sync();
    return status();
  }

  /** Answer the first-connect question: 'sheet', 'device' or 'cancel'. */
  async function choose(answer) {
    if (!meta.awaiting || !link) return status();
    if (answer === 'cancel') return disconnect();
    if (answer === 'sheet') {
      await adoptSheet(link);
    } else if (answer === 'device') {
      // The sheet becomes the baseline; everything that differs here is then pushed,
      // including deletions for sheet records this device does not have.
      const sheet = await fetchSheet(link);
      meta = { ...meta, baseline: sheet.view, serverRevision: sheet.serverRevision, pendingOp: null, conflicts: [], awaiting: null };
      await persist();
    } else throw Error('Choose the sheet, this device, or cancel.');
    emit();
    return sync();
  }

  /** Settle one conflict: 'mine' sends this device's version, 'sheet' takes the sheet's. */
  async function resolve(table, id, keep) {
    const index = conflictIndex(table, id);
    if (index < 0) return status();
    const conflict = meta.conflicts[index];
    if (keep === 'sheet') {
      const next = structuredClone(getState());
      next.settings = { ...next.settings };
      syncPutRecord(next, table, id, conflict.theirs);
      next.revision++;
      await saveState(next); // throws, leaving the conflict open, if the sheet's version does not fit
    } else if (keep !== 'mine') throw Error('Choose “Keep mine” or “Use sheet”.');
    meta.conflicts = meta.conflicts.filter((_, i) => i !== index);
    await persist();
    emit();
    return sync();
  }

  /** Forget the address and secret on this device. Records stay; nothing is deleted anywhere. */
  async function disconnect() {
    clearTimeout(pushTimer);
    connection.clear();
    link = null;
    problem = null;
    if (meta.awaiting) meta = syncBlankMeta();
    await persist();
    emit();
    return status();
  }

  /** Sync on open, on reconnect, on return to the page, and every two minutes while visible. */
  function attach(win = globalThis.window, doc = globalThis.document) {
    const visible = () => doc.visibilityState !== 'hidden';
    const auto = () => { if (visible()) sync({ automatic: true }); };
    const interval = setInterval(auto, SYNC_PULL_EVERY);
    win.addEventListener('online', auto);
    doc.addEventListener('visibilitychange', auto);
    detach = () => { clearInterval(interval); win.removeEventListener('online', auto); doc.removeEventListener('visibilitychange', auto); };
    sync();
  }

  function dispose() {
    clearTimeout(pushTimer);
    detach();
  }

  return { start, status, connect, choose, sync, schedule, resolve, disconnect, attach, dispose, connected: () => !!link };
}

/**
 * The previous interface (legacy.html) used an older sync that no longer
 * exists. This stand-in keeps that page working; sync is set up in the new
 * interface under Settings → Sync.
 */
function createSync({ onStatus = () => {} } = {}) {
  const moved = () => onStatus('Sync has moved to the new interface: Settings → Sync.');
  return { connect: moved, sync: async () => moved(), schedule() {}, resolve: async () => moved(), dispose() {}, connected: () => false };
}

// ---- ui/dom.js ----
// Small DOM and formatting helpers shared by every screen.

/** Where the previous interface lives. The standalone build rewrites this. */
const LEGACY_URL = 'standalone-legacy.html';

/**
 * Create an element.
 * Props: `class`, `text`, `on<event>` listeners, DOM properties (value, type,
 * hidden…) and anything else as an attribute (aria-*, data-*).
 */
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key in node && !key.includes('-')) node[key] = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  node.append(...children.flat().filter(child => child != null && child !== false));
  return node;
}

/** A paper slip: the one main surface of a screen. */
function slip({ label, kind, wide = false }, ...children) {
  const head = el('div', { class: 'slip-head' },
    el('span', { class: 'qid', text: label }),
    kind && el('span', { class: 'kind', text: kind }));
  return el('div', { class: 'slip-wrap' + (wide ? ' slip-wrap--wide' : '') },
    el('section', { class: 'slip' }, head, ...children));
}

/** A small section heading with the red square in front. */
function sectionTitle(text) {
  return el('h2', { class: 'section-title', text });
}

/** Today's date on this device, as YYYY-MM-DD. Dates only; no time zones. */
function todayIso() {
  const now = new Date();
  const pad = number => String(number).padStart(2, '0');
  return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
}

/** 'Thu 12 Nov' for a YYYY-MM-DD date. */
function formatDay(iso) {
  const [year, month, day] = iso.split('-').map(Number);
  return new Date(year, month - 1, day)
    .toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

const CURRENCY_SYMBOLS = { GBP: '£' };

/**
 * Format integer minor units exactly (no floating point).
 * GBP uses its symbol; other currencies show their code so ¥ is never ambiguous.
 * `signed` adds a plus sign to positive amounts.
 */
function formatMoney(minor, currencyCode, precision, { signed = false } = {}) {
  const value = BigInt(minor);
  const negative = value < 0n;
  const absolute = negative ? -value : value;
  const sign = negative ? '−' : signed && absolute > 0n ? '+' : '';
  const digitsText = plainAmount(absolute, precision, true);
  const symbol = CURRENCY_SYMBOLS[currencyCode];
  return symbol ? `${sign}${symbol}${digitsText}` : `${sign}${digitsText} ${currencyCode}`;
}

/** Minor units as a plain decimal string, e.g. 1250 → '12.50'. */
function plainAmount(minor, precision, grouped = false) {
  const value = BigInt(minor);
  const scale = 10n ** BigInt(precision);
  const whole = value / scale;
  const fraction = precision ? '.' + (value % scale).toString().padStart(precision, '0') : '';
  return (grouped ? whole.toLocaleString('en-GB') : whole.toString()) + fraction;
}

/** A readable message for any thrown value. */
function errorMessage(error) {
  return error?.message || 'That did not work. Your earlier records are unchanged.';
}

let toastTimer = 0;

/**
 * Show a short message at the bottom of the screen.
 * `action` ({ label, run }) adds one button, for example Undo; the toast
 * closes when it is used. `duration` is how long the toast stays, in ms.
 */
function showToast(message, action = null, duration = 6000) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.replaceChildren(el('span', { text: message }));
  if (action) {
    toast.append(el('button', {
      type: 'button', class: 'toast-action', text: action.label,
      onclick: () => { clearTimeout(toastTimer); toast.hidden = true; action.run(); }
    }));
  }
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, duration);
}

// Theme choice: System → Light → Dark.
// The choice is stored in this browser and applied as data-theme on <html>.
// With "System" there is no data-theme, and the CSS follows prefers-color-scheme.

const THEME_KEY = 'expense-book.theme'; // shared with the previous version
const THEME_CHOICES = ['system', 'light', 'dark'];
const THEME_LABELS = { system: 'System', light: 'Light', dark: 'Dark' };
const themeListeners = new Set();

// Browser chrome colour: the paper of each theme (see --paper in style.css).
const THEME_COLORS = { light: '#f7f7f5', dark: '#131726' };

// Header button icons, 20×20, drawn in the text colour.
// System is a half-filled disc, Light a sun, Dark a moon.
const ICON_OPEN = '<svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true" focusable="false">';
const THEME_ICONS = {
  system: `${ICON_OPEN}<circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor" stroke="none"/></svg>`,
  light: `${ICON_OPEN}<circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>`,
  dark: `${ICON_OPEN}<path d="M16 11.5A6.5 6.5 0 1 1 8.5 4a5 5 0 0 0 7.5 7.5z"/></svg>`
};

function themeChoices() {
  return THEME_CHOICES.map(value => ({ value, label: THEME_LABELS[value] }));
}

function getThemeChoice() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    return THEME_CHOICES.includes(saved) ? saved : 'system';
  } catch {
    return 'system';
  }
}

function setThemeChoice(choice) {
  if (!THEME_CHOICES.includes(choice)) choice = 'system';
  try {
    localStorage.setItem(THEME_KEY, choice);
  } catch {
    // Storage is unavailable. The choice still applies until the page closes.
  }
  applyTheme(choice);
  for (const listener of themeListeners) listener(choice);
}

/** Call `listener(choice)` whenever the theme choice changes. */
function onThemeChange(listener) {
  themeListeners.add(listener);
}

function applyTheme(choice) {
  const root = document.documentElement;
  if (choice === 'system') delete root.dataset.theme;
  else root.dataset.theme = choice;

  // With a manual choice both theme-color tags carry that theme's paper colour.
  for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
    const own = (meta.getAttribute('media') || '').includes('dark') ? 'dark' : 'light';
    meta.setAttribute('content', THEME_COLORS[choice === 'system' ? own : choice]);
  }
}

/** Wire the header icon button: each press moves to the next choice. */
function initThemeToggle(button) {
  const show = choice => {
    const next = THEME_CHOICES[(THEME_CHOICES.indexOf(choice) + 1) % THEME_CHOICES.length];
    button.innerHTML = THEME_ICONS[choice]; // fixed markup from this file
    button.title = `Theme: ${THEME_LABELS[choice]}`;
    button.setAttribute('aria-label', `Theme: ${THEME_LABELS[choice]}. Switch to ${THEME_LABELS[next]}.`);
  };
  button.addEventListener('click', () => {
    const current = getThemeChoice();
    setThemeChoice(THEME_CHOICES[(THEME_CHOICES.indexOf(current) + 1) % THEME_CHOICES.length]);
  });
  onThemeChange(show);
  applyTheme(getThemeChoice());
  show(getThemeChoice());
}

// ---- ui/ledger.js ----
// The one place the UI reads and writes the ledger.
// State is immutable from the UI's point of view: build the next state with
// the model's commit functions, then hand it to saveLedger().





/** `ledger.state` is the current, validated ledger. */
const ledger = { state: null, store: null };

const ledgerListeners = new Set();

/** Call `listener()` after every successful save. */
function onLedgerChange(listener) {
  ledgerListeners.add(listener);
}

/** Open the browser database and add any default categories or pots it lacks. */
async function openLedger() {
  ledger.store = new LedgerStore();
  ledger.state = await ledger.store.open(todayIso());

  const upgraded = ensureDocumentedCategories(ledger.state);
  if (upgraded !== ledger.state) {
    await ledger.store.write(upgraded, ledger.state.revision);
    ledger.state = upgraded;
  }

  ledger.store.watch(() => showToast('Another tab saved changes. Reload this tab before editing.'));
}

/**
 * Validate and store the next state. The store refuses the write if another
 * tab saved first, so nothing is overwritten silently.
 */
async function saveLedger(next) {
  if (!ledger.state) throw Error('Storage is not ready yet.');
  if (next === ledger.state) return;
  validateState(next);
  await ledger.store.write(next, ledger.state.revision);
  ledger.state = next;
  for (const listener of ledgerListeners) listener();
}

  treemap: ['############', '#.....#....#', '#.....#....#', '#.....#....#', '#.....#....#', '#.....######', '#.....#..#.#', '#.....#..#.#', '#.....#..#.#', '#.....#..#.#', '############', '............']
};

// The icon an account shows when it has none of its own, by account type.
const ACCOUNT_TYPE_ICONS = { current: 'bank', savings: 'safe', credit_card: 'card', cash_wallet: 'wallet', investment: 'chart' };

/** A readable name for an icon ID: 'fork-knife' → 'fork knife'. */
function pixelIconLabel(id) {
  return id.replace(/-/g, ' ');
}

/** One rectangle per horizontal run of ink: [x, y, width]. */
function pixelIconRuns(id, icons = PIXEL_ICONS) {
  const rows = Object.hasOwn(icons, id) ? icons[id] : [];
  const runs = [];
  rows.forEach((row, y) => {
    for (const match of row.matchAll(/#+/g)) runs.push([match.index, y, match[0].length]);
  });
  return runs;
}

/** The icon as SVG markup, or '' for an unknown ID. */
function pixelIconSvg(id) {
  const runs = pixelIconRuns(id);
  if (!runs.length) return '';
  const rects = runs.map(([x, y, width]) => `<rect x="${x}" y="${y}" width="${width}" height="1"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" class="cat-icon cat-icon--pixel" viewBox="0 0 ${PIXEL_ICON_SIZE} ${PIXEL_ICON_SIZE}" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true" focusable="false">${rects}</svg>`;
}

/** The icon as an SVG element, or null for an unknown ID. */
function pixelIconNode(id, icons = PIXEL_ICONS, className = 'cat-icon cat-icon--pixel') {
  const runs = pixelIconRuns(id, icons);
  if (!runs.length) return null;
  const namespace = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(namespace, 'svg');
  const attributes = {
    class: className,
    viewBox: `0 0 ${PIXEL_ICON_SIZE} ${PIXEL_ICON_SIZE}`,
    'shape-rendering': 'crispEdges',
    fill: 'currentColor',
    'aria-hidden': 'true',
    focusable: 'false'
  };
  for (const [name, value] of Object.entries(attributes)) svg.setAttribute(name, value);
  for (const [x, y, width] of runs) {
    const rect = document.createElementNS(namespace, 'rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', width);
    rect.setAttribute('height', 1);
    svg.append(rect);
  }
  return svg;
}

/** The icon for a navigation tab, or null for an unknown tab. */
function navIconNode(id) {
  return pixelIconNode(id, NAV_ICONS, 'tab-icon');
}

/**
 * The element for a category's icon, or null when it has none.
 * Emoji are text; pixel icons are SVG. Both are decorative: the name follows.
 */
function categoryIconNode(icon) {
  if (!icon) return null;
  if (icon.type === 'pixel') return pixelIconNode(icon.value);
  if (icon.type !== 'emoji' || !icon.value) return null;
  const span = document.createElement('span');
  span.className = 'cat-icon cat-icon--emoji';
  span.setAttribute('aria-hidden', 'true');
  span.textContent = icon.value;
  return span;
}

/** The first grapheme of what was typed, so an emoji field holds one symbol. */
function firstGrapheme(text) {
  const trimmed = String(text).trim();
  if (!trimmed) return '';
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    for (const part of new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(trimmed)) return part.segment;
  }
  return [...trimmed][0];
}

/** An account's icon: its own if it has one, otherwise the drawing for its type. */
function accountIconNode(account) {
  return categoryIconNode(account.icon) || pixelIconNode(ACCOUNT_TYPE_ICONS[account.type] || 'bank');
}

// ---- ui/drag-sort.js ----
// Drag to reorder a list, with Pointer Events so it works with a finger on
// iPhone and iPad and with a mouse on a Mac. (The HTML5 drag API does not
// fire on iOS.)
//
// Mark each row with `data-drag-item` and put a dragHandle() inside it. Rows
// are reordered among the direct children of their own list only, so a
// nested list never mixes with its parent's rows.
//
// While dragging, the DOM order is left alone: the row follows the pointer
// with a transform and its neighbours slide aside to show where it will land. Cancelling therefore
// needs no undo; the caller's onDrop is the only thing that changes anything.



/** A copy of `list` with the item at `from` moved so it ends up at index `to`. */
function moveItem(list, from, to) {
  const next = [...list];
  if (!Number.isInteger(from) || from < 0 || from >= next.length) return next;
  const target = Math.max(0, Math.min(next.length - 1, Number.isInteger(to) ? to : from));
  const [item] = next.splice(from, 1);
  next.splice(target, 0, item);
  return next;
}

/**
 * Where a dragged row would land. `midpoints` are the vertical centres of the
 * OTHER rows, top to bottom; the result is the row's index after the drop:
 * the number of other rows whose centre lies above the pointer.
 */
function dropIndex(midpoints, pointerY) {
  let index = 0;
  for (const middle of midpoints) if (pointerY > middle) index += 1;
  return index;
}

/**
 * The `order` values to store after a reorder: [{ item, order }] for every
 * item whose stored order differs from its new position. Items already in
 * place are left out, so one save touches only what changed.
 */
function orderChanges(items) {
  return items
    .map((item, order) => ({ item, order }))
    .filter(({ item, order }) => item.order !== order);
}

const EDGE = 72;       // px from the top or bottom edge where auto-scroll starts
const MAX_SPEED = 14;  // px per frame at the very edge

/** The nearest ancestor that scrolls vertically, or null for the page itself. */
function scrollParent(node) {
  for (let parent = node.parentElement; parent && parent !== document.body; parent = parent.parentElement) {
    const overflow = getComputedStyle(parent).overflowY;
    if ((overflow === 'auto' || overflow === 'scroll') && parent.scrollHeight > parent.clientHeight) return parent;
  }
  return null;
}

/**
 * A grip that drags its row. `onDrop(fromIndex, toIndex)` is called once,
 * only when the row was dropped in a new place. Esc or a cancelled pointer
 * leaves everything as it was.
 */
function dragHandle({ label, onDrop }) {
  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.title = label;
  handle.setAttribute('aria-hidden', 'true'); // the up and down buttons serve keyboards and screen readers
  handle.append(pixelIconNode('grip', UI_ICONS, 'drag-icon'));

  handle.addEventListener('pointerdown', event => {
    if (event.button > 0 || !event.isPrimary) return;
    const item = handle.closest('[data-drag-item]');
    const list = item?.parentElement;
    if (!list) return;
    const rows = [...list.children].filter(child => child.hasAttribute('data-drag-item'));
    const others = rows.filter(row => row !== item);
    const fromIndex = rows.indexOf(item);
    if (rows.length < 2) return;

    event.preventDefault();
    try { handle.setPointerCapture(event.pointerId); } catch { /* the drag still works without capture */ }

    const scroller = scrollParent(list);
    const grabOffset = event.clientY - item.getBoundingClientRect().top;
    // Measure everything once, before anything moves. Positions are kept
    // relative to the list, so page scrolling during the drag doesn't matter.
    const listTop0 = list.getBoundingClientRect().top;
    const itemRect = item.getBoundingClientRect();
    const restingTop = itemRect.top - listTop0;
    const nextRect = rows[fromIndex + 1]?.getBoundingClientRect();
    const prevRect = rows[fromIndex - 1]?.getBoundingClientRect();
    const gap = Math.max(0, nextRect ? nextRect.top - itemRect.bottom : itemRect.top - prevRect.bottom);
    const step = itemRect.height + gap; // how far a neighbour slides to make room
    const middles = others.map(row => {
      const rect = row.getBoundingClientRect();
      return rect.top - listTop0 + rect.height / 2;
    });

    list.classList.add('is-drag-list');
    item.classList.add('is-dragging');
    document.documentElement.classList.add('is-drag-sorting');

    let pointerY = event.clientY;
    let toIndex = fromIndex;
    let frame = 0;
    let done = false;

    function update() {
      const listTop = list.getBoundingClientRect().top;
      const shift = pointerY - grabOffset - listTop - restingTop;
      item.style.transform = `translateY(${Math.round(shift)}px)`;

      // Compare the lifted row's centre with the neighbours' resting centres.
      const centre = restingTop + shift + itemRect.height / 2;
      toIndex = dropIndex(middles, centre);

      // Neighbours slide aside to open a gap where the row will land.
      others.forEach((row, k) => {
        let offset = 0;
        if (k >= fromIndex && k < toIndex) offset = -step;      // was below, now above
        else if (k < fromIndex && k >= toIndex) offset = step;  // was above, now below
        row.style.transform = offset ? `translateY(${offset}px)` : '';
      });
    }

    function autoScroll() {
      if (done) return;
      const top = scroller ? scroller.getBoundingClientRect().top : 0;
      const bottom = scroller ? scroller.getBoundingClientRect().bottom : window.innerHeight;
      let speed = 0;
      if (pointerY < top + EDGE) speed = -Math.ceil(MAX_SPEED * Math.min(1, (top + EDGE - pointerY) / EDGE));
      else if (pointerY > bottom - EDGE) speed = Math.ceil(MAX_SPEED * Math.min(1, (pointerY - (bottom - EDGE)) / EDGE));
      if (speed) {
        (scroller || window).scrollBy(0, speed);
        update();
      }
      frame = requestAnimationFrame(autoScroll);
    }

    function finish(drop) {
      if (done) return;
      done = true;
      cancelAnimationFrame(frame);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
      handle.removeEventListener('lostpointercapture', onUp);
      document.removeEventListener('keydown', onKey, true);
      try { handle.releasePointerCapture(event.pointerId); } catch { /* already released */ }
      document.documentElement.classList.remove('is-drag-sorting');
      const moved = drop && toIndex !== fromIndex;

      if (moved) {
        // Settle the lifted row into the gap; the save then redraws the list
        // in its new order, so nothing visibly jumps.
        const target = toIndex > fromIndex
          ? (toIndex - fromIndex) * step
          : -(fromIndex - toIndex) * step;
        item.classList.add('is-settling');
        item.style.transform = `translateY(${target}px)`;
        onDrop(fromIndex, toIndex);
        // If the save fails and nothing redraws, put the rows back.
        setTimeout(() => { if (item.isConnected) reset(); }, 700);
      } else {
        reset();
      }
    }

    function reset() {
      item.classList.remove('is-dragging', 'is-settling');
      item.style.transform = '';
      others.forEach(row => { row.style.transform = ''; });
      // Let the neighbours glide back before transitions are switched off.
      setTimeout(() => list.classList.remove('is-drag-list'), 200);
    }

    const onMove = moveEvent => { pointerY = moveEvent.clientY; update(); };
    const onUp = () => finish(true);
    const onCancel = () => finish(false);
    const onKey = keyEvent => {
      if (keyEvent.key !== 'Escape') return;
      keyEvent.preventDefault();
      keyEvent.stopPropagation();
      finish(false);
    };

    // Listen on window so a release outside the grip still drops (Safari releases capture early).
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    handle.addEventListener('lostpointercapture', onUp);
    document.addEventListener('keydown', onKey, true);
    update();
    frame = requestAnimationFrame(autoScroll);
  });

  return handle;
}

// ---- ui/categories.js ----
// Category tree helpers and the category picker.
//
// The picker is a grid of equal top-level tiles, icon above label. Tapping a tile with
// subcategories unfolds them in place; nested groups (Travel) fold again
// inside. Choosing a pill, or a tile without children, sets the category.
// The chosen category is shown above the grid, with "Change" to clear it.




/** Children of `parentId` ('' for top level), in the user's order. */
function childCategories(state, parentId, kind, includeArchived = false) {
  return state.categories
    .filter(c => c.kind === kind && (c.parent || '') === parentId && (includeArchived || !c.archived))
    .sort((a, b) => (a.order ?? 1e6) - (b.order ?? 1e6) || a.name.localeCompare(b.name));
}

/** True when `id` is `ancestorId` or sits somewhere beneath it. */
function isWithinCategory(state, id, ancestorId) {
  const seen = new Set();
  while (id && !seen.has(id)) {
    if (id === ancestorId) return true;
    seen.add(id);
    id = state.categories.find(c => c.id === id)?.parent;
  }
  return false;
}

/**
 * Build a picker.
 *   getState()  → current ledger state
 *   kind        → 'expense' or 'income'
 *   value       → selected category ID, or ''
 *   onChange(id)
 * Returns { element, getValue() }.
 */
function createCategoryPicker({ getState, kind = 'expense', value = '', onChange = () => {} }) {
  let selected = value;
  let openTile = '';   // top-level tile whose panel is unfolded
  let openGroup = '';  // nested group unfolded inside that panel
  const element = el('div', { class: 'cat-picker' });

  function choose(id) {
    selected = id;
    openTile = '';
    openGroup = '';
    onChange(id);
    render(id);
  }

  /** `label` replaces the name ("All Bills"); such a pill shows no icon. */
  function pill(category, label) {
    return el('button', {
      type: 'button',
      class: 'pill' + (selected === category.id ? ' is-selected' : ''),
      'aria-pressed': String(selected === category.id),
      onclick: () => choose(category.id)
    }, label ? null : categoryIconNode(category.icon), el('span', { text: label || category.name }));
  }

  /** The unfolded contents of one category: its own pill, leaves, then groups. */
  function branch(state, category) {
    const children = childCategories(state, category.id, kind);
    const leaves = children.filter(child => !childCategories(state, child.id, kind).length);
    const groups = children.filter(child => !leaves.includes(child));

    const nodes = [el('div', { class: 'pill-row' },
      pill(category, `All ${category.name}`),
      leaves.map(leaf => pill(leaf)))];

    for (const group of groups) {
      const isOpen = openGroup === group.id;
      const holdsSelection = isWithinCategory(state, selected, group.id);
      nodes.push(el('div', { class: 'cat-group' },
        el('button', {
          type: 'button',
          class: 'cat-group-head' + (holdsSelection ? ' has-selection' : ''),
          'aria-expanded': String(isOpen),
          'data-cat': group.id,
          onclick: () => { openGroup = isOpen ? '' : group.id; render(group.id); }
        },
          el('span', { class: 'cat-group-name' }, categoryIconNode(group.icon), el('span', { text: group.name })),
          el('span', { class: 'fold-mark', 'aria-hidden': 'true', text: isOpen ? '−' : '+' })),
        isOpen && el('div', { class: 'cat-group-body' }, branch(state, group))));
    }
    return nodes;
  }

  function render(focusId) {
    const state = getState();
    const grid = el('div', { class: 'cat-grid' });

    for (const top of childCategories(state, '', kind)) {
      const hasChildren = childCategories(state, top.id, kind).length > 0;
      const isOpen = openTile === top.id;
      const holdsSelection = isWithinCategory(state, selected, top.id);
      // Labels wrap at spaces only, so a long single word is set a little smaller.
      const isLong = top.name.split(/\s+/).some(word => word.length >= 12);

      grid.append(el('button', {
        type: 'button',
        class: 'cat-tile' + (holdsSelection ? ' is-selected' : '') + (isOpen ? ' is-open' : '') + (isLong ? ' is-long' : ''),
        'data-cat': top.id,
        'aria-expanded': hasChildren ? String(isOpen) : null,
        'aria-pressed': hasChildren ? null : String(selected === top.id),
        onclick: () => {
          if (!hasChildren) return choose(top.id);
          openTile = isOpen ? '' : top.id;
          openGroup = '';
          render(top.id);
        }
      }, categoryIconNode(top.icon), el('span', { class: 'cat-tile-label', text: top.name })));

      // The panel spans the full row, directly under the row of its tile.
      if (isOpen) grid.append(el('div', { class: 'cat-panel' }, branch(state, top)));
    }

    // The selection sits above the grid: icon, path, and a way to clear it.
    const path = [];
    for (let c = state.categories.find(c => c.id === selected); c && !path.includes(c);
      c = state.categories.find(parent => parent.id === c.parent)) path.unshift(c);
    const summary = path.length
      ? el('div', { class: 'cat-summary' },
          categoryIconNode([...path].reverse().find(c => c.icon)?.icon),
          el('strong', { class: 'cat-summary-path', text: path.map(c => c.name).join(' › ') }),
          el('button', {
            type: 'button', class: 'btn-text', text: 'Change', 'aria-label': 'Change category',
            onclick: () => {
              selected = '';
              onChange('');
              render();
              element.querySelector('.cat-tile')?.focus();
            }
          }))
      : el('p', { class: 'cat-summary cat-summary--empty', text: 'No category chosen yet.' });
    element.replaceChildren(summary, grid);

    // Re-rendering drops focus; put it back on the control that was used.
    if (focusId) {
      const selector = `[data-cat="${CSS.escape(focusId)}"]`;
      const top = [...state.categories].find(c => c.id === focusId && !c.parent) ? focusId
        : state.categories.find(c => isWithinCategory(state, focusId, c.id) && !c.parent)?.id;
      (element.querySelector(selector) || (top && element.querySelector(`[data-cat="${CSS.escape(top)}"]`)))?.focus();
    }
  }

  render();
  return { element, getValue: () => selected };
}

// ---- ui/popover.js ----
// One popover at a time. On iPad and wider it is a small panel under the
// button that opened it; on a phone it is a sheet rising from the bottom.
// It closes with an outside tap, Esc, or when the caller closes it.



const POPOVER_WIDE_SCREEN = '(min-width: 768px)';
const POPOVER_EDGE = 8; // smallest gap to the window edge, in px

let currentPopover = null;

/** Close the open popover, if there is one. */
function closePopover(options) {
  currentPopover?.close(options);
}

/**
 * Open `content` in a popover anchored to the button `anchor`.
 *   label    → the heading, also the accessible name
 *   role     → 'dialog' for a panel of controls; leave out when the content
 *              carries its own role (a listbox)
 *   wide     → a fixed, wider panel (for grids)
 *   onClose  → called once, however it closes
 * The content node is only detached on close, so it can be shown again.
 * Returns { close({ restoreFocus }), panel }.
 */
function openPopover({ anchor, content, label, role = null, wide = false, onClose = () => {} }) {
  closePopover();

  const backdrop = el('div', { class: 'popover-backdrop' });
  const panel = el('div', {
    class: 'popover' + (wide ? ' popover--wide' : ''),
    role, 'aria-label': role ? label : null, 'aria-modal': role === 'dialog' ? 'false' : null
  },
    el('div', { class: 'popover-head' },
      el('span', { class: 'popover-title', text: label }),
      el('button', { type: 'button', class: 'btn-text', text: 'Close', onclick: () => close() })),
    content);

  const viewport = window.visualViewport;
  let closed = false;

  /** Place the panel under (or above) its button; on a phone, clear the keyboard. */
  function place() {
    if (!anchor.isConnected) return close({ restoreFocus: false });
    const style = panel.style;
    if (!window.matchMedia(POPOVER_WIDE_SCREEN).matches) {
      const visibleHeight = viewport ? viewport.height : window.innerHeight;
      const hiddenBelow = viewport ? Math.max(0, window.innerHeight - viewport.offsetTop - viewport.height) : 0;
      style.setProperty('--pop-bottom', `${hiddenBelow}px`);
      style.setProperty('--pop-max', `${Math.max(160, visibleHeight - 24)}px`);
      return;
    }
    style.removeProperty('--pop-max');
    const button = anchor.getBoundingClientRect();
    const size = panel.getBoundingClientRect();
    const below = window.innerHeight - button.bottom - 4 - POPOVER_EDGE;
    const above = button.top - 4 - POPOVER_EDGE;
    const goesAbove = size.height > below && above > below;
    const room = Math.max(120, goesAbove ? above : below);
    const top = goesAbove ? button.top - 4 - Math.min(size.height, room) : button.bottom + 4;
    const left = Math.min(Math.max(POPOVER_EDGE, button.left), Math.max(POPOVER_EDGE, window.innerWidth - size.width - POPOVER_EDGE));
    style.setProperty('--pop-top', `${Math.max(POPOVER_EDGE, top)}px`);
    style.setProperty('--pop-left', `${left}px`);
    style.setProperty('--pop-max', `${room}px`);
  }

  function onPointerDown(event) {
    if (panel.contains(event.target) || anchor.contains(event.target)) return;
    close({ restoreFocus: false });
  }
  function onKeyDown(event) {
    if (event.key !== 'Escape') return;
    event.preventDefault();
    close();
  }
  /** Tabbing out of the panel closes it. */
  function onFocusOut(event) {
    const next = event.relatedTarget;
    if (next && !panel.contains(next) && next !== anchor) close({ restoreFocus: false });
  }
  const onNavigate = () => close({ restoreFocus: false });

  function close({ restoreFocus = true } = {}) {
    if (closed) return;
    closed = true;
    if (currentPopover === handle) currentPopover = null;
    document.removeEventListener('pointerdown', onPointerDown, true);
    document.removeEventListener('keydown', onKeyDown, true);
    window.removeEventListener('resize', place);
    window.removeEventListener('scroll', place, true);
    window.removeEventListener('hashchange', onNavigate);
    viewport?.removeEventListener('resize', place);
    viewport?.removeEventListener('scroll', place);
    panel.removeEventListener('focusout', onFocusOut);
    content.remove(); // kept by the caller; only the frame is thrown away
    panel.remove();
    backdrop.remove();
    anchor.setAttribute('aria-expanded', 'false');
    onClose();
    if (restoreFocus && anchor.isConnected) anchor.focus();
  }

  const handle = { close, panel };
  currentPopover = handle;

  document.body.append(backdrop, panel);
  anchor.setAttribute('aria-expanded', 'true');
  place();

  document.addEventListener('pointerdown', onPointerDown, true);
  document.addEventListener('keydown', onKeyDown, true);
  window.addEventListener('resize', place);
  window.addEventListener('scroll', place, true);
  window.addEventListener('hashchange', onNavigate);
  viewport?.addEventListener('resize', place);
  viewport?.addEventListener('scroll', place);
  panel.addEventListener('focusout', onFocusOut);

  return handle;
}

// ---- ui/select.js ----
// Every <select> in the new interface keeps working as before (value, change
// events, disabled), but its native list is replaced by the app's own popover
// list. The select stays in the page, hidden, as the source of truth; a button
// placed right after it shows the chosen option and opens the list.




const buttons = new WeakMap(); // select → its button
let rootObserver = null;
let labelClicksInstalled = false;

/** Enhance every select under `root`, now and whenever one is added later. */
function enhanceSelects(root = document.body) {
  if (!root) return;
  scan(root);
  installLabelClicks();
  if (rootObserver) return;
  rootObserver = new MutationObserver(records => {
    for (const record of records) {
      for (const node of record.removedNodes) {
        // A select taken out on its own takes its button with it.
        if (node.nodeType === 1 && node.matches('select') && !node.isConnected) buttons.get(node)?.remove();
      }
      for (const node of record.addedNodes) {
        if (node.nodeType === 1) scan(node);
      }
    }
  });
  rootObserver.observe(root, { childList: true, subtree: true });
}

function scan(node) {
  const selects = node.matches?.('select') ? [node] : [];
  if (node.querySelectorAll) selects.push(...node.querySelectorAll('select'));
  for (const select of selects) {
    if (select.closest('.legacy')) continue;
    if (select.hasAttribute('data-enhanced')) {
      // Moved elsewhere: bring its button along.
      const button = buttons.get(select);
      if (button && select.isConnected && select.nextSibling !== button) select.after(button);
      continue;
    }
    enhance(select);
  }
}

/** A click on a label focuses the button of the select it belongs to. */
function installLabelClicks() {
  if (labelClicksInstalled) return;
  labelClicksInstalled = true;
  document.addEventListener('click', event => {
    const label = event.target.closest?.('label[for]');
    if (!label) return;
    const target = document.getElementById(label.htmlFor);
    const button = target && buttons.get(target);
    if (!button) return;
    event.preventDefault();
    if (!button.disabled) button.focus();
  });
}

function labelOf(select) {
  const own = select.getAttribute('aria-label');
  if (own) return own.trim();
  if (select.id) {
    const label = document.querySelector(`label[for="${CSS.escape(select.id)}"]`);
    if (label) return label.textContent.trim();
  }
  const wrapping = select.closest('label');
  if (wrapping) {
    // The label's own words, without the select's options or the button's text.
    const copy = wrapping.cloneNode(true);
    copy.querySelectorAll('select, .select-button').forEach(node => node.remove());
    return copy.textContent.trim();
  }
  return '';
}

function enhance(select) {
  if (select.multiple) return; // a list box, not a dropdown
  select.setAttribute('data-enhanced', '');

  // Keep the place the select held in its row before it is hidden.
  const inlineWidth = select.style.width;
  let flex = null;
  if (select.isConnected) {
    const computed = getComputedStyle(select);
    if (computed.flexGrow !== '0' || select.style.flex) {
      flex = `${computed.flexGrow} ${computed.flexShrink} ${computed.flexBasis}`;
    }
  }

  const text = el('span', { class: 'select-button-text' });
  const button = el('button', {
    type: 'button', class: 'select-button',
    'aria-haspopup': 'listbox', 'aria-expanded': 'false'
  }, text, el('span', { class: 'caret', 'aria-hidden': 'true', text: '▾' }));
  if (inlineWidth) button.style.width = inlineWidth;
  if (flex) button.style.flex = flex;
  buttons.set(select, button);

  let popover = null;

  function refresh() {
    const chosen = select.options[select.selectedIndex];
    const value = chosen ? chosen.textContent.trim() : '';
    const label = labelOf(select);
    if (text.textContent !== value) text.textContent = value;
    const name = label ? `${label}: ${value}` : value;
    if (button.getAttribute('aria-label') !== name) button.setAttribute('aria-label', name);
    if (button.disabled !== select.disabled) button.disabled = select.disabled;
    if (button.hidden !== select.hidden) button.hidden = select.hidden;
    if (select.disabled && popover) closePopover();
  }

  function choose(option) {
    const changed = select.selectedIndex !== option.index;
    closePopover();
    if (!changed) return;
    select.selectedIndex = option.index;
    select.dispatchEvent(new Event('input', { bubbles: true }));
    select.dispatchEvent(new Event('change', { bubbles: true }));
    refresh();
  }

  function open() {
    refresh();
    if (select.disabled) return;
    const label = labelOf(select);
    const items = [];   // the choosable rows, in order
    const byItem = new Map();

    const row = (option, groupDisabled) => {
      const disabled = option.disabled || groupDisabled;
      const item = el('li', {
        role: 'option', tabIndex: -1, class: 'pop-option',
        'aria-selected': String(option.index === select.selectedIndex),
        'aria-disabled': disabled ? 'true' : null,
        'data-value': option.value,
        onclick: () => { if (!disabled) choose(option); }
      }, el('strong', { text: option.textContent.trim() || ' ' }));
      if (!disabled) { items.push(item); byItem.set(item, option); }
      return item;
    };

    const rows = [];
    for (const child of select.children) {
      if (child.tagName === 'OPTGROUP') {
        rows.push(el('li', { class: 'pop-group', role: 'presentation', text: child.label }));
        for (const option of child.children) {
          if (option.tagName === 'OPTION') rows.push(row(option, child.disabled));
        }
      } else if (child.tagName === 'OPTION') rows.push(row(child, false));
    }
    const list = el('ul', { class: 'pop-list', role: 'listbox', 'aria-label': label || null }, rows);

    list.addEventListener('keydown', event => {
      if (!items.length) return;
      const at = items.indexOf(document.activeElement);
      let to = -1;
      if (event.key === 'ArrowDown') to = (at + 1) % items.length;
      else if (event.key === 'ArrowUp') to = (at - 1 + items.length) % items.length;
      else if (event.key === 'Home') to = 0;
      else if (event.key === 'End') to = items.length - 1;
      else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (at >= 0) choose(byItem.get(items[at]));
        return;
      } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        // Typing a character jumps to the next option that starts with it.
        const letter = event.key.toLowerCase();
        const order = [...items.slice(at + 1), ...items.slice(0, at + 1)];
        to = items.indexOf(order.find(item => item.textContent.trim().toLowerCase().startsWith(letter)));
      }
      if (to < 0) return;
      event.preventDefault();
      items[to].focus();
    });

    popover = openPopover({
      anchor: button, content: list, label: label || 'Choose',
      onClose: () => { popover = null; }
    });
    const start = items.find(item => item.getAttribute('aria-selected') === 'true') || items[0];
    start?.focus();
  }

  button.addEventListener('click', () => (popover ? closePopover() : open()));
  button.addEventListener('keydown', event => {
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    event.preventDefault();
    if (!popover) open();
  });

  // Hide the native control; it stays in the page as the source of truth.
  select.classList.add('select-native');
  select.tabIndex = -1;
  select.setAttribute('aria-hidden', 'true');
  select.after(button);

  // Stay in step when code sets .value / .selectedIndex directly…
  for (const name of ['value', 'selectedIndex']) {
    const native = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, name);
    if (!native?.set) continue;
    Object.defineProperty(select, name, {
      configurable: true,
      enumerable: native.enumerable,
      get() { return native.get.call(this); },
      set(next) { native.set.call(this, next); refresh(); }
    });
  }
  // …when its options or attributes change, and when it changes itself.
  new MutationObserver(refresh).observe(select, {
    childList: true, subtree: true, attributes: true, characterData: true
  });
  select.addEventListener('change', refresh);

  // Screens restore focus after a redraw by `data-focus`, and may focus the
  // select itself before this runs: send that focus on to the button.
  if (select.dataset.focus) button.dataset.focus = select.dataset.focus;
  select.addEventListener('focus', () => button.focus());

  refresh();
  if (document.activeElement === select) button.focus();
}

// ---- ui/accounts-picker.js ----
// The account picker: currency tabs over a grid of account tiles, built like
// the category picker. Each tile shows an icon, the name and the balance.





/** Currencies of the given accounts: the user's active order first, then any others. */
function accountCurrencies(state, accounts) {
  const used = new Set(accounts.map(account => account.currency));
  const ordered = state.settings.activeCurrencies.filter(code => used.has(code));
  return [...ordered, ...[...used].filter(code => !ordered.includes(code)).sort()];
}

/**
 * Build a picker.
 *   getState()         → current ledger state
 *   getAccounts(state) → the accounts to offer
 *   value              → selected account ID, or '' for no account
 *   currency           → the entry currency; its tab is shown first
 *   today              → balances are shown as of this day
 *   onChange(id)
 *   chosenLabel        → the words before the chosen account's name (default 'Paid from')
 * Returns { element, getValue(), showCurrency(code) }.
 */
function createAccountPicker({ getState, getAccounts, value = '', currency = '', today, onChange = () => {}, chosenLabel = 'Paid from' }) {
  let selected = value;
  let tab = currency; // '' is the "All" tab
  const element = el('div', { class: 'acct-picker' });

  function render(focusSelector) {
    const state = getState();
    const accounts = getAccounts(state);
    const codes = accountCurrencies(state, accounts);
    if (!codes.includes(tab)) tab = '';

    // With a single currency there is nothing to switch between.
    const tabs = codes.length > 1 && el('div', { class: 'segmented acct-tabs', role: 'group', 'aria-label': 'Show accounts in' },
      [...codes.map(code => [code, code]), ['', 'All']].map(([code, label]) => el('button', {
        type: 'button', text: label,
        class: tab === code ? 'is-selected' : '',
        'aria-pressed': String(tab === code),
        'data-acct-tab': code,
        onclick: () => { tab = code; render(`[data-acct-tab="${code}"]`); }
      })));

    const tile = (id, label, icon, balance) => el('button', {
      type: 'button',
      class: 'cat-tile acct-tile' + (selected === id ? ' is-selected' : ''),
      'aria-pressed': String(selected === id),
      'data-acct': id,
      onclick: () => { selected = id; onChange(id); render(`[data-acct="${CSS.escape(id)}"]`); }
    }, icon, el('span', { class: 'cat-tile-label', text: label }),
      balance && el('span', { class: 'acct-balance', text: balance }));

    const shown = accounts.filter(account => !tab || account.currency === tab);
    const grid = el('div', { class: 'cat-grid acct-grid' },
      shown.map(account => tile(account.id, account.name, accountIconNode(account),
        formatMoney(accountBalance(state, account.id, today), account.currency, account.precision))),
      tile('', 'No account', null, ''));

    const chosen = accounts.find(account => account.id === selected);
    element.replaceChildren(...[tabs, grid, el('p', { class: 'cat-chosen' },
      chosen ? [chosenLabel + ' ', el('strong', { text: `${chosen.name} · ${chosen.currency}` })] : 'No account chosen.')].filter(Boolean));

    if (focusSelector) element.querySelector(focusSelector)?.focus();
  }

  render();
  return {
    element,
    getValue: () => selected,
    /** Turn to a currency's tab, when there is one. */
    showCurrency(code) {
      if (code === tab || !accountCurrencies(getState(), getAccounts(getState())).includes(code)) return;
      tab = code;
      render();
    }
  };
}

// ---- ui/currencies.js ----
// Settings → Currencies: the active list and its order, the reporting
// currency, and a rough default rate for each currency. Also the currency
// search that Today's "More currencies…" option shares.







// View state kept between re-renders.
const currencyView = { editingCode: '', adding: false };

/** Change the settings in one save. `change(settings)` edits a copy. */
function saveSettings(change) {
  const next = structuredClone(ledger.state);
  change(next.settings);
  next.revision++;
  return saveLedger(next);
}

/** Switch a currency on, at the end of the user's list. */
function addActiveCurrency(code) {
  digits(code); // throws a readable error for a code this device cannot format
  return saveSettings(settings => {
    if (!settings.activeCurrencies.includes(code)) settings.activeCurrencies.push(code);
  });
}

// Some catalogued codes (funds, metals) have no precision on this device.
const usableCodes = new Map();
function isUsableCurrency(code) {
  if (!usableCodes.has(code)) {
    try { digits(code); usableCodes.set(code, true); } catch { usableCodes.set(code, false); }
  }
  return usableCodes.get(code);
}

/**
 * A search box over the world's currencies. `exclude` hides codes that are
 * already active. `onPick(code)` gets the chosen code.
 */
function buildCurrencySearch({ exclude = [], onPick, onCancel }) {
  const input = el('input', {
    type: 'text', inputMode: 'search', autocomplete: 'off', autocapitalize: 'off', spellcheck: false,
    class: 'cur-search-input', placeholder: 'Code or name, e.g. JPY or yen',
    'aria-label': 'Search currencies', 'data-focus': 'currency-search'
  });
  const results = el('ul', { class: 'cur-results', 'aria-label': 'Matching currencies' });
  const matches = () => searchCurrencies(input.value, exclude).filter(([code]) => isUsableCurrency(code));

  function render() {
    const rows = matches();
    results.replaceChildren(...rows.map(([code, name]) => el('li', {},
      el('button', { type: 'button', class: 'cur-result', onclick: () => onPick(code) },
        el('strong', { text: code }), el('span', { text: name })))));
    if (!rows.length) results.append(el('li', { class: 'empty', text: 'No currency matches that.' }));
  }
  input.addEventListener('input', render);
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault(); // never submit the form this sits in
      const first = matches()[0];
      if (first) onPick(first[0]);
    } else if (event.key === 'Escape') {
      onCancel();
    }
  });
  render();

  return el('div', { class: 'cur-search' },
    el('div', { class: 'cur-search-head' },
      input,
      el('button', { type: 'button', class: 'btn-text', text: 'Cancel', onclick: onCancel })),
    results);
}

/** Why a currency has to stay active, or '' when it can be removed. */
function currencyInUse(state, code) {
  if (code === state.settings.reportingCurrency) return 'it is the reporting currency';
  if (state.accounts.some(a => a.currency === code)) return 'an account uses it';
  if (state.entries.some(e => e.currency === code || e.settledCurrency === code)) return 'entries use it';
  if (state.pots.some(p => p.currency === code)) return 'a pot uses it';
  if (state.trips.some(r => r.currency === code) || state.wishlist.some(r => r.currency === code)
    || state.schedules.some(r => r.entry?.currency === code) || state.settings.salary?.currency === code) {
    return 'a planned item uses it';
  }
  return '';
}

function buildCurrencies(rerender) {
  const state = ledger.state;
  const { activeCurrencies: active, reportingCurrency: reporting } = state.settings;
  const rates = state.settings.defaultRates || {};
  const hasRates = Object.keys(rates).length > 0;
  const reorder = (from, to) => quietly(() => saveSettings(settings => {
